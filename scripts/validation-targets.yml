# Public repositories used to validate the OAuthLint rule pack against
# real-world code.
#
# Selection criteria :
#   - JavaScript / TypeScript dominant
#   - Authentication / OAuth surface area (else there's nothing for the
#     rule pack to fire on, signal vs noise becomes 0)
#   - Permissive license (we never fork them; we just clone read-only)
#   - Active in the last 12 months
#   - Mix of "auth library" (where firing rules indicates a real bug)
#     and "app using auth" (where firing rules is the expected case)
#
# `expectedSignal` is a soft hint :
#   - "high"   → we expect ≥ 3 rules to fire, this is a representative
#                example of "code in the wild that AI tools produce"
#   - "low"    → mature library, firing rules indicates likely false
#                positive — anything firing here goes into a triage
#                queue, not the "we caught a bug" celebration column
#
# Don't add targets just to inflate numbers; only add repos whose code
# you'd be willing to read for ~15 minutes when investigating a finding.
version: 1

targets:
  # ─────────────────────────────────────────────────────────────
  # Mature OAuth libraries — should produce very few findings.
  # Each finding here is a candidate FP for triage.
  # ─────────────────────────────────────────────────────────────
  - repo: panva/node-openid-client
    ref: main
    expectedSignal: low
    notes: Mature OIDC RP client. Findings here are almost certainly FPs.

  - repo: panva/jose
    ref: main
    expectedSignal: low
    notes: Modern JWT / JWS / JWE library. Should fire zero rules.

  - repo: nextauthjs/next-auth
    ref: main
    expectedSignal: low
    notes: Auth.js / NextAuth.js — the most-used auth library in the JS ecosystem.

  # ─────────────────────────────────────────────────────────────
  # Mature Python auth libraries — exercise the Python rule pack.
  # Findings here are candidate FPs for triage (verified 0 at add time).
  # ─────────────────────────────────────────────────────────────
  - repo: jpadilla/pyjwt
    ref: main
    expectedSignal: low
    notes: Reference PyJWT library. Python rules should fire zero on its source.

  - repo: lepture/authlib
    ref: main
    expectedSignal: low
    notes: Authlib — OAuth/OIDC for Python. Should fire zero on its source.

  - repo: pallets/flask
    ref: main
    expectedSignal: low
    notes: Flask core. Exercises the Flask SECRET_KEY rule against clean code.

  - repo: encode/django-rest-framework
    ref: main
    expectedSignal: low
    notes: DRF framework code. Exercises the DRF permission/authentication rules against clean code.

  - repo: maxcountryman/flask-login
    ref: main
    expectedSignal: low
    notes: Flask-Login. Exercises the Flask session / remember-cookie rules against clean code.

  # ─────────────────────────────────────────────────────────────
  # Mature Go auth libraries — exercise the Go rule pack.
  # (golang-jwt itself is intentionally NOT listed: it *implements* the
  #  none/ParseUnverified primitives, so its own source and CLI trip the
  #  rules by design — it is not a representative "app" target.)
  # ─────────────────────────────────────────────────────────────
  - repo: golang/oauth2
    ref: main
    expectedSignal: low
    notes: Go OAuth2 client library. Go rules should fire zero on its source.

  - repo: gorilla/sessions
    ref: main
    expectedSignal: low
    notes: Gorilla session store. Exercises the Go cookie rule against clean code.

  # ─────────────────────────────────────────────────────────────
  # Mature Java apps — exercise the Java rule pack.
  # (spring-security itself is not listed: its integration tests use
  #  permitAll() as scaffolding, which is expected, not representative.)
  # ─────────────────────────────────────────────────────────────
  - repo: spring-projects/spring-petclinic
    ref: main
    expectedSignal: low
    notes: Canonical Spring sample app. Java rules should fire zero on its source.

  # ─────────────────────────────────────────────────────────────
  # Mature Rust auth libraries — exercise the Rust rule pack.
  # (jsonwebtoken itself is not listed: its tests/examples exercise
  #  insecure_disable_signature_validation & hardcoded keys by design.)
  # ─────────────────────────────────────────────────────────────
  - repo: seanmonstar/reqwest
    ref: main
    expectedSignal: low
    notes: Rust HTTP client. Rust rules should fire zero on its source.

  - repo: ramosbugs/oauth2-rs
    ref: main
    expectedSignal: low
    notes: Rust OAuth2 client library. Should fire zero on its source.

  # ─────────────────────────────────────────────────────────────
  # Mature NestJS / Fastify framework code. Exercises the nestjs and
  # fastify rule packs. Their own test / benchmark / integration / type-test
  # trees exercise the dangerous shapes by design (excluded via paths); the
  # library source proper should fire zero.
  # ─────────────────────────────────────────────────────────────
  - repo: nestjs/nest
    ref: main
    expectedSignal: low
    notes: NestJS core. nestjs rules should fire zero on its library source.

  - repo: fastify/fastify-jwt
    ref: main
    expectedSignal: low
    notes: "@fastify/jwt plugin. fastify-jwt rule should fire zero on its source."

  - repo: fastify/session
    ref: main
    expectedSignal: low
    notes: "@fastify/session plugin. fastify cookie/session rule should fire zero on its source."

  - repo: fastify/fastify-cors
    ref: main
    expectedSignal: low
    notes: "@fastify/cors plugin. fastify cors rule should fire zero on its source."

  # ─────────────────────────────────────────────────────────────
  # Auth-heavy apps — expect a richer signal.
  # ─────────────────────────────────────────────────────────────
  - repo: directus/directus
    ref: main
    expectedSignal: high
    notes: Headless CMS with JWT + OAuth. Reasonable proxy for "real app".

  - repo: supabase/auth
    ref: main
    expectedSignal: high
    notes: Supabase Auth server (Go primarily — only TS fixtures will fire).

  # ─────────────────────────────────────────────────────────────
  # AI-generated / vibe-coded starter templates — the target audience.
  # These are where we expect the bulk of "real" findings.
  # ─────────────────────────────────────────────────────────────
  - repo: stackblitz/bolt.new
    ref: main
    expectedSignal: high
    notes: AI app builder. Expect classic OAuth / cookie omissions.

  - repo: vercel/ai-chatbot
    ref: main
    expectedSignal: high
    notes: Vercel AI chatbot starter, heavily copied by indie devs.

  # ─────────────────────────────────────────────────────────────
  # C# / .NET auth libraries — mature, should produce very few
  # findings. Validated at 0 findings when the pack shipped.
  # ─────────────────────────────────────────────────────────────
  - repo: jwt-dotnet/jwt
    expectedSignal: low
  - repo: openiddict/openiddict-core
    expectedSignal: low
  - repo: IdentityModel/IdentityModel
    expectedSignal: low
  # ─────────────────────────────────────────────────────────────
  # C# / .NET app — auth-heavy, findings are the expected case.
  # ─────────────────────────────────────────────────────────────
  - repo: dotnet-architecture/eShopOnWeb
    expectedSignal: high

  # ─────────────────────────────────────────────────────────────
  # MCP official SDKs — the `mcp/` + `py/mcp/` rule pack targets these.
  # Their LIBRARY SOURCE (packages/*/src, src/mcp) must fire ZERO rules
  # (validated 2026-08-11: 0 findings on lib source; example/docs demos
  # fire the expected true positives). Any lib-source finding = triage.
  # ─────────────────────────────────────────────────────────────
  - repo: modelcontextprotocol/typescript-sdk
    ref: main
    expectedSignal: low
    notes: Official MCP TS SDK. Lib source must stay at 0; examples/ are insecure demos.
  - repo: modelcontextprotocol/python-sdk
    ref: main
    expectedSignal: low
    notes: Official MCP Python SDK (mcp / FastMCP). Lib source must stay at 0; docs_src are demos.
