  - id: auth.flow.weak-bcrypt-rounds
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A bcrypt cost factor below 10 was used. A low work factor makes the
      hash cheap to compute, which lets an attacker brute-force stolen
      password hashes far too quickly. OWASP recommends a bcrypt cost of at
      least 10, and ≥ 12 for new applications, tuned so a single hash takes
      roughly 250ms on your hardware.

      Common LLM-generated mistake: `bcrypt.hash(pw, 8)` or
      `bcrypt.genSalt(5)` because the literal "looks fast enough". Raise the
      cost factor to 12 or higher.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-007
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-weak-bcrypt-rounds
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      technology:
        - bcrypt
        - bcryptjs
    patterns:
      - pattern-either:
          - pattern: bcrypt.hash($PW, $N)
          - pattern: bcrypt.hash($PW, $N, ...)
          - pattern: bcrypt.hashSync($PW, $N)
          - pattern: bcrypt.hashSync($PW, $N, ...)
          - pattern: bcrypt.genSalt($N)
          - pattern: bcrypt.genSalt($N, ...)
          - pattern: bcrypt.genSaltSync($N)
          - pattern: bcrypt.genSaltSync($N, ...)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10
  - id: auth.flow.weak-password-hash
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A password is being hashed with a fast, general-purpose hash
      (MD5/SHA-1/SHA-256/SHA-512 via `crypto.createHash`). These functions
      are designed to be FAST, so an attacker who steals the database can
      brute-force billions of candidate passwords per second on commodity
      GPUs. Salting alone does not fix this.

      Use a dedicated, deliberately-slow password hashing function instead:
      `bcrypt`, `argon2` (argon2id), or `scrypt` (`crypto.scrypt`). These add
      a tunable work factor that makes large-scale brute-forcing infeasible.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-006
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/916.html
      technology:
        - node:crypto
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: crypto.createHash($ALGO).update($PW).digest(...)
              - pattern: createHash($ALGO).update($PW).digest(...)
              - pattern: crypto.createHash($ALGO).update($PW, ...).digest(...)
              - pattern: createHash($ALGO).update($PW, ...).digest(...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: ^(["'])(?i)(md5|sha1|sha-1|sha224|sha256|sha-256|sha384|sha512|sha-512)\1$
          - metavariable-pattern:
              metavariable: $PW
              patterns:
                - pattern: $PWNAME
                - metavariable-regex:
                    metavariable: $PWNAME
                    regex: (?i)^.*(password|passwd|pwd)$
      - patterns:
          - pattern-either:
              - pattern: $H.update($PW)
              - pattern: $H.update($PW, ...)
          - metavariable-pattern:
              metavariable: $PW
              patterns:
                - pattern: $PWNAME
                - metavariable-regex:
                    metavariable: $PWNAME
                    regex: (?i)^.*(password|passwd|pwd)$
          - pattern-either:
              - pattern-inside: |
                  $H = crypto.createHash($ALGO);
                  ...
              - pattern-inside: |
                  $H = createHash($ALGO);
                  ...
          - metavariable-regex:
              metavariable: $ALGO
              regex: ^(["'])(?i)(md5|sha1|sha-1|sha224|sha256|sha-256|sha384|sha512|sha-512)\1$
  - id: auth.go.cookie.gin-insecure
    languages:
      - go
    severity: ERROR
    message: |
      A Gin auth/session cookie is written with `secure` or `httpOnly` set to a
      literal `false`. `gin.Context.SetCookie` takes them positionally:
      `SetCookie(name, value, maxAge, path, domain, secure, httpOnly)`. With
      `secure=false` the cookie rides over plain HTTP where a network attacker
      can read it; with `httpOnly=false` any XSS can read it from JavaScript.
      For OAuth/OIDC this exposes session and token cookies to theft and
      hijacking (CWE-1004, CWE-614). LLM-generated Gin handlers frequently pass
      `false, false` to "make it work" over http://localhost.

      Set both flags to `true` on auth cookies:
        c.SetCookie("session_id", tok, 3600, "/", "", true, true)
    metadata:
      oauthlint-rule-id: AUTH-GO-COOKIE-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-cookie-gin-insecure
      category: security
      cwe: CWE-1004
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/github.com/gin-gonic/gin#Context.SetCookie
        - https://cwe.mitre.org/data/definitions/1004.html
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - gin
    patterns:
      - pattern-either:
          - pattern: $C.SetCookie($NAME, $V, $MA, $P, $D, false, $HO)
          - pattern: $C.SetCookie($NAME, $V, $MA, $P, $D, $S, false)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^["']?.*(sess|sid|auth|token|jwt|csrf|xsrf|login|remember|access|refresh|oauth|oidc)
  - id: auth.go.cookie.insecure
    languages:
      - go
    severity: ERROR
    message: |
      A session/auth `http.Cookie` is created with a security attribute
      explicitly disabled (`Secure: false` or `HttpOnly: false`). With
      `Secure: false` the cookie is sent over plain HTTP, so a network
      attacker can read the session token. With `HttpOnly: false` the cookie
      is readable from JavaScript, so any XSS can steal it. For OAuth/OIDC
      this exposes session and token cookies to theft and hijacking.

      Set `Secure: true` and `HttpOnly: true` on auth cookies, and add an
      appropriate `SameSite` mode (for example `SameSite: http.SameSiteLaxMode`).
    metadata:
      oauthlint-rule-id: AUTH-GO-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/net/http#Cookie
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - net/http
    patterns:
      - pattern-inside: http.Cookie{...}
      - pattern: "$FIELD: false"
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^(Secure|HttpOnly)$
    fix: "$FIELD: true"
  - id: auth.go.cors.allow-all
    languages:
      - go
    severity: ERROR
    message: |
      CORS is configured to allow every origin with the wildcard `*`. Any
      website can then make cross-origin requests to this endpoint, defeating
      the same-origin policy (CWE-942). This is a common AI-generated mistake:
      `AllowAllOrigins: true`, `AllowedOrigins: []string{"*"}`, or a raw
      `Access-Control-Allow-Origin: *` header is pasted in to "make the browser
      call work" and the intended scope is never added. Combined with
      credentials this becomes an account-takeover primitive that leaks
      OAuth/OIDC tokens cross-origin.

      Restrict CORS to an explicit allowlist of trusted origins instead, for
      example `AllowOrigins: []string{"https://app.example.com"}` (gin-contrib),
      `AllowedOrigins: []string{"https://app.example.com"}` (rs/cors), or
      `w.Header().Set("Access-Control-Allow-Origin", "https://app.example.com")`.
    metadata:
      oauthlint-rule-id: AUTH-GO-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-cors-allow-all
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/gin-contrib/cors
        - https://github.com/rs/cors
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - gin
        - rs-cors
        - net/http
    pattern-either:
      - pattern: "cors.Config{..., AllowAllOrigins: true, ...}"
      - pattern: 'cors.Options{..., AllowedOrigins: []string{..., "*", ...}, ...}'
      - pattern: $W.Header().Set("Access-Control-Allow-Origin", "*")
  - id: auth.go.cors.echo-wildcard
    languages:
      - go
    severity: ERROR
    message: |
      An Echo CORS middleware is configured to allow every origin with the
      wildcard `"*"`. Echo uses its own `middleware.CORSConfig` struct, which is
      missed by the generic `cors.Config` / `cors.Options` CORS checks. A
      wildcard origin lets any website make cross-origin requests to this API,
      defeating the same-origin policy (CWE-942); with `AllowCredentials: true`
      it becomes an account-takeover primitive that leaks OAuth/OIDC tokens
      cross-origin. LLM-generated Echo setups often paste `[]string{"*"}` to
      "make the browser call work".

      Restrict to an explicit allowlist, e.g.
        middleware.CORSConfig{AllowOrigins: []string{"https://app.example.com"}}
      and never combine a wildcard origin with credentials.
    metadata:
      oauthlint-rule-id: AUTH-GO-CORS-003
      oauthlint-doc-url: https://oauthlint.dev/rules/go-cors-echo-wildcard
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://echo.labstack.com/docs/middleware/cors
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - echo
    pattern: 'middleware.CORSConfig{..., AllowOrigins: []string{..., "*", ...}, ...}'
  - id: auth.go.cors.fiber-wildcard
    languages:
      - go
    severity: ERROR
    message: |
      A Fiber CORS middleware is configured with the wildcard origin `"*"`.
      Fiber's `cors.Config.AllowOrigins` is a single comma-separated STRING (not
      a `[]string`), so this shape is missed by the generic slice/`AllowAllOrigins`
      CORS checks. `"*"` lets any website make cross-origin requests to this
      API, defeating the same-origin policy (CWE-942); combined with
      `AllowCredentials: true` it becomes an account-takeover primitive that
      leaks OAuth/OIDC tokens cross-origin. This is a common AI-generated
      default pasted in to "make the browser call work".

      Restrict to an explicit allowlist, e.g.
        cors.Config{AllowOrigins: "https://app.example.com"}
      and never combine a wildcard origin with credentials.
    metadata:
      oauthlint-rule-id: AUTH-GO-CORS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-cors-fiber-wildcard
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://docs.gofiber.io/api/middleware/cors
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - fiber
    patterns:
      - pattern: "cors.Config{..., AllowOrigins: $O, ...}"
      - metavariable-regex:
          metavariable: $O
          regex: ^"(\*|[^"]*,\s*\*|\*\s*,[^"]*)"$
  - id: auth.go.crypto.bcrypt-low-cost
    languages:
      - go
    severity: WARNING
    message: |
      `bcrypt.GenerateFromPassword` is called with a cost factor below 10. A
      low work factor makes each hash cheap to compute, which lets an attacker
      brute-force stolen password hashes far too quickly. OWASP recommends a
      bcrypt cost of at least 10, and ≥ 12 for new applications, tuned so a
      single hash takes roughly 250ms on your hardware.

      Common LLM-generated mistake: `bcrypt.GenerateFromPassword(pw, 8)`
      because the literal "looks fast enough". Use `bcrypt.DefaultCost` (10)
      or raise the cost factor to 12 or higher.
    metadata:
      oauthlint-rule-id: AUTH-GO-CRYPTO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-crypto-bcrypt-low-cost
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://pkg.go.dev/golang.org/x/crypto/bcrypt#GenerateFromPassword
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/916.html
      technology:
        - bcrypt
    patterns:
      - pattern: bcrypt.GenerateFromPassword($PW, $N)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10
  - id: auth.go.crypto.weak-cipher
    languages:
      - go
    severity: ERROR
    message: |
      A broken or deprecated block/stream cipher is used to protect data. DES
      (`des.NewCipher`) and 3DES (`des.NewTripleDESCipher`) have a 64-bit block
      and are considered insecure (Sweet32, brute-force), while RC4
      (`rc4.NewCipher`) has well-known keystream biases and is forbidden by RFC
      7465. For OAuth/OIDC this means tokens, client secrets, and other
      sensitive material are not adequately protected and may be recovered by
      an attacker.

      Use authenticated AES instead: load the key with `crypto/aes`
      (`aes.NewCipher(key)`) and wrap it in `cipher.NewGCM(block)` to get
      AES-GCM, which provides both confidentiality and integrity.
    metadata:
      oauthlint-rule-id: AUTH-GO-CRYPTO-003
      oauthlint-doc-url: https://oauthlint.dev/rules/go-crypto-weak-cipher
      category: security
      cwe: CWE-327
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://pkg.go.dev/crypto/aes#NewCipher
        - https://pkg.go.dev/crypto/cipher#NewGCM
        - https://cwe.mitre.org/data/definitions/327.html
      technology:
        - crypto/des
        - crypto/rc4
    patterns:
      - pattern-either:
          - pattern: des.NewCipher(...)
          - pattern: des.NewTripleDESCipher(...)
          - pattern: rc4.NewCipher(...)
  - id: auth.go.crypto.weak-password-hash
    languages:
      - go
    severity: ERROR
    message: |
      A password is being hashed with a fast, general-purpose digest from the
      Go standard library (MD5, SHA-1, SHA-256, SHA-512). These algorithms are
      designed to be fast, which makes offline brute-force and rainbow-table
      attacks cheap. They are NOT suitable for storing passwords (CWE-916).

      Use a dedicated, slow password-hashing function with a per-password salt
      and a tunable work factor: bcrypt
      (`golang.org/x/crypto/bcrypt.GenerateFromPassword`), Argon2
      (`golang.org/x/crypto/argon2.IDKey`), or scrypt
      (`golang.org/x/crypto/scrypt.Key`). These resist brute-force by design.
    metadata:
      oauthlint-rule-id: AUTH-GO-CRYPTO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-crypto-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/916.html
        - https://pkg.go.dev/golang.org/x/crypto/bcrypt
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      technology:
        - crypto/md5
        - crypto/sha256
    patterns:
      - pattern-either:
          - pattern: md5.Sum([]byte($PW))
          - pattern: sha1.Sum([]byte($PW))
          - pattern: sha256.Sum256([]byte($PW))
          - pattern: sha512.Sum512([]byte($PW))
          - pattern: $H.Write([]byte($PW))
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd).*
  - id: auth.go.flow.oauth-credential-in-log
    languages:
      - go
    severity: ERROR
    message: |
      An OAuth/OIDC credential from the HTTP request flows into a logging call.
      The tainted value is an authorization `code`, an `access_token` /
      `refresh_token` / `id_token`, a bearer `token`, a `client_secret`, or
      the raw `Authorization` header, and the sink is a `log.*`, `slog.*`,
      `fmt.Print*`, or `logger.*` call. Logs are written to files, shipped to
      aggregators (Datadog, Splunk, CloudWatch) and read by people and systems
      that should never see live credentials. A leaked authorization code or
      token can be replayed to impersonate the user or complete the OAuth
      exchange (CWE-532).

      Never log the raw credential. Redact or mask it before logging, log a
      non-sensitive identifier instead (a user id, a key id), or drop the
      field entirely.
    metadata:
      oauthlint-rule-id: AUTH-GO-FLOW-005
      oauthlint-doc-url: https://oauthlint.dev/rules/go-flow-oauth-credential-in-log
      category: security
      cwe: CWE-532
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.3
        - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      technology:
        - net/http
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query().Get($K)
              - pattern: $R.FormValue($K)
              - pattern: $R.PostFormValue($K)
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^"(code|access[_-]?token|accesstoken|refresh[_-]?token|refreshtoken|id[_-]?token|idtoken|token|client[_-]?secret|clientsecret)"$
      - patterns:
          - pattern: $R.Header.Get($K)
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^"authorization"$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: log.Print(...)
              - pattern: log.Printf(...)
              - pattern: log.Println(...)
              - pattern: log.Fatal(...)
              - pattern: log.Fatalf(...)
              - pattern: log.Fatalln(...)
              - pattern: log.Panic(...)
              - pattern: log.Panicf(...)
              - pattern: slog.Info(...)
              - pattern: slog.Debug(...)
              - pattern: slog.Warn(...)
              - pattern: slog.Error(...)
              - pattern: fmt.Print(...)
              - pattern: fmt.Printf(...)
              - pattern: fmt.Println(...)
      - patterns:
          - pattern: $LOG.$LEVEL(...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^.*log(ger)?$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(Print|Printf|Println|Info|Infof|Infow|Debug|Debugf|Debugw|Warn|Warnf|Warning|Error|Errorf|Errorw|Fatal|Fatalf|Panic|Panicf|Trace|Tracef)$
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
      - pattern: maskToken(...)
  - id: auth.go.flow.open-redirect
    languages:
      - go
    severity: ERROR
    message: |
      Untrusted request data flows into an HTTP redirect destination. An
      attacker who controls the redirect target (via a query parameter, form
      field, or request header) can forward the victim to an arbitrary
      external site while the link still appears to point at your trusted
      domain, a classic open redirect, commonly abused to bypass OAuth
      `redirect_uri` checks and to mount convincing phishing.

      Do not pass request-derived values straight into `http.Redirect(...)`
      or a `Location` header. Validate the destination against an explicit
      allow-list, or restrict it to a known relative path (reject absolute
      URLs, scheme-relative `//host` values, and back-references) before
      redirecting. See CWE-601.
    metadata:
      oauthlint-rule-id: AUTH-GO-FLOW-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-flow-open-redirect
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - net/http
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.Query()
      - pattern: $R.URL.Query()[$K]
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Redirect($W, $R, $DEST, $CODE)
              - pattern: $W.Header().Set("Location", $DEST)
          - focus-metavariable: $DEST
    pattern-sanitizers:
      - pattern: validateRedirect(...)
      - pattern: isAllowedRedirect(...)
      - pattern: $ALLOW.MatchString(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if $ALLOW[$U.Host] {
                ...
              }
  - id: auth.go.flow.secret-in-response
    languages:
      - go
    severity: ERROR
    message: |
      A server-side secret read from the environment flows into an HTTP
      response body, leaking it to the client. Values such as an API key,
      client secret, access key, or private key are meant to stay on the
      server; writing one to the `http.ResponseWriter` (via `Write`,
      `fmt.Fprint(f)`, `io.WriteString`, or a JSON encoder) publishes it to
      every caller, including attackers probing your endpoints.

      Never return a credential to the client. Send only the data the caller
      legitimately needs; if a secret must appear in a debug/diagnostic path,
      redact or mask it first. Read secrets exclusively in server-internal
      code and keep them out of any response payload. See CWE-200.
    metadata:
      oauthlint-rule-id: AUTH-GO-FLOW-004
      oauthlint-doc-url: https://oauthlint.dev/rules/go-flow-secret-in-response
      category: security
      cwe: CWE-200
      owasp: API3:2023
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
      technology:
        - net/http
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: os.Getenv($KEY)
              - pattern: os.LookupEnv($KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(?!"?(next_)?public_)"?.*(secret|password|passwd|token|api[_-]?key|private[_-]?key|client[_-]?secret|credential|access[_-]?key).*"?$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $W.Write($X)
              - pattern: fmt.Fprint($W, $X)
              - pattern: fmt.Fprintf($W, $FMT, $X)
              - pattern: io.WriteString($W, $X)
              - pattern: json.NewEncoder($W).Encode($X)
          - pattern-not: os.Getenv(...)
          - pattern-not: os.LookupEnv(...)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
  - id: auth.go.flow.ssrf
    languages:
      - go
    severity: ERROR
    message: |
      Untrusted request data flows into the URL of an outbound HTTP request.
      An attacker who controls the request target (via a query parameter, form
      field, or request header) can coerce your server into making requests to
      arbitrary destinations, Server-Side Request Forgery (SSRF). This is
      routinely abused to reach internal-only services behind your network
      perimeter and, most damagingly, the cloud instance metadata endpoint
      (e.g. http://169.254.169.254/...), letting an attacker steal short-lived
      credentials and pivot into your cloud account.

      Never pass a request-derived value straight into `http.Get`,
      `http.Post`, `http.NewRequest`, or a client's `Get`/`Post`. Validate the
      destination host against an explicit allow-list (parse the URL and check
      the resolved host/scheme), and reject requests to private, loopback, and
      link-local address ranges before dialing. See CWE-918.
    metadata:
      oauthlint-rule-id: AUTH-GO-FLOW-003
      oauthlint-doc-url: https://oauthlint.dev/rules/go-flow-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - net/http
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.Query()
      - pattern: $R.URL.Query()[$K]
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($URL)
              - pattern: http.Post($URL, ...)
              - pattern: http.Head($URL)
              - pattern: http.NewRequest($M, $URL, ...)
              - pattern: http.NewRequestWithContext($CTX, $M, $URL, ...)
              - pattern: $CLIENT.Get($URL)
              - pattern: $CLIENT.Post($URL, ...)
          - pattern-not: $Q.Query().Get(...)
          - pattern-not: $H.Header.Get(...)
          - focus-metavariable: $URL
    pattern-sanitizers:
      - pattern: validateURL(...)
      - pattern: isAllowedHost(...)
      - pattern: $ALLOW.MatchString(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if $ALLOW[$U.Host] {
                ...
              }
  - id: auth.go.flow.weak-rand
    languages:
      - go
    severity: ERROR
    message: |
      A security-sensitive value is being generated with the `math/rand`
      package. Its name indicates a token, secret, key, password, nonce, OTP,
      or salt. `math/rand` is a deterministic PRNG: its output is predictable
      and an attacker who observes enough values can recover the seed and
      forecast every future token. For OAuth/OIDC this means forgeable
      `state` values, guessable authorization codes, and predictable refresh
      tokens.

      Use `crypto/rand` instead: allocate a byte slice and fill it with
      `rand.Read(b)` (from `crypto/rand`), then hex- or base64url-encode it.
      Never derive a credential from `math/rand`.
    metadata:
      oauthlint-rule-id: AUTH-GO-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-flow-weak-rand
      category: security
      cwe: CWE-330
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/crypto/rand#Read
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - math/rand
    pattern-either:
      - patterns:
          - pattern: $VAR := rand.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(Intn|Int|Int31|Int63|Float64|Perm)$
          - metavariable-pattern:
              metavariable: $VAR
              patterns:
                - pattern-regex: (?i)(token|secret|key|password|nonce|otp|salt)
      - patterns:
          - pattern: $VAR = rand.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(Intn|Int|Int31|Int63|Float64|Perm)$
          - metavariable-pattern:
              metavariable: $VAR
              patterns:
                - pattern-regex: (?i)(token|secret|key|password|nonce|otp|salt)
  - id: auth.go.jwt.echojwt-hardcoded-key
    languages:
      - go
    severity: ERROR
    message: |
      The Echo JWT middleware (`labstack/echo-jwt`) is configured with a
      hardcoded string-literal `SigningKey`. This key verifies every request
      token; committed to source it lets anyone forge a valid JWT for any user
      or role, a complete authentication bypass (CWE-798). An empty key
      (`[]byte("")`) is worse still. It accepts trivially forged tokens. LLMs
      commonly inline `[]byte("secret")` so the middleware "just works".

      Load the key from configuration or a secret store:
        e.Use(echojwt.WithConfig(echojwt.Config{
          SigningKey: []byte(os.Getenv("JWT_SECRET")),
        }))
      Rotate any key already committed.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-007
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-echojwt-hardcoded-key
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/labstack/echo-jwt
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - echo
        - echo-jwt
    patterns:
      - pattern: 'echojwt.Config{..., SigningKey: []byte("..."), ...}'
      - pattern-not-regex: (?i)SigningKey:\s*\[\]byte\(\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)SigningKey:\s*\[\]byte\(\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|<)
  - id: auth.go.jwt.fiber-hardcoded-key
    languages:
      - go
    severity: ERROR
    message: |
      The Fiber JWT middleware (`gofiber/contrib/jwt`) is configured with a
      hardcoded string-literal signing key
      (`SigningKey: jwtware.SigningKey{Key: []byte("...")}`). This key verifies
      every request token; committed to source it lets anyone forge a valid JWT
      for any user or role, a complete authentication bypass (CWE-798). LLMs
      commonly inline `[]byte("secret")` so the middleware "just works".

      Load the key from configuration or a secret store:
        app.Use(jwtware.New(jwtware.Config{
          SigningKey: jwtware.SigningKey{Key: []byte(os.Getenv("JWT_SECRET"))},
        }))
      Rotate any key already committed.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-008
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-fiber-hardcoded-key
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/gofiber/contrib/tree/main/jwt
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fiber
        - gofiber-jwt
    patterns:
      - pattern: 'jwtware.SigningKey{..., Key: []byte("..."), ...}'
      - pattern-not-regex: (?i)Key:\s*\[\]byte\(\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)Key:\s*\[\]byte\(\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|<)
  - id: auth.go.jwt.hardcoded-secret
    languages:
      - go
    severity: ERROR
    message: |
      A JWT HMAC signing/verification key is hardcoded as a string literal in a
      call to golang-jwt. Anyone who can read the source or git history can
      forge or tamper with tokens, which is a complete authentication bypass.

      Load the secret from the environment or a secret manager instead, e.g.
      `key := []byte(os.Getenv("JWT_SECRET"))` and `token.SignedString(key)`.
      Never commit signing keys to source control.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#Token.SignedString
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - golang-jwt
    pattern-either:
      - pattern: $TOKEN.SignedString([]byte("..."))
      - patterns:
          - pattern: return []byte("..."), nil
          - pattern-inside: func(...) (interface{}, error) { ... }
  - id: auth.go.jwt.none-algorithm
    languages:
      - go
    severity: ERROR
    message: |
      A JWT is created or accepted with the `none` algorithm, which produces an
      unsigned token. Anyone can forge such a token by setting `alg: none` and
      omitting the signature, so the server has no way to verify who issued it:
      a complete authentication bypass (CWE-347). In golang-jwt this happens
      when signing with `jwt.SigningMethodNone` or passing the
      `jwt.UnsafeAllowNoneSignatureType` sentinel to `SignedString`.

      Never use the `none` algorithm. Sign tokens with a real algorithm such as
      HS256 (`jwt.SigningMethodHS256`), RS256 (`jwt.SigningMethodRS256`), or
      ES256 (`jwt.SigningMethodES256`) and verify them with the matching key.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-none-algorithm
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#pkg-variables
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - golang-jwt
    pattern-either:
      - pattern: jwt.NewWithClaims(jwt.SigningMethodNone, ...)
      - pattern: jwt.New(jwt.SigningMethodNone, ...)
      - pattern: jwt.New(jwt.SigningMethodNone)
      - pattern: jwt.UnsafeAllowNoneSignatureType
  - id: auth.go.jwt.parse-unverified
    languages:
      - go
    severity: ERROR
    message: |
      A JWT is decoded with `ParseUnverified`, which parses the token WITHOUT
      checking its signature. Any claims read from the result are fully
      attacker-controlled: an attacker can forge arbitrary subjects, scopes,
      or expiry and the token will still parse. Trusting these claims for
      authentication or authorization is a complete auth bypass (CWE-347).

      Verify the signature instead: use `jwt.Parse(tok, keyfunc)` or
      `jwt.ParseWithClaims(tok, claims, keyfunc)` with a `Keyfunc` that returns
      the expected signing key, so a token with a bad or missing signature is
      rejected.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-parse-unverified
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#Parser.ParseUnverified
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - golang-jwt
    pattern: $P.ParseUnverified($TOK, $CLAIMS)
  - id: auth.go.jwt.skip-claims-validation
    languages:
      - go
    severity: WARNING
    message: |
      A JWT parser turns off registered-claims validation with
      `jwt.WithoutClaimsValidation()`. That option disables the `exp`
      (expiry), `nbf` (not-before) and `iat` (issued-at) checks golang-jwt
      performs by default. With validation disabled an expired or
      not-yet-valid token still parses successfully, so a stolen or
      long-expired token is accepted as if it were current (CWE-613).

      Remove `jwt.WithoutClaimsValidation()` and let golang-jwt validate the
      time-based claims. If a specific claim must be relaxed, scope it narrowly
      (e.g. `jwt.WithLeeway(...)`) instead of disabling all claims validation.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-skip-claims-validation
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#ParserOption
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - golang-jwt
    pattern: jwt.WithoutClaimsValidation()
  - id: auth.go.jwt.unchecked-method
    languages:
      - go
    severity: ERROR
    message: |
      A JWT `Keyfunc` returns the verification key without checking `token.Method`, enabling algorithm confusion.
      It is passed to `jwt.Parse`/`jwt.ParseWithClaims` and hands back the key
      without first asserting the signing algorithm. If the server verifies
      RS256 tokens with an RSA public key, an attacker can forge an HS256 token
      using that public key as the HMAC secret, and the library will accept it:
      a complete authentication bypass (CWE-347).

      Always assert the signing method inside the keyfunc before returning the
      key, e.g.:
      `if _, ok := t.Method.(*jwt.SigningMethodHMAC); !ok { return nil, err }`
      (or `*jwt.SigningMethodRSA` / `*jwt.SigningMethodECDSA` as appropriate),
      so a token signed with an unexpected algorithm is rejected.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-unchecked-method
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#Keyfunc
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - golang-jwt
    patterns:
      - pattern-either:
          - pattern: |
              jwt.Parse($TOK, func($T *jwt.Token) (interface{}, error) {
                ...
                return $KEY, nil
              })
          - pattern: |
              jwt.ParseWithClaims($TOK, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
                ...
                return $KEY, nil
              })
      - pattern-not: |
          jwt.Parse($TOK, func($T *jwt.Token) (interface{}, error) {
            ...
            $T.Method
            ...
          })
      - pattern-not: |
          jwt.ParseWithClaims($TOK, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
            ...
            $T.Method
            ...
          })
      - pattern-not: |
          jwt.Parse($TOK, func($T *jwt.Token) (interface{}, error) {
            ...
            if <... $T.Method ...> { ... }
            ...
          })
      - pattern-not: |
          jwt.ParseWithClaims($TOK, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
            ...
            if <... $T.Method ...> { ... }
            ...
          })
  - id: auth.go.jwt.untrusted-verify-key
    languages:
      - go
    severity: ERROR
    message: |
      Untrusted request input flows into the verification key returned by a
      `golang-jwt` `Keyfunc` (or into the `WithValidMethods` allowlist). When
      the attacker controls the key, they sign their own forged token and
      supply the matching key, so every token "verifies": a complete
      authentication bypass. When the attacker controls the accepted methods,
      they can downgrade verification and defeat the signature check (CWE-347,
      Improper Verification of Cryptographic Signature).

      The verification key and the accepted algorithms must be fixed
      server-side. Return the key from trusted configuration or a vetted key
      set keyed by a validated `kid`, and pin accepted methods to a constant
      allowlist. Never resolve them from `r.URL.Query()`, `r.FormValue`, or a
      request header.
    metadata:
      oauthlint-rule-id: AUTH-GO-JWT-006
      oauthlint-doc-url: https://oauthlint.dev/rules/go-jwt-untrusted-verify-key
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://pkg.go.dev/github.com/golang-jwt/jwt/v5#Keyfunc
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
      technology:
        - golang-jwt
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.URL.Query()[$K]
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: $R.PathValue(...)
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              func($T *jwt.Token) ($RET, error) {
                ...
              }
          - pattern: return $SINK, $E
          - focus-metavariable: $SINK
      - patterns:
          - pattern: jwt.WithValidMethods($SINK)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: isAllowedKey(...)
      - pattern: validateKey(...)
      - pattern: isAllowedAlgorithm(...)
      - pattern: validateAlgorithm(...)
  - id: auth.go.oauth.hardcoded-client-secret
    languages:
      - go
    severity: ERROR
    message: |
      An `oauth2.Config` is built with a hardcoded string-literal
      `ClientSecret`. The client secret authenticates your application to the
      authorization server; committed to source control it is one search away
      from compromise, letting an attacker impersonate your client and redeem
      authorization codes for tokens (CWE-798). LLMs routinely inline the secret
      to make an OAuth sample runnable.

      Load it from the environment or a secret manager instead:
        conf := &oauth2.Config{
          ClientID:     os.Getenv("OAUTH_CLIENT_ID"),
          ClientSecret: os.Getenv("OAUTH_CLIENT_SECRET"),
        }
      Rotate any secret already committed.
    metadata:
      oauthlint-rule-id: AUTH-GO-OAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/go-oauth-hardcoded-client-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://pkg.go.dev/golang.org/x/oauth2#Config
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - oauth2
    patterns:
      - pattern: 'oauth2.Config{..., ClientSecret: "...", ...}'
      - pattern-not-regex: (?i)ClientSecret:\s*["']\s*["']
      - pattern-not-regex: (?i)ClientSecret:\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)ClientSecret:\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|client[-_]?secret|<)
  - id: auth.go.oauth.insecure-token-endpoint
    languages:
      - go
    severity: ERROR
    message: |
      An OAuth/OIDC endpoint is being contacted over cleartext `http://`.
      Authorization codes, `client_secret`, access/refresh tokens, and the
      `code_verifier` then travel unencrypted. A network attacker can read
      or rewrite them and take over the flow.

      RFC 6749 §3.1 / §10.9 require TLS for the authorization and token
      endpoints. Use `https://` for every authorize, token, and userinfo
      URL (including `oauth2.Endpoint{AuthURL, TokenURL}`).
      `http://localhost` is fine for local development and is not flagged.
    metadata:
      oauthlint-rule-id: AUTH-GO-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-oauth-insecure-token-endpoint
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.9
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauth2
        - oidc
    patterns:
      - pattern-regex: '"http://[^"\s]+(?:response_type=|client_id=|client_secret=|grant_type=|code_challenge=|/oauth2?/|/connect/token|/o/oauth2|/authorize|/oauth/token)[^"]*"'
      - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
  - id: auth.go.oauth.ropc-grant
    languages:
      - go
    severity: ERROR
    message: |
      OAuth token request uses the Resource Owner Password Credentials
      grant (`grant_type=password`). The app collects the user's password
      and replays it to the authorization server, exactly what OAuth was
      designed to avoid. It cannot support federation, MFA, or step-up
      auth, and any compromise of your service exposes raw user passwords.

      The OAuth 2.0 Security BCP (RFC 9700 §2.4) forbids ROPC and OAuth 2.1
      removes it entirely. Use the authorization-code flow with PKCE
      (`grant_type=authorization_code`) for user login, or
      `client_credentials` for machine-to-machine. With `golang.org/x/oauth2`,
      avoid `Config.PasswordCredentialsToken` and use `AuthCodeURL` /
      `Exchange` instead.
    metadata:
      oauthlint-rule-id: AUTH-GO-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-oauth-ropc-grant
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
        - https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1#section-2.4
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - oauth2
    pattern-either:
      - pattern: $C.PasswordCredentialsToken(...)
      - pattern-regex: '"grant_type"\s*,\s*"password"'
      - pattern-regex: '"grant_type"\s*:\s*\[?\s*\{?\s*"password"'
      - pattern-regex: '[?&"`]grant_type=password(?:[&"`\s\\]|$)'
    paths:
      exclude:
        - "**/test/**"
        - "**/*_test.go"
        - "**/*_test.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/mock*/**"
        - "**/testdata/**"
        - "**/vendor/**"
        - "**/node_modules/**"
  - id: auth.go.oauth.static-state
    languages:
      - go
    severity: WARNING
    message: |
      OAuth authorization request is built with a hardcoded, constant `state`
      value. A static `state` provides ZERO CSRF protection: the whole point
      is an unguessable, per-request value that you store and then compare on
      the callback. A literal that ships in your source is known to everyone
      and identical on every request, so an attacker can forge a matching
      callback.

      Generate `state` fresh per request from a CSPRNG (e.g.
      `crypto/rand` -> `base64.URLEncoding.EncodeToString(b)`), persist it in
      the session/cookie, and verify it when the provider redirects back. With
      `golang.org/x/oauth2`, pass that random value as the first argument to
      `Config.AuthCodeURL(state, ...)`.
    metadata:
      oauthlint-rule-id: AUTH-GO-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/go-oauth-static-state
      category: security
      cwe: CWE-330
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - oauth2
    patterns:
      - pattern: $C.AuthCodeURL("...", ...)
      - pattern-not: $C.AuthCodeURL("", ...)
  - id: auth.go.session.hardcoded-secret
    languages:
      - go
    severity: ERROR
    message: |
      A gorilla/sessions or securecookie store is initialized with a hardcoded
      string-literal key. This key authenticates (and, for securecookie,
      encrypts) every session cookie: anyone who reads the source or git
      history can forge a valid session for any user, a complete
      authentication bypass (CWE-798). This is a common AI-generated shortcut:
      a literal key is inlined so the sample "just works" and is never
      externalized.

      Load the key(s) from configuration or a secret manager and generate them
      with a CSPRNG, e.g.
        store := sessions.NewCookieStore([]byte(os.Getenv("SESSION_KEY")))
      Rotate any key that has already been committed to source control.
    metadata:
      oauthlint-rule-id: AUTH-GO-SESSION-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-session-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/gorilla/sessions
        - https://github.com/gorilla/securecookie
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - gorilla-sessions
        - gorilla-securecookie
    patterns:
      - pattern-either:
          - pattern: sessions.NewCookieStore(..., []byte("..."), ...)
          - pattern: sessions.NewFilesystemStore($P, ..., []byte("..."), ...)
          - pattern: securecookie.New([]byte("..."), ...)
      - pattern-not-regex: (?i)\[\]byte\(\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)\[\]byte\(\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|secret-key|<)
    paths:
      exclude:
        - "**/test/**"
        - "**/*_test.go"
        - "**/example/**"
        - "**/examples/**"
        - "**/vendor/**"
  - id: auth.go.tls.insecure-skip-verify
    languages:
      - go
    severity: ERROR
    message: |
      A `tls.Config` sets `InsecureSkipVerify: true`, disabling TLS certificate verification.
      This turns off verification of the server's certificate chain and host
      name, so any attacker who can intercept the connection can present any
      certificate and read or tamper with the traffic: a classic
      man-in-the-middle hole. For OAuth/OIDC this leaks authorization codes,
      access tokens, and client secrets in transit.

      Never set `InsecureSkipVerify: true`. Leave verification on (the default).
      To trust a private CA in development, set `RootCAs` to a `*x509.CertPool`
      loaded with that CA instead.
    metadata:
      oauthlint-rule-id: AUTH-GO-TLS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/go-tls-insecure-skip-verify
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://pkg.go.dev/crypto/tls#Config
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - crypto/tls
    patterns:
      - pattern-inside: tls.Config{...}
      - pattern: "InsecureSkipVerify: true"
    fix: "InsecureSkipVerify: false"
  - id: auth.go.tls.min-version
    languages:
      - go
    severity: ERROR
    message: |
      A `tls.Config` is created with `MinVersion` pinned to an obsolete
      protocol: SSL 3.0, TLS 1.0, or TLS 1.1. These versions have known
      cryptographic weaknesses (POODLE, BEAST, downgrade attacks) and are
      deprecated by RFC 8996. Allowing them lets an attacker negotiate a
      broken cipher and intercept or tamper with OAuth/OIDC traffic,
      leaking authorization codes, access tokens, and client secrets.

      Set `MinVersion` to at least `tls.VersionTLS12`, and ideally
      `tls.VersionTLS13`, so the handshake refuses obsolete protocols.
    metadata:
      oauthlint-rule-id: AUTH-GO-TLS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/go-tls-min-version
      category: security
      cwe: CWE-326
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://pkg.go.dev/crypto/tls#Config
        - https://datatracker.ietf.org/doc/html/rfc8996
        - https://cwe.mitre.org/data/definitions/326.html
      technology:
        - crypto/tls
    patterns:
      - pattern-inside: tls.Config{...}
      - pattern: "MinVersion: $V"
      - metavariable-regex:
          metavariable: $V
          regex: ^tls\.(VersionSSL30|VersionTLS10|VersionTLS11)$
    fix: "MinVersion: tls.VersionTLS12"
  - id: auth.hono.cookie-insecure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A session/auth cookie is set with Hono's `setCookie(c, name, value, ...)`
      helper WITHOUT the `Secure` flag, or with `secure`/`httpOnly` explicitly
      disabled. Missing `Secure` lets the browser send the cookie over plain
      HTTP where a network attacker can capture it (CWE-614); `httpOnly: false`
      exposes it to `document.cookie`, so any XSS on the origin can steal the
      session (CWE-1004).

      Harden every auth cookie:
        setCookie(c, 'session', value, {
          httpOnly: true, secure: true, sameSite: 'Lax'
        })
      If you genuinely need insecure cookies in dev, gate the value on the
      environment rather than hard-coding `secure: false`.
    metadata:
      oauthlint-rule-id: AUTH-HONO-003
      oauthlint-doc-url: https://oauthlint.dev/rules/hono-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://hono.dev/docs/helpers/cookie
        - https://datatracker.ietf.org/doc/html/rfc6265#section-4.1.2.5
        - https://cwe.mitre.org/data/definitions/1004.html
      technology:
        - hono
    pattern-either:
      - patterns:
          - pattern: setCookie($C, $NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., secure: true, ...}"
                - pattern-not: "{..., secure: $X, ...}"
                - pattern: "{...}"
      - patterns:
          - pattern: setCookie($C, $NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              pattern: "{..., secure: false, ...}"
      - patterns:
          - pattern: setCookie($C, $NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              pattern: "{..., httpOnly: false, ...}"
      - patterns:
          - pattern: setCookie($C, $NAME, $VAL)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
  - id: auth.hono.cors-reflect-credentials
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      Hono's `cors()` middleware is given an `origin` function that reflects the
      caller's origin straight back (`origin: (origin) => origin`) together with
      `credentials: true`. This echoes ANY requesting origin into
      `Access-Control-Allow-Origin` while allowing cookies and `Authorization`
      headers, effectively "allow credentialed cross-site requests from
      anywhere", a CSRF / account-takeover primitive (CWE-942).

      Validate the origin against an allow-list before returning it, or pass an
      explicit list:
        cors({ origin: ['https://app.example.com'], credentials: true })
        cors({ origin: (o) => (allowed.includes(o) ? o : null), credentials: true })
      If the API is public and needs no cookies/auth headers, drop
      `credentials` (defaults to false).

      (A literal `origin: '*'` with credentials is covered by
      auth.cors.wildcard-with-credentials; this rule targets the Hono
      reflect-the-origin function form, which that rule does not match.)
    metadata:
      oauthlint-rule-id: AUTH-HONO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/hono-cors-reflect-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://hono.dev/docs/middleware/builtin/cors
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - hono
    patterns:
      - pattern-either:
          - pattern: "cors({ ..., origin: ($O) => $O, ..., credentials: true, ... })"
          - pattern: "cors({ ..., credentials: true, ..., origin: ($O) => $O, ... })"
          - pattern: "cors({ ..., origin: ($O, $C) => $O, ..., credentials: true, ... })"
          - pattern: "cors({ ..., credentials: true, ..., origin: ($O, $C) => $O, ... })"
  - id: auth.hono.jwt-hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      Hono's `jwt()` middleware from `hono/jwt` is configured with a hard-coded
      `secret` string literal. That key signs and verifies every session token:
      committed to git it is one search away from compromise, and anyone who
      reads it can forge a valid token for any user (CWE-798).

      Load the secret from the environment / Workers binding instead and add a
      placeholder to `.env.example`:
        app.use('/auth/*', jwt({ secret: c.env.JWT_SECRET }))
        app.use('/auth/*', jwt({ secret: process.env.JWT_SECRET }))
      Use at least 32 characters for HMAC algorithms, and rotate the leaked
      value out of source control.

      (The `sign()`/`verify()` helpers with a literal secret are covered by
      auth.jwt.weak-secret; this rule targets the Hono middleware config, which
      that rule does not see.)
    metadata:
      oauthlint-rule-id: AUTH-HONO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/hono-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://hono.dev/docs/middleware/builtin/jwt
        - https://hono.dev/docs/helpers/jwt
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - hono
    patterns:
      - pattern-inside: |
          import { ..., jwt, ... } from 'hono/jwt'
          ...
      - pattern: "jwt({ ..., secret: $S, ... })"
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: ^['"].*['"]$
            - pattern-not-regex: (?i)^['"]\$\{?[A-Za-z_]+\}?['"]$
            - pattern-not-regex: (?i)^['"]<[^'"]*>['"]$
            - pattern-not-regex: (?i)^['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
  - id: auth.java.cookie.insecure
    languages:
      - java
    severity: ERROR
    message: |
      A servlet Cookie is created with a security attribute explicitly
      disabled. `setSecure(false)` lets the cookie travel over plain HTTP,
      and `setHttpOnly(false)` makes it readable from JavaScript. Either way
      a session or auth cookie can be intercepted or stolen (CWE-614). This is
      a common AI-generated mistake where the flag is set to `false` to "make
      it work" over localhost and never switched back.

      Set `cookie.setSecure(true)` and `cookie.setHttpOnly(true)` on every
      session or authentication cookie, and add `SameSite` (e.g. `Strict` or
      `Lax`) to further limit cross-site exposure.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://owasp.org/www-community/controls/SecureCookieAttribute
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - servlet
    pattern-either:
      - pattern: $C.setSecure(false)
      - pattern: $C.setHttpOnly(false)
  - id: auth.java.cors.allow-all
    languages:
      - java
    severity: ERROR
    message: |
      CORS is configured to allow every origin with the wildcard `*`. Any
      website can then make cross-origin requests to this endpoint, defeating
      the same-origin policy (CWE-942). This is a common AI-generated Spring
      mistake: `@CrossOrigin(origins = "*")` or `addAllowedOrigin("*")` is
      pasted in to "make the browser call work" and the intended scope is
      never added. A bare `@CrossOrigin` (no arguments) also defaults to all
      origins.

      Restrict CORS to an explicit allowlist of trusted origins instead, e.g.
      `@CrossOrigin(origins = "https://app.example.com")` or
      `config.setAllowedOrigins(List.of("https://app.example.com"))`. Note that
      `addAllowedOriginPattern("*")` combined with `setAllowCredentials(true)`
      is just as dangerous, because it sends the victim's cookies cross-origin.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-cors-allow-all
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://docs.spring.io/spring-framework/reference/web/webmvc-cors.html
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - spring-web
    pattern-either:
      - pattern: '@CrossOrigin(origins = "*")'
      - pattern: '@CrossOrigin(origins = {..., "*", ...})'
      - pattern: '@CrossOrigin("*")'
      - pattern: |
          @CrossOrigin
          $RET $M(...) { ... }
      - pattern: $C.addAllowedOrigin("*")
      - pattern: $C.setAllowedOrigins($L(..., "*", ...))
  - id: auth.java.cors.credentialed-wildcard
    languages:
      - java
    severity: ERROR
    message: |
      CORS is configured to allow any origin together with credentials. A
      wildcard origin combined with `allowCredentials = true` tells the browser
      to send the victim's cookies and authorization headers to a response that
      any site can read, a cross-origin account-takeover primitive (CWE-942).
      Because browsers reject a literal `*` when credentials are allowed,
      `addAllowedOriginPattern("*")` exists specifically to re-enable this unsafe
      combination, so its very use is the smell.

      Never pair a wildcard origin with credentials. List the exact trusted
      origins (`setAllowedOrigins(List.of("https://app.example.com"))` with
      `setAllowCredentials(true)`) or drop credentials if you genuinely need a
      public, anonymous API.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CORS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/java-cors-credentialed-wildcard
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-framework/reference/web/webmvc-cors.html
        - https://portswigger.net/web-security/cors
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - spring-web
    pattern-either:
      - pattern: '@CrossOrigin(..., origins = "*", ..., allowCredentials = "true", ...)'
      - pattern: '@CrossOrigin(..., allowCredentials = "true", ..., origins = "*", ...)'
      - pattern: '@CrossOrigin(..., value = "*", ..., allowCredentials = "true", ...)'
      - pattern: '@CrossOrigin(..., allowCredentials = "true", ..., value = "*", ...)'
      - pattern: $C.addAllowedOriginPattern("*")
      - pattern: $C.setAllowedOriginPatterns($L(..., "*", ...))
  - id: auth.java.crypto.ecb-mode
    languages:
      - java
    severity: ERROR
    message: |
      A JCA `Cipher` is being created in ECB mode (or with a bare algorithm
      alias that defaults to ECB). ECB encrypts each block independently, so
      identical plaintext blocks produce identical ciphertext blocks. It is
      deterministic and leaks structure/patterns of the plaintext (CWE-327).
      `Cipher.getInstance("AES")`, `"DES"`, `"DESede"`, or `"Blowfish"` with no
      mode specified silently falls back to ECB as well.

      Use an authenticated mode: `Cipher.getInstance("AES/GCM/NoPadding")` with
      a unique 12-byte IV per message. At minimum use CBC with a random IV plus
      a separate HMAC (encrypt-then-MAC). Never use ECB or a bare cipher alias.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CRYPTO-003
      oauthlint-doc-url: https://oauthlint.dev/rules/java-crypto-ecb-mode
      category: security
      cwe: CWE-327
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
      technology:
        - javax.crypto
    patterns:
      - pattern: javax.crypto.Cipher.getInstance($TRANSFORM, ...)
      - metavariable-regex:
          metavariable: $TRANSFORM
          regex: (?i)^"(aes|des|desede|blowfish)(/ecb/.*)?"$
  - id: auth.java.crypto.insecure-random
    languages:
      - java
    severity: ERROR
    message: |
      A security-sensitive value (token, secret, key, password, nonce, OTP, or
      salt) is generated with a non-cryptographic PRNG. `java.util.Random` and
      `Math.random()` are predictable: their output is seeded from system time
      and the internal state can be recovered from a few observed values, so an
      attacker can reconstruct the "random" secret (CWE-330). This is a common
      AI-generated mistake: `new Random().nextInt(...)` gets pasted in to
      produce a token because it looks random enough.

      Use `java.security.SecureRandom` instead. For example,
      `new SecureRandom().nextBytes(buf)` to fill a byte buffer, then encode it
      (Base64/hex) to build the token or secret.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CRYPTO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/java-crypto-insecure-random
      category: security
      cwe: CWE-330
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://docs.oracle.com/javase/8/docs/api/java/security/SecureRandom.html
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - java.util
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $VAR = new java.util.Random(...).$M(...)
              - pattern: $VAR = new Random(...).$M(...)
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(token|secret|key|password|passwd|nonce|otp|salt).*
          - metavariable-regex:
              metavariable: $M
              regex: ^(nextInt|nextLong|nextDouble|nextFloat|nextBoolean)$
      - patterns:
          - pattern: $VAR = Math.random()
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i).*(token|secret|key|password|passwd|nonce|otp|salt).*
      - patterns:
          - pattern-either:
              - pattern: |
                  java.util.Random $RND = new java.util.Random(...);
                  ...
                  $RND.nextBytes($BUF);
              - pattern: |
                  Random $RND = new Random(...);
                  ...
                  $RND.nextBytes($BUF);
          - metavariable-regex:
              metavariable: $BUF
              regex: (?i).*(token|secret|key|password|passwd|nonce|otp|salt).*
  - id: auth.java.crypto.noop-password-encoder
    languages:
      - java
    severity: ERROR
    message: |
      Spring stores passwords with no hashing.

      `NoOpPasswordEncoder` keeps passwords in plaintext and
      `withDefaultPasswordEncoder()` is a builder helper that Spring explicitly
      marks for non-production use only. Either way the stored credential is not
      hashed, so anyone who reads the database or a backup recovers every
      password directly (CWE-256). This is a common AI-generated shortcut: the
      no-op encoder is pasted in to "get login working" and never replaced.

      Hash passwords with a dedicated, slow, salted algorithm. Use
      `new BCryptPasswordEncoder()`, `Argon2PasswordEncoder`, or
      `Pbkdf2PasswordEncoder` instead. A `DelegatingPasswordEncoder` built via
      `PasswordEncoderFactories.createDelegatingPasswordEncoder()` is the
      recommended default.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CRYPTO-005
      oauthlint-doc-url: https://oauthlint.dev/rules/java-crypto-noop-password-encoder
      category: security
      cwe: CWE-256
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
        - https://cwe.mitre.org/data/definitions/256.html
      technology:
        - spring-security
    pattern-either:
      - pattern: NoOpPasswordEncoder.getInstance()
      - pattern: $U.withDefaultPasswordEncoder()
  - id: auth.java.crypto.weak-hash
    languages:
      - java
    severity: WARNING
    message: |
      A broken hash algorithm (MD5 or SHA-1) is being instantiated via JCA
      `MessageDigest.getInstance(...)`. MD5 and SHA-1 are cryptographically
      broken: practical collision attacks exist, so they must NOT be used for
      any security purpose: integrity checks, content/token fingerprints,
      digital signatures, HMAC keys, or deduplication that a trust decision
      depends on (CWE-328 / CWE-327).

      Use SHA-256 or stronger (SHA-384, SHA-512, SHA-3):
      `MessageDigest.getInstance("SHA-256")`. Note: this rule covers the general
      weak-digest case; storing *passwords* needs a dedicated slow hasher
      (BCrypt/Argon2/PBKDF2), which is enforced separately.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CRYPTO-004
      oauthlint-doc-url: https://oauthlint.dev/rules/java-crypto-weak-hash
      category: security
      cwe: CWE-328
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/328.html
        - https://csrc.nist.gov/news/2022/nist-transitioning-away-from-sha-1-for-all-apps
      technology:
        - java
    patterns:
      - pattern: java.security.MessageDigest.getInstance($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^"(md5|sha-?1)"$
  - id: auth.java.crypto.weak-password-hash
    languages:
      - java
    severity: ERROR
    message: |
      A password is being hashed with a fast, general-purpose digest from the
      JCA `MessageDigest` (MD5, SHA-1, SHA-256, SHA-512). These algorithms are
      designed to be fast, which makes offline brute-force and rainbow-table
      attacks cheap. They are NOT suitable for storing passwords (CWE-916).

      Use a dedicated, slow password-hashing function with a per-password salt
      and a tunable work factor: BCrypt (`BCryptPasswordEncoder`), Argon2
      (`Argon2PasswordEncoder`), or PBKDF2 (`Pbkdf2PasswordEncoder` /
      `SecretKeyFactory` with `PBKDF2WithHmacSHA256`). These resist brute-force
      by design.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-CRYPTO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-crypto-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/916.html
        - https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      technology:
        - java.security
    patterns:
      - pattern-either:
          - pattern: $MD.digest($PW.getBytes(...))
          - pattern: $MD.digest($PW)
          - pattern: $MD.update($PW.getBytes(...))
          - pattern: $MD.update($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd).*
      - pattern-inside: |
          MessageDigest $MD = MessageDigest.getInstance("=~/(?i)^(MD5|SHA-?1|SHA-?256|SHA-?512)$/");
          ...
  - id: auth.java.flow.ssrf
    languages:
      - java
    severity: ERROR
    message: |
      Untrusted request input flows into the URL of an outbound HTTP request.
      Because the destination is attacker-controlled, this is a Server-Side
      Request Forgery (CWE-918): an attacker can point the request at internal
      services behind your firewall, or at the cloud metadata endpoint
      (http://169.254.169.254/...) to steal IAM/instance credentials and pivot
      deeper into your infrastructure.

      Never build a request URL straight from a Spring `@RequestParam` /
      `@RequestBody` value or a raw `HttpServletRequest.getParameter(...)` /
      `getHeader(...)` value. Validate the destination against an explicit
      allow-list of hosts (resolve the URL and check its host against the
      allow-list, rejecting private/loopback ranges) before issuing the request
      with `RestTemplate`, `WebClient`, OkHttp, or Apache HttpClient.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-flow-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - spring
        - resttemplate
        - webclient
        - okhttp
        - apache-httpclient
    paths:
      exclude:
        - "**/src/test/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/docs/**"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $RET $M(..., @RequestParam $T $P, ...) {...}
              - pattern: $RET $M(..., @RequestParam(...) $T $P, ...) {...}
              - pattern: $RET $M(..., @RequestBody $T $P, ...) {...}
          - focus-metavariable: $P
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RT.getForObject($URL, ...)
              - pattern: $RT.getForEntity($URL, ...)
              - pattern: $RT.postForObject($URL, ...)
              - pattern: $RT.postForEntity($URL, ...)
              - pattern: $RT.exchange($URL, ...)
              - pattern: $RT.execute($URL, ...)
              - pattern: $WC.uri($URL)
              - pattern: $WC.uri($URL, ...)
              - pattern: $B.url($URL)
              - pattern: new HttpGet($URL)
              - pattern: new HttpPost($URL)
              - pattern: new HttpPut($URL)
              - pattern: new HttpDelete($URL)
              - pattern: new HttpHead($URL)
              - pattern: new URL($URL)
              - pattern: new URI($URL)
          - focus-metavariable: $URL
    pattern-sanitizers:
      - pattern: isAllowedUrl(...)
      - pattern: isAllowedHost(...)
      - pattern: validateUrl(...)
      - pattern: assertAllowedHost(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if (<... $ALLOW.contains(<... $V ...>) ...>) { ... }
  - id: auth.java.jwt.hardcoded-secret
    languages:
      - java
    severity: ERROR
    message: |
      A JWT signing key is hard-coded as a string literal (CWE-798). Anyone with
      access to the source, the compiled artifact, or the version-control history
      can read the secret and forge valid tokens, changing the subject, roles,
      or expiry at will, because the signature will still verify. This is a common
      AI-generated mistake: a placeholder secret is pasted inline to "make signing
      work" and is never moved out of the code.

      Load the signing key from outside the source: an environment variable
      (`System.getenv("JWT_SECRET")`), a configuration property, or a dedicated
      secret manager (Vault, AWS Secrets Manager, etc.). With jjwt, build the key
      from those bytes via `Keys.hmacShaKeyFor(secret.getBytes(...))`. Never commit
      the key, and rotate any secret that has already been checked in.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/java-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/jwtk/jjwt#signing-key
        - https://cwe.mitre.org/data/definitions/798.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      technology:
        - jjwt
    pattern-either:
      - pattern: io.jsonwebtoken.security.Keys.hmacShaKeyFor("...".getBytes(...))
      - pattern: Keys.hmacShaKeyFor("...".getBytes(...))
      - pattern: $B.signWith($ALG, "...")
      - pattern: $P.setSigningKey("...")
      - pattern: $P.setSigningKey("...".getBytes(...))
  - id: auth.java.jwt.no-claims-validation
    languages:
      - java
    severity: WARNING
    message: |
      This JWT is verified for signature but its intended-recipient claims are
      never asserted: the Auth0 `JWT.require(alg)...build()` verifier pins no
      `withIssuer(...)`/`withAudience(...)`, or the jjwt parser sets a signature
      key but pins no `requireIssuer(...)`/`requireAudience(...)`. A valid
      signature only proves the token was minted by whoever holds the key, not
      that it was issued by the expected authority or meant for THIS service. A
      token your provider issued for a different audience (or one minted by any
      party that shares the key) will still verify, enabling token replay across
      services (CWE-345, Insufficient Verification of Data Authenticity). This is
      a common AI-generated mistake: the sample verifies the signature and stops
      there.

      Pin the token's recipient. With Auth0 java-jwt chain
      `.withIssuer("https://your-idp")` and `.withAudience("your-api")` before
      `.build()`; with jjwt chain `.requireIssuer(...)` and `.requireAudience(...)`
      before `.build()`.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/java-jwt-no-claims-validation
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc8725#section-3.8
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        - https://cwe.mitre.org/data/definitions/345.html
      technology:
        - java-jwt
        - jjwt
    pattern-either:
      - pattern-regex: JWT\.require\((?:(?!\.build\(\)|\.withIssuer\(|\.withAudience\(|\.withAnyOfAudience\()[\s\S])*?\.build\(\)
      - pattern-regex: Jwts\.parser(?:Builder)?\(\)(?=(?:(?!\.build\(\))[\s\S])*?\.(?:setSigningKey|verifyWith)\()(?:(?!\.build\(\)|\.requireIssuer\(|\.requireAudience\()[\s\S])*?\.build\(\)
  - id: auth.java.jwt.none-algorithm
    languages:
      - java
    severity: ERROR
    message: |
      A JWT is created or verified with the `none` algorithm, which means there
      is no signature at all. An `alg=none` token can be forged by anyone.
      Changing the subject, roles, or expiry costs nothing because there is no
      signature to verify (CWE-347). This is a common AI-generated mistake: the
      "no signature" algorithm is reached for during prototyping or testing and
      never swapped for a real signing key.

      Always sign and verify with a real algorithm. With jjwt use
      `Jwts.builder()...signWith(key)` and a keyed parser; with Auth0 java-jwt
      use `Algorithm.HMAC256(secret)` / `Algorithm.RSA256(...)` instead of
      `Algorithm.none()`.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/java-jwt-none-algorithm
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc8725#section-2.1
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - jjwt
        - java-jwt
    pattern-either:
      - pattern: io.jsonwebtoken.SignatureAlgorithm.NONE
      - pattern: SignatureAlgorithm.NONE
      - pattern: com.auth0.jwt.algorithms.Algorithm.none()
      - pattern: Algorithm.none()
  - id: auth.java.jwt.unsigned-jwt
    languages:
      - java
    severity: ERROR
    message: |
      This JWT is created or parsed without a signature, so its contents are
      neither authenticated nor tamper-proof (CWE-347). An unsecured ("alg=none")
      token can be forged by anyone. Changing the claims (e.g. the subject or
      roles) costs nothing because there is no signature to verify. This is a
      common AI-generated mistake: the "plaintext"/"unsecured" JWT API is reached
      for during prototyping and never swapped for a signed token.

      Sign tokens and verify their signatures. With nimbus-jose-jwt use
      `SignedJWT` (and verify with a `JWSVerifier`); with jjwt build tokens via
      `Jwts.builder()...signWith(key)` and parse them with `parseSignedClaims`
      (or the legacy `parseClaimsJws`) instead of `parseClaimsJwt` /
      `parsePlaintextJwt`.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-jwt-unsigned-jwt
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://connect2id.com/products/nimbus-jose-jwt/examples/unsecured-jwt
        - https://github.com/jwtk/jjwt#reading-a-jwt
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - jjwt
        - nimbus-jose-jwt
    pattern-either:
      - pattern: new com.nimbusds.jwt.PlainJWT(...)
      - pattern: new PlainJWT(...)
      - pattern: $P.parseClaimsJwt(...)
      - pattern: $P.parsePlaintextJwt(...)
  - id: auth.java.jwt.untrusted-verify-key
    languages:
      - java
    severity: ERROR
    message: |
      Untrusted request input flows into the JWT verification key. When the
      attacker controls the key, they sign their own forged token and supply the
      matching key, so every token "verifies", a complete authentication bypass
      (CWE-347, Improper Verification of Cryptographic Signature).

      The verification key must be fixed server-side. Resolve it from trusted
      configuration, a keystore, or a vetted key set keyed by a validated `kid`,
      never from `request.getParameter(...)` / `request.getHeader(...)` or a
      `@RequestParam` / `@RequestHeader` value.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/java-jwt-untrusted-verify-key
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
        - https://owasp.org/www-project-api-security/
      technology:
        - jjwt
        - nimbus-jose-jwt
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getParameterValues(...)
      - pattern: $REQ.getHeader(...)
      - pattern: $REQ.getHeaders(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $P.setSigningKey($SINK)
              - pattern: $P.verifyWith($SINK)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: new MACVerifier($SINK)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: $KS.getKey(...)
  - id: auth.java.oauth.hardcoded-client-secret
    languages:
      - java
    severity: WARNING
    message: |
      An OAuth 2.0 client secret is hard-coded as a string literal in a Spring
      Security `ClientRegistration` builder (`.clientSecret("...")`). The client
      secret authenticates your application to the authorization server's token
      endpoint; committed to source control it is one search away from
      compromise, letting an attacker impersonate your client to redeem
      authorization codes and mint access tokens (CWE-798). This is a common
      AI-generated mistake: a literal secret is inlined to make the OAuth sample
      "just work" and never externalized.

      Load the secret from outside the source: a `@Value("${...}")`-injected
      property, `System.getenv(...)`, `Environment.getProperty(...)`, or a secret
      manager (Vault, AWS Secrets Manager). In Spring Boot, prefer
      `spring.security.oauth2.client.registration.<id>.client-secret` bound from
      an environment variable. Rotate any secret already checked in.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-OAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/java-oauth-hardcoded-client-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-security/reference/servlet/oauth2/client/core.html
        - https://cwe.mitre.org/data/definitions/798.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      technology:
        - spring-security
    patterns:
      - pattern: $B.clientSecret("...")
      - pattern-not-regex: clientSecret\(\s*"\$\{?[^"]*\}?"
      - pattern-not-regex: clientSecret\(\s*"<[^"]*>"
      - pattern-not-regex: (?i)clientSecret\(\s*"(?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|dummy|sample|secret")
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.java"
        - "**/*Tests.java"
        - "**/samples/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
  - id: auth.java.oauth.insecure-token-endpoint
    languages:
      - java
    severity: ERROR
    message: |
      An OAuth/OIDC endpoint is being contacted over cleartext `http://`.
      Authorization codes, `client_secret`, access/refresh tokens, and the
      `code_verifier` then travel unencrypted: a network attacker can read or
      rewrite them and take over the flow (CWE-319).

      RFC 6749 §3.1 / §10.9 require TLS for the authorization and token
      endpoints. Use `https://` for every authorize, token, and userinfo URL.
      `http://localhost` and loopback addresses are fine for local development
      and are not flagged.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/java-oauth-insecure-token-endpoint
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.9
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauth2
        - oidc
    patterns:
      - pattern-regex: '"http://[^"\s]+(?:response_type=|client_id=|client_secret=|grant_type=|code_challenge=|/oauth2?/|/connect/token|/o/oauth2|/authorize|/oauth/token)[^"]*"'
      - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
  - id: auth.java.oauth.ropc-grant
    languages:
      - java
    severity: ERROR
    message: |
      OAuth token request uses the Resource Owner Password Credentials grant
      (`grant_type=password`). The application collects the user's password and
      replays it to the authorization server, exactly what OAuth was designed
      to avoid. It cannot support federation, MFA, or step-up auth, and any
      compromise of your service exposes raw user passwords (CWE-522).

      The OAuth 2.0 Security BCP (RFC 9700 §2.4) forbids ROPC and OAuth 2.1
      removes it entirely. Use the authorization-code flow with PKCE
      (`grant_type=authorization_code`) for user login, or `client_credentials`
      for machine-to-machine.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-oauth-ropc-grant
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
        - https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1#section-2.4
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - oauth2
        - spring-web
        - okhttp
        - apache-httpclient
    pattern-either:
      - pattern-regex: "[?&\"']grant_type=password(?:[\"'&\\s]|$)"
      - pattern-regex: "[\"']grant_type[\"']\\s*,\\s*[\"']password[\"']"
  - id: auth.java.oauth.static-state
    languages:
      - java
    severity: WARNING
    message: |
      OAuth authorization request sends a hardcoded, constant `state` value. A
      static `state` provides ZERO CSRF protection: the whole point is an
      unguessable, per-request value that you store and then compare on the
      callback. A literal that ships in your source is known to everyone and
      identical on every request, so an attacker can forge a matching callback
      (CWE-330).

      Generate `state` fresh per request from a CSPRNG (`new SecureRandom()` /
      `Base64.getUrlEncoder().encodeToString(randomBytes)`), persist it in the
      session, and verify it when the provider redirects back.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/java-oauth-static-state
      category: security
      cwe: CWE-330
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - oauth2
    patterns:
      - pattern-regex: '"https?://[^"\s]+\?[^"]*response_type=[^"]*"'
      - pattern-regex: '"https?://[^"\s]+\?[^"]*state=[A-Za-z0-9._~%-]+[^"]*"'
  - id: auth.java.session.fixation-disabled
    languages:
      - java
    severity: ERROR
    message: |
      Spring Security session fixation protection is disabled via
      `sessionFixation().none()`. With `none()`, the session ID is NOT
      regenerated when a user authenticates, so an attacker who fixes the
      victim's session ID before login (e.g. by planting a cookie) keeps a
      valid session and hijacks the authenticated account (CWE-384).

      Leave the default (`changeSessionId`) in place, or use `migrateSession()`
      to copy the existing session attributes into a new session ID. Never use
      `none()`.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-SESSION-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-session-fixation-disabled
      category: security
      cwe: CWE-384
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-security/reference/servlet/authentication/session-management.html
        - https://cwe.mitre.org/data/definitions/384.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $S.sessionFixation().none()
      - pattern: $S.sessionFixation($F -> $F.none())
  - id: auth.java.tls.trust-all-certs
    languages:
      - java
    severity: ERROR
    message: |
      TLS hostname verification is disabled. A permissive `HostnameVerifier`
      that returns `true` for every host (or Apache HttpClient's
      `NoopHostnameVerifier`) accepts any certificate regardless of the name
      it was issued for, so a man-in-the-middle can present a certificate for a
      different domain and the connection succeeds (CWE-295). This is a common
      AI-generated mistake: the verifier is stubbed out to "fix" a handshake
      or certificate error during development and shipped to production.

      Never accept all hosts. Leave the default hostname verification in place
      (do not call `setHostnameVerifier`/`setDefaultHostnameVerifier` with a
      permissive verifier), or fix the trust chain by supplying a proper
      truststore so the certificate validates normally.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-TLS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-tls-trust-all-certs
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://docs.oracle.com/javase/8/docs/api/javax/net/ssl/HostnameVerifier.html
      technology:
        - javax.net.ssl
        - apache-httpclient
    pattern-either:
      - patterns:
          - pattern: ($HOST, $SESSION) -> true
          - pattern-either:
              - pattern-inside: $X.setHostnameVerifier(...)
              - pattern-inside: $X.setDefaultHostnameVerifier(...)
      - patterns:
          - pattern: |
              new HostnameVerifier() {
                public boolean verify(String $H, SSLSession $S) { return true; }
              }
          - pattern-either:
              - pattern-inside: $X.setHostnameVerifier(...)
              - pattern-inside: $X.setDefaultHostnameVerifier(...)
      - pattern: new org.apache.http.conn.ssl.NoopHostnameVerifier()
      - pattern: new NoopHostnameVerifier()
      - pattern: org.apache.http.conn.ssl.NoopHostnameVerifier.INSTANCE
      - pattern: NoopHostnameVerifier.INSTANCE
  - id: auth.java.web.csrf-disabled
    languages:
      - java
    severity: ERROR
    message: |
      Spring Security CSRF protection is disabled. With CSRF off, an attacker
      can forge state-changing requests that a logged-in victim's browser
      submits with their session cookie (CWE-352). This is one of the most
      common AI-generated Spring mistakes: `csrf().disable()` is pasted in to
      "make the API work" and never removed.

      Keep CSRF protection enabled. For a stateless API authenticated with
      bearer tokens (not cookies), scope it instead (e.g. ignore specific
      paths or use a `CookieCsrfTokenRepository`) rather than disabling it
      globally.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-001
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-csrf-disabled
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $H.csrf().disable()
      - pattern: $H.csrf($C -> $C.disable())
      - pattern: $H.csrf(AbstractHttpConfigurer::disable)
  - id: auth.java.web.frame-options-disabled
    languages:
      - java
    severity: WARNING
    message: |
      Spring Security's `X-Frame-Options` header is disabled. This header is
      the browser's clickjacking defense. With it off, an attacker can embed
      the application in a hidden `<iframe>` on a malicious page and trick a
      logged-in victim into clicking UI elements they cannot see (CWE-1021).

      Keep `X-Frame-Options` set to DENY or SAMEORIGIN, e.g.
      `frameOptions(f -> f.sameOrigin())` or `frameOptions(f -> f.deny())`. If
      you need to allow framing from a specific set of origins, use a Content
      Security Policy `frame-ancestors` directive instead of disabling the
      protection outright.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-003
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-frame-options-disabled
      category: security
      cwe: CWE-1021
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-security/reference/servlet/exploits/headers.html
        - https://cwe.mitre.org/data/definitions/1021.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $H.frameOptions().disable()
      - pattern: $H.frameOptions($F -> $F.disable())
      - pattern: $H.frameOptions(FrameOptionsConfig::disable)
  - id: auth.java.web.permit-all
    languages:
      - java
    severity: ERROR
    message: |
      Spring Security authorizes every request without authentication via
      `anyRequest().permitAll()`. Because `anyRequest()` is the catch-all
      matcher, this makes the entire application publicly accessible. Any
      endpoint, including state-changing and sensitive ones, can be reached
      without a logged-in user (CWE-862, broken access control). This is a
      common AI-generated Spring mistake: the default-allow line is pasted in
      to "make it work" and the intended access rules are never added.

      Require authentication by default with `anyRequest().authenticated()`,
      and open only the specific public routes explicitly, e.g.
      `requestMatchers("/public/**").permitAll()`. Granting `permitAll()` on a
      specific matcher is fine; granting it on `anyRequest()` is not.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-002
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-permit-all
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $X.anyRequest().permitAll()
  - id: auth.java.web.permit-all-actuator
    languages:
      - java
    severity: WARNING
    message: |
      Spring Security grants `permitAll()` to a sensitive management path. Spring
      Boot Actuator and similar diagnostic endpoints expose health, environment,
      configuration, thread dumps, and heap dumps. Opening them to anonymous
      access leaks secrets and internal state and can enable remote code
      execution (CWE-862, broken access control). This is a common AI-generated
      mistake: the management path is opened to "fix" a probe or scrape and the
      intended authentication is never added.

      Require authentication for management endpoints (e.g.
      `requestMatchers(EndpointRequest.toAnyEndpoint()).hasRole("ADMIN")`) and
      expose only `/actuator/health` (and `/info`) publicly if you must.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-004
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-permit-all-actuator
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - spring-security
        - spring-boot-actuator
    patterns:
      - pattern-either:
          - pattern: $X.requestMatchers($P).permitAll()
          - pattern: $X.antMatchers($P).permitAll()
          - pattern: $X.mvcMatchers($P).permitAll()
      - metavariable-regex:
          metavariable: $P
          regex: (?s).*/(?:actuator|jolokia|heapdump|threaddump|internal)\b.*
  - id: auth.java.web.security-ignoring-all
    languages:
      - java
    severity: ERROR
    message: |
      Spring excludes all paths from the security filter chain.

      `WebSecurity.ignoring()` removes the matched paths from the Spring
      Security filter chain entirely, so they get no authentication,
      authorization, CSRF, or header protection at all. Passing the `/**`
      wildcard excludes every request, leaving the whole application unprotected
      (CWE-862). This is a common AI-generated shortcut to silence security
      errors during development that then ships to production.

      Never `ignoring()` a broad wildcard. Limit it to genuinely static,
      non-sensitive assets, e.g.
      `web.ignoring().requestMatchers("/css/**", "/js/**")`, or better, handle
      authorization inside the filter chain with `permitAll()` on scoped paths
      so the security headers still apply.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-006
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-security-ignoring-all
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.spring.io/spring-security/reference/servlet/configuration/java.html
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $WEB.ignoring().requestMatchers("/**")
      - pattern: $WEB.ignoring().antMatchers("/**")
  - id: auth.java.web.wildcard-permit-all
    languages:
      - java
    severity: ERROR
    message: |
      Spring permits every request via a catch-all matcher.

      The `/**` matcher matches every path, so granting it `permitAll()` makes
      the whole application reachable without authentication, including
      state-changing and sensitive endpoints (CWE-862, broken access control).
      This is a common AI-generated Spring mistake: a wide-open matcher is
      pasted in to "make it work" and the intended access rules are never added.

      Open only the specific public routes explicitly, e.g.
      `requestMatchers("/public/**").permitAll()`, and require authentication by
      default with `anyRequest().authenticated()`. Granting `permitAll()` on a
      scoped path is fine; granting it on `/**` is not.
    metadata:
      oauthlint-rule-id: AUTH-JAVA-WEB-005
      oauthlint-doc-url: https://oauthlint.dev/rules/java-web-wildcard-permit-all
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - spring-security
    pattern-either:
      - pattern: $X.requestMatchers("/**").permitAll()
      - pattern: $X.antMatchers("/**").permitAll()
      - pattern: $X.mvcMatchers("/**").permitAll()
  - id: auth.jwt.alg-none
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      JWTs are being verified with the `none` algorithm in the allowed list.
      An attacker can forge any token by simply setting `alg: none` in the header
      and supplying no signature, because the verification routine will accept it.

      Restrict `algorithms` to the ones you actually use, e.g. ["RS256"] or ["ES256"].
      Never include "none" or "None" in production code paths.

      RFC 7518 §3.6 explicitly warns: "Implementations SHOULD NOT support the
      'none' algorithm in deployed systems."
    metadata:
      oauthlint-rule-id: AUTH-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-alg-none
      category: security
      cwe: CWE-327
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.6
        - https://owasp.org/www-project-api-security/
      technology:
        - jsonwebtoken
        - jose
    pattern-either:
      - pattern: 'jwt.verify($TOKEN, $SECRET, { ..., algorithms: [..., "none", ...], ... })'
      - pattern: 'jwt.verify($TOKEN, $SECRET, { ..., algorithms: [..., "None", ...], ... })'
      - pattern: 'jwt.verify($TOKEN, $SECRET, { ..., algorithms: [..., "NONE", ...], ... })'
      - pattern: 'jwt.decode($TOKEN, { complete: true, algorithms: [..., "none", ...] })'
      - patterns:
          - pattern-inside: |
              import { ..., verify, ... } from 'jsonwebtoken'
              ...
          - pattern-either:
              - pattern: 'verify($TOKEN, $SECRET, { ..., algorithms: [..., "none", ...], ... })'
              - pattern: 'verify($TOKEN, $SECRET, { ..., algorithms: [..., "None", ...], ... })'
              - pattern: 'verify($TOKEN, $SECRET, { ..., algorithms: [..., "NONE", ...], ... })'
  - id: auth.jwt.algorithm-confusion
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A JWT is being verified with HS256 (a symmetric algorithm) but the
      key looks like an RSA / EC public key in PEM format. This is the
      "algorithm confusion" attack: an attacker can sign forged tokens
      with the public key and your code will happily verify them with
      HMAC-SHA256 treating the PEM string as the shared secret.

      Always pin the algorithm to the asymmetric one you actually use
      (e.g. `algorithms: ['RS256']`) and pass the public key only when
      verifying asymmetric tokens.

      RFC 7518 §3.1: the "alg" header must be matched to the key type.
    metadata:
      oauthlint-rule-id: AUTH-JWT-007
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-algorithm-confusion
      category: security
      cwe: CWE-327
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
        - https://owasp.org/www-project-api-security/
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern: jwt.verify($TOKEN, $KEY, $OPTS)
          - metavariable-regex:
              metavariable: $KEY
              regex: -----BEGIN [A-Z ]*PUBLIC KEY-----
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-either:
                    - pattern: '{..., algorithms: ["HS256", ...], ...}'
                    - pattern: '{..., algorithms: ["HS384", ...], ...}'
                    - pattern: '{..., algorithms: ["HS512", ...], ...}'
      - patterns:
          - pattern: jwt.verify($TOKEN, $KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: -----BEGIN [A-Z ]*PUBLIC KEY-----
      - patterns:
          - pattern: jwt.verify($TOKEN, $KEY, $OPTS)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*pub(lic)?
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-either:
                    - pattern: '{..., algorithms: ["HS256", ...], ...}'
                    - pattern: '{..., algorithms: ["HS384", ...], ...}'
                    - pattern: '{..., algorithms: ["HS512", ...], ...}'
  - id: auth.jwt.decode-without-verify
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      `jwt.decode()` from `jsonwebtoken` only parses the token. It does NOT
      verify the signature. Trusting any claim returned by `decode()` (e.g.
      `sub`, `role`, `scope`) lets an attacker forge a token and bypass
      authentication entirely.

      Use `jwt.verify(token, secret, { algorithms: ['RS256'] })`, which checks
      the signature before returning the payload. Only use `decode()` for
      non-security-sensitive inspection (e.g. reading `kid` before verifying).
    metadata:
      oauthlint-rule-id: AUTH-JWT-009
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-decode-without-verify
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/auth0/node-jsonwebtoken#jwtdecodetoken--options
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: jwt.decode($X)
              - pattern: jwt.decode($X, $OPTS)
          - pattern-not: jwt.decode({...})
          - pattern-not: jwt.decode({...}, $OPTS)
          - pattern-not: await jwt.decode(...)
      - patterns:
          - pattern-inside: |
              import { ..., decode, ... } from 'jsonwebtoken'
              ...
          - pattern-either:
              - pattern: decode($X)
              - pattern: decode($X, $OPTS)
          - pattern-not: decode({...})
          - pattern-not: decode({...}, $OPTS)
          - pattern-not: await decode(...)
  - id: auth.jwt.ignore-expiration
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      `ignoreExpiration: true` in a `jsonwebtoken` `verify()` call disables the
      `exp` claim check. An expired token is then accepted as valid forever, so
      a stolen or long-old token never stops working, defeating the whole point
      of short-lived access tokens.

      Remove `ignoreExpiration: true` so the `exp` claim is enforced, and set a
      sane `expiresIn` when signing (`jwt.sign(payload, key, { expiresIn: '15m'
      })`). See CWE-613 (Insufficient Session Expiration).
    metadata:
      oauthlint-rule-id: AUTH-JWT-011
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-ignore-expiration
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/auth0/node-jsonwebtoken#jwtverifytoken-secretorpublickey-options-callback
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - jsonwebtoken
    patterns:
      - pattern-either:
          - pattern-inside: jwt.verify($T, $K, {...})
          - patterns:
              - pattern-inside: |
                  import { ..., verify, ... } from 'jsonwebtoken'
                  ...
              - pattern-inside: verify($T, $K, {...})
      - pattern: "ignoreExpiration: true"
    fix: "ignoreExpiration: false"
  - id: auth.jwt.in-url
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A JWT-looking value (header `eyJ…`) appears in a URL query string
      or fragment. URLs leak into server logs, browser history, the
      `Referer` header (sent to every third-party CDN, ad pixel, and
      analytics script on the destination page), and even copy-paste
      operations. A JWT in a URL is a leaked JWT.

      Send JWTs in the `Authorization: Bearer …` header, or in a
      `Secure; HttpOnly; SameSite` cookie. Never in the URL.

      OWASP ASVS V3.2.3 explicitly forbids credentials in URL parameters.
    metadata:
      oauthlint-rule-id: AUTH-JWT-008
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-in-url
      category: security
      cwe: CWE-598
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://owasp.org/www-project-application-security-verification-standard/
    pattern-either:
      - pattern-regex: "[?&][^=]+=eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
      - pattern-regex: "#[^=]+=eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
      - pattern-regex: /eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+
  - id: auth.jwt.localstorage
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A JWT (or other auth token) is being written to `localStorage`. Any
      XSS that lands on the page can exfiltrate the token via
      `localStorage.getItem(...)`, and unlike `HttpOnly` cookies, there
      is no browser-side mitigation.

      Store auth tokens in an `HttpOnly; Secure; SameSite=Strict` cookie
      set by the server, or in memory only. `sessionStorage` is no safer
      against XSS. It's the same attacker capability.

      OWASP ASVS V3.4: tokens must not be stored where untrusted scripts
      can read them.
    metadata:
      oauthlint-rule-id: AUTH-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-localstorage
      category: security
      cwe: CWE-922
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    pattern-either:
      - patterns:
          - pattern-regex: (?:window\.|globalThis\.|self\.)?(?:localStorage|sessionStorage)\.setItem\([^)]*?(?i:token|jwt|bearer|credential|api[_-]?key)
      - patterns:
          - pattern-regex: (?:window\.|globalThis\.|self\.)?(?:localStorage|sessionStorage)\[\s*['"][^'"]*(?i:token|jwt|bearer|credential|api[_-]?key)[^'"]*['"]\s*\]\s*=
  - id: auth.jwt.no-algorithms-allowlist
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      `jwt.verify(...)` is called without an explicit `algorithms` allowlist.
      Without pinning the accepted algorithms, a token signed with an
      unexpected algorithm (or even `alg: none` on older versions) can be
      accepted, opening the door to algorithm-confusion attacks.

      Always pass the algorithm(s) you actually expect, e.g.
      `{ algorithms: ['RS256'] }`.
    metadata:
      oauthlint-rule-id: AUTH-JWT-010
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-no-algorithms-allowlist
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
        - https://owasp.org/www-project-api-security/
      technology:
        - jsonwebtoken
    pattern-either:
      - pattern: jwt.verify($T, $SECRET)
      - patterns:
          - pattern: jwt.verify($T, $SECRET, $OPTS)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., algorithms: ..., ...}"
                - pattern: "{...}"
  - id: auth.jwt.no-audience
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      JWT is being verified without checking the `aud` (audience) claim.
      A token issued for one of your services (e.g. an internal worker)
      can then be replayed against another service that trusts the same
      key, leading to confused-deputy attacks.

      Pass `{ audience: 'your-api' }` to `jwt.verify` (or validate the
      `aud` claim manually) on every verification path.

      RFC 7519 §4.1.3 defines the `aud` claim explicitly for this use case.
    metadata:
      oauthlint-rule-id: AUTH-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-no-audience
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern: jwt.verify($TOKEN, $SECRET, $OPTS)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., audience: ..., ...}"
                - pattern: "{...}"
      - patterns:
          - pattern: jwt.verify($TOKEN, $SECRET, $OPTS, $CB)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., audience: ..., ...}"
                - pattern: "{...}"
      - patterns:
          - pattern: jwt.verify($TOKEN, $SECRET)
  - id: auth.jwt.no-expiration
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      JWT is signed without any `expiresIn` / `exp` claim, OR a token is
      verified without an `maxAge` check. A stolen token therefore remains
      valid forever.

      Always set a reasonable expiration on access tokens (5-60 minutes is
      typical) and verify it with `{ maxAge: '15m' }` or by validating the
      `exp` claim explicitly.
    metadata:
      oauthlint-rule-id: AUTH-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-no-expiration
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.4
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern: jwt.sign($PAYLOAD, $SECRET)
          - pattern-not: "jwt.sign({..., exp: ..., ...}, $SECRET)"
          - pattern-not: "jwt.sign({..., expiresIn: ..., ...}, $SECRET)"
      - patterns:
          - pattern: jwt.sign($PAYLOAD, $SECRET, $OPTS)
          - pattern-not: "jwt.sign({..., exp: ..., ...}, $SECRET, $OPTS)"
          - pattern-not: "jwt.sign({..., expiresIn: ..., ...}, $SECRET, $OPTS)"
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., expiresIn: ..., ...}"
                - pattern-not: "{..., exp: ..., ...}"
                - pattern: "{...}"
  - id: auth.jwt.no-issuer
    languages:
      - javascript
      - typescript
    severity: INFO
    message: |
      JWT is being verified without checking the `iss` (issuer) claim. If
      your verification key is shared across multiple authorization
      servers (or even tenants on a single IdP), this lets a token signed
      by one issuer be accepted by code that was meant to trust another.

      Pass `{ issuer: 'https://your-idp.example.com' }` to `jwt.verify` so
      that the trust chain is explicit. RFC 7519 §4.1.1 defines the
      `iss` claim for exactly this purpose.
    metadata:
      oauthlint-rule-id: AUTH-JWT-006
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-no-issuer
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: LOW
      references:
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.1
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern: jwt.verify($TOKEN, $SECRET, $OPTS)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., issuer: ..., ...}"
                - pattern: "{...}"
      - pattern: jwt.verify($TOKEN, $SECRET)
  - id: auth.jwt.untrusted-verify-key
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      Untrusted request input flows into the verification key or the
      `algorithms` allowlist of `jwt.verify(...)`. When the attacker controls
      the key, they sign their own forged token and supply the matching key,
      so every token "verifies": a complete authentication bypass. When the
      attacker controls `algorithms`, they can downgrade verification (e.g. to
      `HS256` against a public key, or to `none` on older libraries) and defeat
      the signature check (CWE-347, Improper Verification of Cryptographic
      Signature).

      The verification key and the accepted algorithms must be fixed
      server-side. Pin `algorithms` to a constant allowlist
      (`{ algorithms: ['RS256'] }`) and resolve the key from trusted
      configuration or a vetted key set keyed by a validated `kid`, never from
      `req.query` / `req.body` / `req.params` / `req.headers`.
    metadata:
      oauthlint-rule-id: AUTH-JWT-012
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-untrusted-verify-key
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
        - https://owasp.org/www-project-api-security/
      technology:
        - jsonwebtoken
    mode: taint
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $REQ.body
      - pattern: $REQ.headers
      - pattern: $REQ.query.$X
      - pattern: $REQ.params.$X
      - pattern: $REQ.body.$X
      - pattern: $REQ.headers.$X
      - pattern: $REQ.query[$K]
      - pattern: $REQ.params[$K]
      - pattern: $REQ.body[$K]
      - pattern: $REQ.headers[$K]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: jwt.verify($T, $SINK)
              - pattern: jwt.verify($T, $SINK, $OPTS)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: "jwt.verify($T, $KEY, {..., algorithms: $SINK, ...})"
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: isAllowedAlgorithm(...)
      - pattern: validateAlgorithm(...)
      - pattern: isAllowedKey(...)
      - pattern: $ALLOW.includes(...)
      - pattern: $ALLOW.has(...)
      - pattern: $ALLOW.indexOf(...)
  - id: auth.jwt.weak-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      JWT signing or verification uses a hard-coded secret. Anyone who reads
      the source (including via leaked GitHub commits) can forge valid tokens.

      Move the secret to an environment variable or secret manager, and ensure
      the value is at least 256 bits (32 ASCII characters) when using HMAC-based
      algorithms (HS256/HS384/HS512).

      Real-world incident: 24,008 unique secrets were found in MCP config files
      and 3.2% of Claude Code commits leaked secrets in GitGuardian's 2026 report.
    metadata:
      oauthlint-rule-id: AUTH-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-weak-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.2
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - jsonwebtoken
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: jwt.sign($PAYLOAD, $SECRET)
              - pattern: jwt.sign($PAYLOAD, $SECRET, ...)
              - pattern: jwt.verify($TOKEN, $SECRET)
              - pattern: jwt.verify($TOKEN, $SECRET, ...)
          - metavariable-regex:
              metavariable: $SECRET
              regex: ^(["'])(?:[a-zA-Z0-9!._-]{1,20}|secret|password|changeme|jwt[-_]?secret|my[-_]?secret)\1$
      - patterns:
          - pattern-inside: |
              import { ... } from 'jsonwebtoken'
              ...
          - pattern-either:
              - pattern: sign($PAYLOAD, $SECRET)
              - pattern: sign($PAYLOAD, $SECRET, ...)
              - pattern: verify($TOKEN, $SECRET)
              - pattern: verify($TOKEN, $SECRET, ...)
          - metavariable-regex:
              metavariable: $SECRET
              regex: ^(["'])(?:[a-zA-Z0-9!._-]{1,20}|secret|password|changeme|jwt[-_]?secret|my[-_]?secret)\1$
  - id: auth.kotlin.cookie.insecure-session
    languages:
      - kotlin
    severity: WARNING
    message: |
      A Ktor session cookie is configured without `cookie.secure = true`, so the
      browser will send it over plain HTTP as well as HTTPS. On any unencrypted
      request the session identifier is exposed to network eavesdroppers and can
      be captured and replayed to hijack the session (CWE-614, Sensitive Cookie
      Without 'Secure' Attribute). This is a common AI-generated mistake: the
      `cookie<Session>(...) { }` block sets `path`/`maxAge` but omits the security
      flags.

      Mark the cookie secure (and add signing/encryption) inside the block:
        `cookie.secure = true`
        `cookie.httpOnly = true`
        `transform(SessionTransportTransformerEncrypt(encryptKey, signKey))`
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-cookie-insecure-session
      category: security
      cwe: CWE-614
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://ktor.io/docs/server-sessions.html
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - ktor
    patterns:
      - pattern: |
          cookie<$T>($NAME) {
            ...
          }
      - pattern-not: |
          cookie<$T>($NAME) {
            ...
            cookie.secure = true
            ...
          }
  - id: auth.kotlin.cors.anyhost-credentials
    languages:
      - kotlin
    severity: ERROR
    message: |
      A Ktor CORS configuration combines `anyHost()` with
      `allowCredentials = true`. This tells the browser to send cookies and
      Authorization headers on cross-origin requests from ANY origin and to expose
      the authenticated response back to that origin, so any malicious website a
      logged-in user visits can call this API with their credentials and read the
      result (CWE-942, Permissive Cross-domain Policy). This is a common
      AI-generated mistake: `anyHost()` is used to "make CORS work" while
      credentials are also enabled.

      Never pair `anyHost()` with credentials. Allow only the specific origins
      that need credentialed access:
        `allowHost("app.example.com", schemes = listOf("https"))`
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-cors-anyhost-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://ktor.io/docs/server-cors.html
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS#credentialed_requests_and_wildcards
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - ktor
    patterns:
      - pattern-inside: |
          install(CORS) {
            ...
          }
      - pattern-inside: |
          install(CORS) {
            ...
            allowCredentials = true
            ...
          }
      - pattern: anyHost()
  - id: auth.kotlin.jwt.algorithm-none
    languages:
      - kotlin
    severity: ERROR
    message: |
      A JWT signer or verifier is built with `Algorithm.none()`, the unsecured
      algorithm that produces (and accepts) tokens with no signature. An
      `alg=none` token can be forged by anyone. Changing the subject, roles, or
      expiry costs nothing because there is no signature to verify (CWE-347). This
      is a common AI-generated mistake: the "no signature" algorithm is reached
      for during prototyping or a Ktor demo and never swapped for a real key.

      Sign and verify with a real algorithm and a key from configuration:
      `Algorithm.HMAC256(System.getenv("JWT_SECRET"))` or an RSA/EC key, e.g.
      `JWT.require(Algorithm.HMAC256(secret)).build().verify(token)`.
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-jwt-algorithm-none
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://github.com/auth0/java-jwt
        - https://datatracker.ietf.org/doc/html/rfc8725#section-2.1
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - java-jwt
        - ktor
    pattern-either:
      - pattern: com.auth0.jwt.algorithms.Algorithm.none()
      - pattern: Algorithm.none()
  - id: auth.kotlin.jwt.decode-without-verify
    languages:
      - kotlin
    severity: WARNING
    message: |
      A JWT is decoded but its signature is never verified. Auth0 java-jwt's
      `JWT.decode(token)` only base64-decodes the token (it does NOT check the
      signature), so any claim it exposes (subject, roles, expiry) is fully
      attacker-controlled (CWE-345). This is a common AI-generated mistake:
      `JWT.decode(...)` is reached for to "read the claims" and its result is
      trusted as if it had been verified.

      Verify the signature before reading any claim. With Auth0 java-jwt build a
      verifier and call it:
        `JWT.require(Algorithm.HMAC256(secret)).withIssuer(iss).withAudience(aud).build().verify(token)`
      The `DecodedJWT` returned by `verify(...)` is the only trustworthy one.
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-jwt-decode-without-verify
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/auth0/java-jwt#decode-a-token
        - https://datatracker.ietf.org/doc/html/rfc8725#section-3.1
        - https://cwe.mitre.org/data/definitions/345.html
      technology:
        - java-jwt
    pattern-either:
      - pattern: com.auth0.jwt.JWT.decode($T)
      - pattern: JWT.decode($T)
  - id: auth.kotlin.jwt.missing-issuer-audience
    languages:
      - kotlin
    severity: WARNING
    message: |
      This JWT verifier checks the signature but never asserts the token's
      intended recipient: the Auth0 `JWT.require(alg)...build()` chain pins no
      `.withIssuer(...)` and no `.withAudience(...)`. A valid signature only proves
      the token was minted by whoever holds the key, not that it was issued by the
      expected authority or meant for THIS service. A token your provider issued
      for a different audience, or one minted by any party that shares the key,
      will still verify, enabling token replay across services (CWE-345). This is a
      common AI-generated mistake in Ktor `jwt { verifier(...) }` setups: the
      sample verifies the signature and stops there.

      Pin the recipient before `.build()`: chain
      `.withIssuer("https://your-idp")` and `.withAudience("your-api")` on the
      `JWT.require(...)` builder.
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-jwt-missing-issuer-audience
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://ktor.io/docs/server-jwt.html
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
        - https://cwe.mitre.org/data/definitions/345.html
      technology:
        - java-jwt
        - ktor
    pattern-regex: JWT\.require\((?:(?!\.build\(\)|\.withIssuer\(|\.withAudience\(|\.withAnyOfAudience\()[\s\S])*?\.build\(\)
  - id: auth.kotlin.secret.hardcoded-jwt-secret
    languages:
      - kotlin
    severity: ERROR
    message: |
      A JWT signing key is built from a hard-coded string literal
      (`Algorithm.HMAC256("...")`). This key both signs and verifies every token:
      committed to source control it is one search away from compromise, letting
      an attacker forge tokens for any user or role (CWE-798). This is a common
      AI-generated mistake: a literal secret is inlined to make the Ktor/java-jwt
      sample "just work" and is never externalized.

      Load the key from configuration or a secret store instead, e.g.
      `Algorithm.HMAC256(System.getenv("JWT_SECRET"))` or
      `Algorithm.HMAC256(environment.config.property("jwt.secret").getString())`,
      and rotate any secret that has already been checked in.
    metadata:
      oauthlint-rule-id: AUTH-KOTLIN-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/kotlin-secret-hardcoded-jwt-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/auth0/java-jwt
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - java-jwt
        - ktor
    patterns:
      - pattern-either:
          - pattern: com.auth0.jwt.algorithms.Algorithm.HMAC256("...")
          - pattern: com.auth0.jwt.algorithms.Algorithm.HMAC384("...")
          - pattern: com.auth0.jwt.algorithms.Algorithm.HMAC512("...")
          - pattern: Algorithm.HMAC256("...")
          - pattern: Algorithm.HMAC384("...")
          - pattern: Algorithm.HMAC512("...")
      - pattern-not-regex: (?i)HMAC(?:256|384|512)\(\s*"\\?\$\{?[A-Za-z_]+\}?"
      - pattern-not-regex: (?i)HMAC(?:256|384|512)\(\s*"<[^"]*>"
      - pattern-not-regex: (?i)HMAC(?:256|384|512)\(\s*"(?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace)
  - id: auth.mcp.dns-rebinding-unprotected
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      This MCP `StreamableHTTPServerTransport` is created without DNS-rebinding
      protection (CWE-346). `enableDnsRebindingProtection` defaults to `false`
      in the TypeScript SDK, so a malicious web page the user visits can rebind
      a DNS name to the loopback address and POST to the local MCP server,
      driving its tools cross-origin from the browser. This is CVE-2025-66416.

      Enable it and pin the Host/Origin allow-lists:
        new StreamableHTTPServerTransport({
          sessionIdGenerator: () => randomUUID(),
          enableDnsRebindingProtection: true,
          allowedHosts: ['127.0.0.1:3000'],
          allowedOrigins: ['https://app.example.com'],
        })
    metadata:
      oauthlint-rule-id: AUTH-MCP-005
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-dns-rebinding-unprotected
      category: security
      cwe: CWE-346
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://www.cve.org/CVERecord?id=CVE-2025-66416
        - https://cwe.mitre.org/data/definitions/346.html
      technology:
        - mcp
        - modelcontextprotocol
    patterns:
      - pattern: new StreamableHTTPServerTransport({...})
      - pattern-not: "new StreamableHTTPServerTransport({..., enableDnsRebindingProtection: true, ...})"
  - id: auth.mcp.missing-resource-binding
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      This MCP server enforces bearer auth via `requireBearerAuth(...)` but
      passes no `resourceMetadataUrl`. Per the MCP spec, an OAuth 2.1 resource
      server MUST advertise its Protected Resource Metadata (RFC 9728): without
      `resourceMetadataUrl`, the 401 `WWW-Authenticate` response carries no
      `resource_metadata`, so MCP clients cannot discover the authorization
      server, and there is no anchor for RFC 8707 audience binding (CWE-345).

      Provide it (and mount `mcpAuthMetadataRouter`):
        requireBearerAuth({
          verifier,
          resourceMetadataUrl: getOAuthProtectedResourceMetadataUrl(mcpServerUrl),
        })
    metadata:
      oauthlint-rule-id: AUTH-MCP-002
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-missing-resource-binding
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://datatracker.ietf.org/doc/html/rfc8707
        - https://datatracker.ietf.org/doc/html/rfc9728
      technology:
        - mcp
        - modelcontextprotocol
    patterns:
      - pattern: requireBearerAuth({...})
      - pattern-not: "requireBearerAuth({..., resourceMetadataUrl: $X, ...})"
  - id: auth.mcp.predictable-session-id
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      This MCP `StreamableHTTPServerTransport` derives its session id from a
      predictable source: `Date.now()`, `Math.random()`, or an incrementing
      counter (CWE-330). Session ids are the bearer of the MCP session; if an
      attacker can guess or enumerate them, they can hijack another client's
      session and issue tool calls as that client. `Math.random()` is not a CSPRNG
      and time/counter values are trivially predictable.

      Use a cryptographically secure generator:
        sessionIdGenerator: () => randomUUID()   // from node:crypto
      (Omit `sessionIdGenerator` entirely for stateless mode, which is fine.)
    metadata:
      oauthlint-rule-id: AUTH-MCP-006
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-predictable-session-id
      category: security
      cwe: CWE-330
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - mcp
        - modelcontextprotocol
    patterns:
      - pattern: "new StreamableHTTPServerTransport({..., sessionIdGenerator: () => $BODY, ...})"
      - metavariable-pattern:
          metavariable: $BODY
          patterns:
            - pattern-either:
                - pattern: Date.now()
                - pattern: Math.random()
                - pattern: $C++
                - pattern: ++$C
  - id: auth.mcp.token-passthrough
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An MCP server forwards the INCOMING caller token to an upstream API
      (token pass-through). The token the MCP client presented was issued for
      THIS server as its audience (RFC 8707); replaying it against a different
      resource server is a confused-deputy vulnerability (CWE-863), the exact
      class behind CVE-2026-13341. The MCP authorization spec forbids it: a
      resource server MUST NOT accept or transit a token that was not issued
      for it.

      Never send `req.auth.token` / `ctx.http.authInfo.token` / the raw
      `Authorization` header upstream. Perform a token exchange (RFC 8693) or
      use a separately-obtained credential minted for the upstream audience,
      and send THAT token:
        const up = await exchangeToken(authInfo.token, { audience: UPSTREAM });
        fetch(UPSTREAM, { headers: { Authorization: `Bearer ${up}` } });
    metadata:
      oauthlint-rule-id: AUTH-MCP-001
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-token-passthrough
      category: security
      cwe: CWE-863
      owasp: API5:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://datatracker.ietf.org/doc/html/rfc8693
        - https://datatracker.ietf.org/doc/html/rfc8707
      technology:
        - modelcontextprotocol
        - mcp
    mode: taint
    pattern-sources:
      - pattern: $REQ.auth.token
      - pattern: $X.authInfo.token
      - pattern: authInfo.token
      - pattern: $REQ.headers.authorization
      - pattern: $REQ.headers['authorization']
      - pattern: $REQ.headers.Authorization
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "fetch($URL, {..., headers: {..., Authorization: $SINK, ...}, ...})"
              - pattern: 'fetch($URL, {..., headers: {..., "Authorization": $SINK, ...}, ...})'
              - pattern: "axios($URL, {..., headers: {..., Authorization: $SINK, ...}, ...})"
              - pattern: "axios.$M($URL, {..., headers: {..., Authorization: $SINK, ...}, ...})"
              - pattern: 'axios($URL, {..., headers: {..., "Authorization": $SINK, ...}, ...})'
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: exchangeToken(...)
      - pattern: exchangeAuthorizationCode(...)
      - pattern: exchangeRefreshToken(...)
      - pattern: $P.exchangeToken(...)
  - id: auth.mcp.tool-handler-ssrf
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An argument of an MCP tool handler (`server.registerTool` / `server.tool`)
      flows into an outbound HTTP request without validation, a server-side
      request forgery (SSRF, CWE-918). Tool arguments are attacker-influenced:
      an LLM or a malicious caller can point the URL at internal services, cloud
      metadata (169.254.169.254), or localhost. BlueRock found ~36.7% of MCP
      servers SSRF-prone.

      Validate the target before fetching: resolve and allow-list the host,
      reject private/link-local ranges, and disable redirects. Never pass a raw
      tool argument straight into `fetch`/`axios`.
    metadata:
      oauthlint-rule-id: AUTH-MCP-004
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-tool-handler-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - mcp
        - modelcontextprotocol
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $S.registerTool($NAME, $SCHEMA, async ($ARGS) => { ... })
              - pattern: $S.registerTool($NAME, $SCHEMA, ($ARGS) => { ... })
              - pattern: $S.tool($NAME, $SCHEMA, async ($ARGS) => { ... })
              - pattern: $S.tool($NAME, $SCHEMA, ($ARGS) => { ... })
          - focus-metavariable: $ARGS
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($SINK, ...)
              - pattern: fetch($SINK)
              - pattern: axios($SINK, ...)
              - pattern: axios.$M($SINK, ...)
              - pattern: axios($SINK)
          - focus-metavariable: $SINK
  - id: auth.mcp.unauthenticated-server
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      This MCP transport is mounted on an Express route with NO auth middleware.
      The tools are reachable unauthenticated (CWE-306). The route passes only
      (path, handler): there is no `requireBearerAuth(...)` in the chain, so any
      caller can drive the MCP server. A Knostic scan found none of ~2,000
      internet-exposed MCP servers required auth.

      Put `requireBearerAuth(...)` before the transport handler:
        const auth = requireBearerAuth({ verifier, resourceMetadataUrl });
        app.post('/mcp', auth, async (req, res) => { await transport.handleRequest(req, res, req.body); });
    metadata:
      oauthlint-rule-id: AUTH-MCP-003
      oauthlint-doc-url: https://oauthlint.dev/rules/mcp-unauthenticated-server
      category: security
      cwe: CWE-306
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://healthsystemcio.com/2026/07/28/mcp-server-exposure-health-isac/
      technology:
        - mcp
        - modelcontextprotocol
    pattern-either:
      - patterns:
          - pattern: $T.handleRequest(...)
          - pattern-either:
              - pattern-inside: $APP.get($PATH, $HANDLER)
              - pattern-inside: $APP.post($PATH, $HANDLER)
              - pattern-inside: $APP.put($PATH, $HANDLER)
              - pattern-inside: $APP.delete($PATH, $HANDLER)
              - pattern-inside: $APP.patch($PATH, $HANDLER)
              - pattern-inside: $APP.all($PATH, $HANDLER)
          - pattern-not-inside: $APP.$V($PATH, requireBearerAuth(...), $HANDLER)
      - pattern-either:
          - pattern: $APP.get($PATH, toNodeHandler(...))
          - pattern: $APP.post($PATH, toNodeHandler(...))
          - pattern: $APP.all($PATH, toNodeHandler(...))
          - pattern: $APP.get($PATH, createMcpHandler(...))
          - pattern: $APP.post($PATH, createMcpHandler(...))
          - pattern: $APP.all($PATH, createMcpHandler(...))
  - id: auth.nestjs.cors-wildcard-credentials
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      NestJS `app.enableCors()` is configured with a wildcard/reflected origin
      (`origin: '*'` or `origin: true`) together with `credentials: true`. The
      CORS spec forbids `Access-Control-Allow-Origin: *` with credentials, so
      `origin: true` echoes the caller's origin back instead, effectively
      allowing credentialed cross-site requests from ANYWHERE. That is a
      CSRF / account-takeover primitive.

      Enumerate the exact trusted origins instead:
      `app.enableCors({ origin: ['https://app.example.com'], credentials: true })`.
      If the API is public and needs no cookies or auth headers, keep
      `credentials` at its default `false`.
    metadata:
      oauthlint-rule-id: AUTH-NESTJS-003
      oauthlint-doc-url: https://oauthlint.dev/rules/nestjs-cors-wildcard-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.nestjs.com/security/cors
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
      technology:
        - nestjs
    pattern-either:
      - pattern: '$APP.enableCors({ ..., origin: "*", ..., credentials: true, ... })'
      - pattern: '$APP.enableCors({ ..., credentials: true, ..., origin: "*", ... })'
      - pattern: "$APP.enableCors({ ..., origin: true, ..., credentials: true, ... })"
      - pattern: "$APP.enableCors({ ..., credentials: true, ..., origin: true, ... })"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.nestjs.guard-always-true
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A NestJS guard's `canActivate` returns a constant `true`. A guard that
      unconditionally authorises every request removes access control from every
      route, controller, or handler it protects, so the endpoint is effectively
      public. This is the classic "stubbed out for now" guard that ships to
      production.

      Implement the check: read the request from
      `context.switchToHttp().getRequest()`, verify the session/token/role, and
      return `true` only when it passes (return `false` or throw
      `UnauthorizedException` / `ForbiddenException` otherwise). If a route is
      meant to be public, apply a `@Public()` decorator and remove the guard
      rather than leaving one that reads as protected but is not.
    metadata:
      oauthlint-rule-id: AUTH-NESTJS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/nestjs-guard-always-true
      category: security
      cwe: CWE-287
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.nestjs.com/guards
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - nestjs
    patterns:
      - pattern-inside: |
          class $C implements CanActivate {
            ...
          }
      - pattern-either:
          - pattern: canActivate($CTX) { return true; }
          - pattern: canActivate($CTX) { return Promise.resolve(true); }
          - pattern: async canActivate($CTX) { return true; }
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.nestjs.jwt-hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A NestJS `JwtModule` is configured with a hard-coded `secret` (or
      `secretOrPrivateKey`) string literal. This key signs and verifies every
      access token: committed to git it is one search away from compromise,
      letting an attacker forge tokens for any user.

      Read it from the environment instead. Use `JwtModule.registerAsync` with
      `ConfigService` (`useFactory: (config) => ({ secret: config.get('JWT_SECRET') })`)
      or `secret: process.env.JWT_SECRET`, and add the variable to `.env.example`
      with a placeholder. Rotate the leaked value out of source control.
    metadata:
      oauthlint-rule-id: AUTH-NESTJS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/nestjs-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://docs.nestjs.com/security/authentication
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - nestjs
        - "@nestjs/jwt"
    patterns:
      - pattern-either:
          - pattern: 'secret: "..."'
          - pattern: 'secretOrPrivateKey: "..."'
      - pattern-not-regex: (?i)(?:secret|secretOrPrivateKey)\s*:\s*['"]\$\{?[A-Za-z_]+\}?['"]
      - pattern-not-regex: (?i)(?:secret|secretOrPrivateKey)\s*:\s*['"]<[^'"]*>['"]
      - pattern-not-regex: (?i)(?:secret|secretOrPrivateKey)\s*:\s*['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
      - pattern-either:
          - pattern-inside: JwtModule.register({...})
          - pattern-inside: JwtModule.registerAsync({...})
          - pattern-inside: new JwtService({...})
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.nextauth.authorized-always-true
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      The NextAuth/Auth.js `authorized` callback returns `true`
      unconditionally.

      This callback is the gate the middleware uses to protect routes, so
      returning a constant `true` authorizes every request and disables the
      protection entirely. Check the session instead, for example
      `authorized: ({ auth }) => !!auth?.user`, and return `false` (or a
      `Response.redirect` to your login page) when there is no signed-in user.
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-authorized-always-true
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://authjs.dev/reference/nextjs#authorized
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - next-auth
    patterns:
      - pattern-inside: "callbacks: {...}"
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
      - pattern-either:
          - pattern: authorized($P) { return true; }
          - pattern: async authorized($P) { return true; }
          - pattern: "authorized: ($P) => true"
          - pattern: "authorized: async ($P) => true"
          - pattern: "authorized: ($P) => { return true; }"
          - pattern: "authorized: async ($P) => { return true; }"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.nextauth.cookie-insecure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A NextAuth/Auth.js custom cookie is configured as insecure. Setting
      `secure: false` lets the browser send the session-token cookie over plain
      HTTP, and `httpOnly: false` exposes it to `document.cookie` so any XSS can
      read it.

      Set `secure: true` and `httpOnly: true` on the cookie options (Auth.js
      already applies these defaults, so the safest fix is to delete the
      overrides). If you need insecure cookies for local HTTP development, gate
      the value on `process.env.NODE_ENV !== 'production'` rather than
      hard-coding `false`.
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://authjs.dev/reference/core#cookies
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - next-auth
    patterns:
      - pattern-either:
          - pattern: "secure: false"
          - pattern: "httpOnly: false"
      - pattern-inside: "cookies: {...}"
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.nextauth.debug-enabled
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      The NextAuth/Auth.js config hard-codes `debug: true`.

      Debug mode writes verbose diagnostics, including provider responses and
      token material, to the server logs, and leaving it on in production leaks
      that data to anyone who can read the logs. Gate it on the environment
      instead, for example `debug: process.env.NODE_ENV !== 'production'`, or
      remove the flag so it defaults to off.
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-007
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-debug-enabled
      category: security
      cwe: CWE-489
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://authjs.dev/reference/core#debug
        - https://cwe.mitre.org/data/definitions/489.html
      technology:
        - next-auth
    patterns:
      - pattern: "debug: true"
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.nextauth.hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      The NextAuth/Auth.js `secret` is set to a hard-coded string literal.

      This value signs and encrypts every session JWT and CSRF token. Committed
      to git it is one search away from compromise, letting an attacker forge
      sessions for any user. Read it from the environment instead:
      `secret: process.env.AUTH_SECRET` (or `NEXTAUTH_SECRET`) and add the
      variable to `.env.example` with a placeholder.
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://authjs.dev/getting-started/deployment#auth_secret
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - next-auth
    patterns:
      - pattern: 'secret: "..."'
      - pattern-not-regex: (?i)secret\s*:\s*['"]\$\{?[A-Za-z_]+\}?['"]
      - pattern-not-regex: (?i)secret\s*:\s*['"]<[^'"]*>['"]
      - pattern-not-regex: (?i)secret\s*:\s*['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
  - id: auth.nextauth.redirect-open
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      The NextAuth/Auth.js `redirect` callback returns the incoming `url`
      without validating it against `baseUrl`.

      `url` is attacker-controllable (it comes from the `callbackUrl` request
      parameter), so returning it verbatim turns your sign-in flow into an open
      redirect: `/api/auth/signin?callbackUrl=https://evil.example` lands the
      user on the attacker's site after login. Only return a `url` you have
      confirmed is local, for example
      `return url.startsWith(baseUrl) ? url : baseUrl` (and resolve relative
      paths against `baseUrl` yourself).
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-redirect-open
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://authjs.dev/reference/core/types#redirect
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - next-auth
    patterns:
      - pattern-inside: "callbacks: {...}"
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
      - pattern-either:
          - pattern: redirect($P) { return url; }
          - pattern: async redirect($P) { return url; }
          - pattern: "redirect: ($P) => url"
          - pattern: "redirect: async ($P) => url"
          - pattern: "redirect: ($P) => { return url; }"
          - pattern: "redirect: async ($P) => { return url; }"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.nextauth.session-token-leak
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      The NextAuth/Auth.js `session` callback copies an OAuth token onto the
      `session` object.

      Whatever the `session` callback returns is serialized and sent to the
      browser (and readable by client-side JavaScript), so assigning
      `session.accessToken = token.accessToken` exposes a bearer token to every
      script on the page, including any XSS. Keep access and refresh tokens in
      the encrypted JWT (the `token` argument) or a server-side store, and put
      only non-sensitive fields such as `session.user.id` or `session.user.role`
      on the session.
    metadata:
      oauthlint-rule-id: AUTH-NEXTAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/nextauth-session-token-leak
      category: security
      cwe: CWE-522
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://authjs.dev/guides/extending-the-session
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - next-auth
    patterns:
      - pattern-inside: "callbacks: {...}"
      - pattern-either:
          - pattern-inside: NextAuth({...})
          - pattern-inside: NextAuth($A, {...})
          - pattern-inside: NextAuth($A, $B, {...})
          - pattern-inside: Auth($A, {...})
          - pattern-inside: authOptions = {...}
          - pattern-inside: authConfig = {...}
          - pattern-inside: "$X: NextAuthOptions = {...}"
          - pattern-inside: "$X: NextAuthConfig = {...}"
          - pattern-inside: "$X: AuthOptions = {...}"
      - pattern-either:
          - pattern-inside: session($P) {...}
          - pattern-inside: async session($P) {...}
          - pattern-inside: "session: ($P) => {...}"
          - pattern-inside: "session: async ($P) => {...}"
      - pattern-either:
          - pattern: session.$FIELD = $VAL
          - pattern: session.user.$FIELD = $VAL
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^(accessToken|access_token|refreshToken|refresh_token|idToken|id_token)$
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.oauth.access-token-in-url
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      An OAuth `access_token` (or `refresh_token` / `id_token`) is placed in a
      URL query string. URLs leak: the full URL (token included) is recorded
      in server and reverse-proxy access logs, saved in browser history, and
      sent in the `Referer` header to every third-party CDN, analytics, and ad
      script loaded by the destination page. A token in a URL is a leaked token.

      Send the token in the `Authorization: Bearer …` header, or in a POST
      request body. Never in the URL query string.

      CWE-598: Use of GET Request Method With Sensitive Query Strings.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-013
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-access-token-in-url
      category: security
      cwe: CWE-598
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
        - https://cwe.mitre.org/data/definitions/598.html
      technology:
        - oauth
    pattern-regex: "[?&](?i:access_token|refresh_token|id_token)="
  - id: auth.oauth.broad-scope
    languages:
      - javascript
      - typescript
    severity: INFO
    message: |
      OAuth scope request includes an over-broad scope such as `admin`,
      `full_access`, `*`, or `repo` (entire GitHub access). LLMs default
      to the widest scope that "works", but every extra scope expands
      the blast radius if the access token is leaked or replayed.

      Request the narrowest scope that satisfies your feature. Examples:
      use `repo:status` instead of `repo`, `gmail.send` instead of
      `https://mail.google.com/`, and scope down to `read:user` when you
      only need a profile.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-006
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-broad-scope
      category: security
      cwe: CWE-272
      owasp: API1:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.3
    pattern-either:
      - pattern-regex: scope\s*[:=]\s*(['"])(?:[^'"]*[ ,])?(?:admin|full_access|all|root|superuser|repo)(?:[ ,][^'"]*)?\1
      - pattern-regex: scope\s*[:=]\s*['"][^'"]*\*[^'"]*['"]
      - pattern-regex: scope\s*[:=]\s*['"][^'"]*https://mail\.google\.com/[^'"]*['"]
      - pattern-regex: scopes?\s*[:=]\s*\[[^\]]*(['"])(?:[^'"]*[ ,])?(?:admin|full_access|all|root|superuser|repo)(?:[ ,][^'"]*)?\1[^\]]*\]
  - id: auth.oauth.hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An OAuth `client_secret` (or similarly sensitive credential) is being
      assigned a hard-coded string literal. The moment this lands in git, it
      is one search away from compromise.

      Replace the literal with `process.env.OAUTH_CLIENT_SECRET` (or your
      secret manager equivalent) and add the variable to `.env.example` with
      a placeholder so contributors know it is required.

      GitGuardian 2026 found 28.6M public secrets on GitHub, with Claude Code
      commits leaking at 2x baseline. This is the most common AI-coding leak.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1
        - https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/
    pattern-either:
      - patterns:
          - pattern-regex: (?i)client[_-]?secret\s*[:=]\s*['"][^'"\s]{8,}['"]
          - pattern-not-regex: (?i)client[_-]?secret\s*[:=]\s*['"]\$\{?[A-Za-z_]+\}?['"]
          - pattern-not-regex: (?i)client[_-]?secret\s*[:=]\s*['"]<[^'"]*>['"]
          - pattern-not-regex: (?i)client[_-]?secret\s*[:=]\s*['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|redacted)
  - id: auth.oauth.implicit-flow
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      OAuth implicit flow is deprecated by the OAuth 2.0 Security BCP (RFC 9700)
      and the OAuth 2.1 draft. It is triggered by `response_type=token` or
      `response_type=id_token token`. The access token leaks into the URL
      fragment, browser history, and referrer headers, and there is no
      refresh-token mechanism.

      Migrate to authorization code + PKCE (`response_type=code` with a
      `code_challenge`). All modern OAuth providers (Google, Microsoft,
      Auth0, Okta, Keycloak, WSO2) support this for SPAs and native apps.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-implicit-flow
      category: security
      cwe: CWE-1004
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700
    pattern-either:
      - pattern-regex: response_type\s*[:=]\s*['"]token['"]
      - pattern-regex: response_type\s*[:=]\s*['"]id_token\s+token['"]
      - pattern-regex: response_type\s*[:=]\s*['"]token\s+id_token['"]
      - pattern-regex: "[?&]response_type=token(?:&|['\"]|#|$)"
      - pattern-regex: "[?&]response_type=(?:id_token(?:%20|\\+)token|token(?:%20|\\+)id_token)(?:&|['\"]|#|$)"
  - id: auth.oauth.insecure-token-endpoint
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An OAuth/OIDC endpoint is being contacted over cleartext `http://`.
      Authorization codes, `client_secret`, access/refresh tokens, and the
      `code_verifier` then travel unencrypted. A network attacker can read
      or rewrite them and take over the flow.

      RFC 6749 §3.1 / §10.9 require TLS for the authorization and token
      endpoints. Use `https://` for every authorize, token, and userinfo
      URL. `http://localhost` is fine for local development and is not
      flagged.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-015
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-insecure-token-endpoint
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.9
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauth2
        - oidc
    pattern-either:
      - patterns:
          - pattern-regex: "['\"]http://[^'\"\\s]+(?:response_type=|client_id=|client_secret=|grant_type=|code_challenge=|/oauth2?/|/connect/token|/o/oauth2|/authorize|/oauth/token)[^'\"]*['\"]"
          - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
  - id: auth.oauth.long-token-lifetime
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      An OAuth token-lifetime field is set to a literal value longer than
      24 hours. The value of `expires_in` (or a comparable field) exceeds
      86_400 seconds. Long-lived access tokens make every token theft
      catastrophic because they remain valid for days or weeks; the
      industry standard is 15-60 minutes for access tokens, paired with
      a refresh-token rotation flow for longer sessions.

      Don't issue access tokens longer than a day. Use refresh tokens
      with proper rotation (RFC 6749 §6, RFC 9700 §4.14) for "stay
      logged in" semantics.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-009
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-long-token-lifetime
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-4.14
        - https://datatracker.ietf.org/doc/html/rfc6749#section-6
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "{ ..., expires_in: $TTL, ... }"
              - pattern: "{ ..., expiresIn: $TTL, ... }"
              - pattern: "{ ..., access_token_ttl: $TTL, ... }"
              - pattern: "{ ..., accessTokenTtl: $TTL, ... }"
              - pattern: "{ ..., tokenLifetime: $TTL, ... }"
          - metavariable-comparison:
              metavariable: $TTL
              comparison: $TTL > 86400
      - patterns:
          - pattern-either:
              - pattern: $X.expires_in = $TTL
              - pattern: $X.expiresIn = $TTL
              - pattern: $X.access_token_ttl = $TTL
              - pattern: $X.accessTokenTtl = $TTL
              - pattern: $X.tokenLifetime = $TTL
          - metavariable-comparison:
              metavariable: $TTL
              comparison: $TTL > 86400
      - pattern-regex: (?:expiresIn|expires_in)\s*[:=]\s*['"](?:[2-9]|[1-9][0-9]+)\s*(?:d|days?)['"]
      - pattern-regex: (?:expiresIn|expires_in)\s*[:=]\s*['"][1-9][0-9]*\s*(?:w|y|weeks?|years?|months?)['"]
  - id: auth.oauth.no-nonce
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      OIDC authorization request (scope contains `openid`) is being built
      WITHOUT a `nonce` parameter. The nonce binds the id_token to this
      specific authorization request. Without it, an attacker can replay or
      substitute a stolen/forged id_token (OIDC Core §3.1.2.1).

      Generate a cryptographically random `nonce`, store it in the
      session/cookie, send it on the authorize call, and verify the `nonce`
      claim in the returned id_token. It is REQUIRED for the implicit and
      hybrid flows and RECOMMENDED for the authorization-code flow.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-010
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-no-nonce
      category: security
      cwe: CWE-294
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://openid.net/specs/openid-connect-core-1_0.html#AuthRequest
      technology:
        - oidc
    pattern-either:
      - patterns:
          - pattern-regex: "['\"]https?://[^'\"\\s]+\\?[^'\"]*scope=[^'\"&]*openid[^'\"]*['\"]"
          - pattern-regex: response_type=
          - pattern-not-regex: "['\"]https?://[^'\"\\s]+\\?[^'\"]*nonce=[^'\"]*['\"]"
      - patterns:
          - pattern: "new URLSearchParams({..., response_type: $R, ...})"
          - pattern: "new URLSearchParams({..., scope: $S, ...})"
          - metavariable-regex:
              metavariable: $S
              regex: .*openid.*
          - pattern-not: "new URLSearchParams({..., nonce: $N, ...})"
          - pattern-not: new URLSearchParams({..., nonce, ...})
  - id: auth.oauth.no-pkce
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      OAuth authorization request from a public client omits the PKCE `code_challenge` parameter.
      The request looks like a public client (SPA, mobile, or native app) yet
      carries no `code_challenge`. Without PKCE, the authorization code can be
      intercepted and exchanged by an attacker.

      RFC 8252 §6 mandates PKCE for native/SPA clients. RFC 9700 (OAuth 2.0
      Security BCP) recommends PKCE for ALL clients, including confidential
      ones, as defence in depth.

      Generate a `code_verifier` (43-128 char), derive `code_challenge =
      BASE64URL-NoPad(SHA256(code_verifier))`, send it with
      `code_challenge_method=S256` on the authorize call, and POST the
      `code_verifier` on the token call.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-no-pkce
      category: security
      cwe: CWE-345
      owasp: API1:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc7636
        - https://datatracker.ietf.org/doc/html/rfc8252#section-6
    pattern-either:
      - patterns:
          - pattern-regex: "['\"]https?://[^'\"\\s]+\\?[^'\"]*response_type=code[^'\"]*['\"]"
          - pattern-regex: client_id=
          - pattern-not-regex: code_challenge
      - patterns:
          - pattern: "new URLSearchParams({..., client_id: $C, ...})"
          - pattern-either:
              - pattern: "new URLSearchParams({..., response_type: 'code', ...})"
              - pattern: 'new URLSearchParams({..., response_type: "code", ...})'
          - pattern-not: "new URLSearchParams({..., code_challenge: $X, ...})"
  - id: auth.oauth.no-state
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      OAuth 2.0 authorization request is being built WITHOUT a `state`
      parameter. This opens you to CSRF attacks during the OAuth dance.
      An attacker can trick the victim into logging in as the attacker.

      Always generate a cryptographically random `state`, store it in a
      session/cookie, and validate it on the callback. PKCE alone is not a
      substitute for `state` when handling browser sessions.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-no-state
      category: security
      cwe: CWE-352
      owasp: API1:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
    pattern-either:
      - pattern-regex: "['\"]https?://(?=[^'\"]*[?&]client_id=)(?=[^'\"]*[?&]response_type=)(?![^'\"]*[?&]state=)[^'\"]+['\"]"
      - patterns:
          - pattern: "new URLSearchParams({..., client_id: $C, ...})"
          - pattern: "new URLSearchParams({..., response_type: $R, ...})"
          - pattern-not: "new URLSearchParams({..., state: $S, ...})"
          - pattern-not: new URLSearchParams({..., state, ...})
  - id: auth.oauth.no-state-validation
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      OAuth callback handler reads `state` from the request but never
      compares it to a stored value. Sending `state` on the authorize
      call is half of the CSRF mitigation; verifying it on the callback
      is the other half.

      Compare the received `state` to the value you stored before
      redirecting (session, signed cookie, or Redis). Reject the callback
      if it's missing or doesn't match.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-007
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-no-state-validation
      category: security
      cwe: CWE-352
      owasp: API1:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query.state
              - pattern: $REQ.body.state
              - pattern: $URL.searchParams.get("state")
          - pattern-not-inside: |
              if (<... $REQ.query.state ...>) { ... }
          - pattern-not-inside: |
              if (<... $REQ.body.state ...>) { ... }
          - pattern-not-inside: |
              if (<... $URL.searchParams.get("state") ...>) { ... }
          - pattern-not-inside: |
              $S = $REQ.query.state;
              ...
              if (<... $S ...>) { ... }
          - pattern-not-inside: |
              $S = $REQ.body.state;
              ...
              if (<... $S ...>) { ... }
          - pattern-not-inside: |
              $S = $URL.searchParams.get("state");
              ...
              if (<... $S ...>) { ... }
  - id: auth.oauth.open-redirect-callback
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      The OAuth callback handler redirects to a URL taken straight from
      the request without validating it. An attacker can craft a phishing
      link to your real callback that forwards the victim to a malicious
      site under your domain's trust.

      Maintain an explicit allow-list of post-login redirect destinations
      (route names or full URLs you control). Never forward to an
      arbitrary `req.query.redirect_to`, `req.query.next`, or
      `req.query.return_url` value.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-008
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-open-redirect-callback
      category: security
      cwe: CWE-601
      owasp: API1:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
      technology:
        - express
    mode: taint
    pattern-sources:
      - pattern: $REQ.query.$A
      - pattern: $REQ.body.$A
      - pattern: $REQ.params.$A
      - pattern: $REQ.query[$K]
      - pattern: $REQ.body[$K]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($SINK)
              - pattern: $RES.redirect($CODE, $SINK)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $SET.has($X) ...>) { ... }
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $ARR.includes($X) ...>) { ... }
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $ARR.indexOf($X) ...>) { ... }
  - id: auth.oauth.pkce-plain
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      PKCE is configured with `code_challenge_method=plain`. The `plain`
      method sends the `code_verifier` itself as the `code_challenge`, so an
      attacker who intercepts the authorization request learns the verifier
      and PKCE provides no protection against authorization-code interception.

      Use `code_challenge_method=S256`: derive `code_challenge =
      BASE64URL-NoPad(SHA256(code_verifier))` (RFC 7636 §4.2). S256 is
      mandatory for clients that can compute SHA-256.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-011
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-pkce-plain
      category: security
      cwe: CWE-757
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc7636#section-4.2
      technology:
        - oauth
    pattern-either:
      - pattern-regex: code_challenge_method=plain\b
      - pattern: "{..., code_challenge_method: 'plain', ...}"
      - pattern: '{..., code_challenge_method: "plain", ...}'
      - pattern: $P.set('code_challenge_method', 'plain')
      - pattern: $P.set("code_challenge_method", "plain")
      - pattern: $P.append('code_challenge_method', 'plain')
      - pattern: $P.append("code_challenge_method", "plain")
  - id: auth.oauth.ropc-grant
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      OAuth token request uses the Resource Owner Password Credentials
      grant (`grant_type=password`). The app collects the user's password
      and replays it to the authorization server, exactly what OAuth was
      designed to avoid. It cannot support federation, MFA, or step-up
      auth, and any compromise of your service exposes raw user passwords.

      The OAuth 2.0 Security BCP (RFC 9700 §2.4) forbids ROPC and OAuth 2.1
      removes it entirely. Use the authorization-code flow with PKCE
      (`grant_type=authorization_code`) for user login, or
      `client_credentials` for machine-to-machine.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-014
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-ropc-grant
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
        - https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1#section-2.4
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - oauth2
    pattern-either:
      - pattern-regex: grant_type\s*:\s*['"]password['"]
      - pattern-regex: \.grant_type\s*=\s*['"]password['"]
      - pattern-regex: "[?&'\"`]grant_type=password(?:[&'\"`\\s]|$)"
      - pattern-regex: "['\"]grant_type['\"]\\s*,\\s*['\"]password['\"]"
  - id: auth.oauth.static-state
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      OAuth authorization request sends a hardcoded, constant `state`
      value. A static `state` provides ZERO CSRF protection: the whole
      point is an unguessable, per-request value that you store and then
      compare on the callback. A literal that ships in your source is known
      to everyone and identical on every request, so an attacker can forge
      a matching callback.

      Generate `state` fresh per request from a CSPRNG
      (`crypto.randomBytes(32).toString('hex')` /
      `crypto.getRandomValues`), persist it in the session/cookie, and
      verify it when the provider redirects back.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-016
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-static-state
      category: security
      cwe: CWE-330
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - oauth2
    pattern-either:
      - patterns:
          - pattern: "new URLSearchParams({..., response_type: $R, ...})"
          - pattern-either:
              - pattern: 'new URLSearchParams({..., state: "$S", ...})'
              - pattern: "new URLSearchParams({..., state: '$S', ...})"
      - pattern-regex: "['\"]https?://(?=[^'\"]*[?&]response_type=)(?=[^'\"]*[?&]state=[A-Za-z0-9._~%-]+)[^'\"]+['\"]"
  - id: auth.oauth.token-in-localstorage
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      An OAuth/OIDC token is written to `localStorage` / `sessionStorage`, readable by any script on the origin.
      The key is token-named (`access_token`, `refresh_token`, `id_token`, …),
      and web storage is exposed to every script on the page, so any XSS,
      including a compromised third-party dependency, can exfiltrate the token
      via `getItem(...)`. There is no browser-side mitigation, unlike
      `HttpOnly` cookies.

      Keep access/refresh/id tokens in memory only, or have the server
      issue them in a `Secure; HttpOnly; SameSite=Strict` cookie.
      `sessionStorage` is no safer than `localStorage` against XSS: it
      grants the same attacker capability.

      See CWE-922: Insecure Storage of Sensitive Information.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-012
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-token-in-localstorage
      category: security
      cwe: CWE-922
      owasp: A05:2021
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#local-storage
        - https://cwe.mitre.org/data/definitions/922.html
      technology:
        - localStorage
        - sessionStorage
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: localStorage.setItem("$KEY", $V)
              - pattern: sessionStorage.setItem("$KEY", $V)
              - pattern: window.localStorage.setItem("$KEY", $V)
              - pattern: window.sessionStorage.setItem("$KEY", $V)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(access|refresh|id)[_-]?token$
      - patterns:
          - pattern-either:
              - pattern: localStorage.$KEY = $V
              - pattern: sessionStorage.$KEY = $V
              - pattern: window.localStorage.$KEY = $V
              - pattern: window.sessionStorage.$KEY = $V
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(access|refresh|id)[_-]?token$
      - patterns:
          - pattern-either:
              - pattern: localStorage["$KEY"] = $V
              - pattern: sessionStorage["$KEY"] = $V
              - pattern: window.localStorage["$KEY"] = $V
              - pattern: window.sessionStorage["$KEY"] = $V
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(access|refresh|id)[_-]?token$
  - id: auth.oauth.wildcard-redirect
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      OAuth `redirect_uri` allow-list contains a wildcard, an `http://` URL,
      or `localhost`. Wildcards (and HTTP) let an attacker register their own
      callback URL and harvest authorization codes; `localhost` whitelisting
      is acceptable for dev tooling but disastrous in production.

      Pin redirect URIs to exact, HTTPS URLs of subdomains you control. RFC 6749
      §10.6 explicitly requires "exact match" or restricted matching.
    metadata:
      oauthlint-rule-id: AUTH-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/oauth-wildcard-redirect
      category: security
      cwe: CWE-601
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.6
        - https://datatracker.ietf.org/doc/html/rfc8252#section-7.3
    pattern-either:
      - patterns:
          - pattern-regex: redirect_uris?\s*[:=]\s*\[[^\]]*['"][^'"]*\*[^'"]*['"]
      - patterns:
          - pattern-regex: redirect_uris?\s*[:=]\s*\[[^\]]*['"]http://[^'"]*['"]
          - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|\[::1\])
      - patterns:
          - pattern-regex: redirect_uri\s*[:=]\s*['"][^'"]*\*[^'"]*['"]
      - patterns:
          - pattern-regex: redirect_uri\s*[:=]\s*['"]http://[^'"]*['"]
          - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|\[::1\])
  - id: auth.passport.jwt-ignore-expiration
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A `passport-jwt` strategy is configured with `ignoreExpiration: true`.

      This disables the `exp` claim check, so the strategy authenticates expired
      tokens forever. A leaked or long-old JWT then never stops working,
      defeating short-lived access tokens. Remove `ignoreExpiration: true` (the
      default is `false`, which enforces `exp`) and issue tokens with a short
      lifetime. See CWE-613 (Insufficient Session Expiration).
    metadata:
      oauthlint-rule-id: AUTH-PASSPORT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/passport-jwt-ignore-expiration
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://www.passportjs.org/packages/passport-jwt/
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - passport-jwt
    patterns:
      - pattern-either:
          - pattern-inside: |
              import { ..., Strategy, ... } from 'passport-jwt'
              ...
          - pattern-inside: |
              import Strategy from 'passport-jwt'
              ...
          - pattern-inside: |
              $S = require('passport-jwt')
              ...
          - pattern-inside: |
              $S = require('passport-jwt').Strategy
              ...
          - pattern-inside: |
              { ..., Strategy, ... } = require('passport-jwt')
              ...
      - pattern-either:
          - pattern-inside: new $S({...}, ...)
          - pattern-inside: new $S.Strategy({...}, ...)
      - pattern: "ignoreExpiration: true"
  - id: auth.php.cookie.insecure-flags
    languages:
      - php
    severity: WARNING
    message: |
      An authentication-related cookie is set without the `Secure` and/or
      `HttpOnly` flags (or with `SameSite=None`). `HttpOnly=false` exposes the
      cookie to JavaScript so an XSS bug can steal the session; `Secure=false`
      lets it travel over plain HTTP where a network attacker can read it;
      `SameSite=None` (without an allowlist) sends it on cross-site requests
      (CWE-1004). AI-generated snippets pass `false` for these flags to avoid a
      "cookie not set" issue during local testing and it ships to production.

      Set the security flags on session/auth cookies:
        setcookie('session_id', $v, ['secure' => true, 'httponly' => true, 'samesite' => 'Lax']);
        session_set_cookie_params(['lifetime' => 3600, 'secure' => true, 'httponly' => true, 'samesite' => 'Lax']);
    metadata:
      oauthlint-rule-id: AUTH-PHP-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-cookie-insecure-flags
      category: security
      cwe: CWE-1004
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://www.php.net/manual/en/function.setcookie.php
        - https://cwe.mitre.org/data/definitions/1004.html
      technology:
        - php
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: setcookie($N, $V, $E, $P, $D, $S, false)
                  - pattern: setcookie($N, $V, $E, $P, $D, $S, 0)
              - metavariable-regex:
                  metavariable: $N
                  regex: (?i)^["']?.*(sess|sid|auth|token|jwt|login|remember|csrf|xsrf)
          - pattern: setcookie($N, $V, [..., 'httponly' => false, ...])
          - pattern: setcookie($N, $V, [..., 'secure' => false, ...])
          - pattern: setcookie($N, $V, [..., 'samesite' => 'None', ...])
          - pattern: session_set_cookie_params($L, $P, $D, false, $H)
          - pattern: session_set_cookie_params($L, $P, $D, $S, false)
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.cookie.laravel-insecure-session
    languages:
      - php
    severity: WARNING
    message: |
      A Laravel session config hard-codes an insecure cookie flag: `'secure'
      => false`, `'http_only' => false`, or `'same_site' => 'none'`. This turns
      off protections for the session cookie across the whole app: `secure=false`
      lets it travel over plain HTTP, `http_only=false` exposes it to JavaScript
      (XSS), and `same_site=none` sends it on cross-site requests (CWE-614).
      AI-generated config sets these to `false` to silence a local-HTTP issue and
      the insecure default ships.

      Drive the flag from the environment (secure by default) instead:
        'secure' => env('SESSION_SECURE_COOKIE', true),
        'http_only' => true,
        'same_site' => 'lax',
    metadata:
      oauthlint-rule-id: AUTH-PHP-COOKIE-002
      oauthlint-doc-url: https://oauthlint.dev/rules/php-cookie-laravel-insecure-session
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://laravel.com/docs/session
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - laravel
    pattern-either:
      - pattern-regex: (?i)['"]secure['"]\s*=>\s*false
      - pattern-regex: (?i)['"]http_only['"]\s*=>\s*false
      - pattern-regex: (?i)['"]same_site['"]\s*=>\s*['"]none['"]
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
  - id: auth.php.cors.wildcard-with-credentials
    languages:
      - php
    severity: WARNING
    message: |
      This endpoint sends `Access-Control-Allow-Credentials: true` together with
      an `Access-Control-Allow-Origin` that is either the wildcard `*` or the
      request's own `Origin` reflected back unchecked. That combination lets any
      website make credentialed cross-origin requests and read the response,
      leaking the victim's session / OAuth tokens cross-origin (CWE-942), an
      account-takeover primitive. AI-generated code pairs these two headers to
      "make the browser call work" without an origin allowlist.

      Echo the origin only after checking it against a trusted allowlist, e.g.
        if (in_array($origin, $allowed, true)) {
            header('Access-Control-Allow-Origin: ' . $origin);
            header('Access-Control-Allow-Credentials: true');
        }
    metadata:
      oauthlint-rule-id: AUTH-PHP-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-cors-wildcard-with-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://developer.mozilla.org/docs/Web/HTTP/CORS
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - php
    patterns:
      - pattern-either:
          - pattern: |
              header('Access-Control-Allow-Origin: *');
              ...
              header('Access-Control-Allow-Credentials: true');
          - pattern: |
              header('Access-Control-Allow-Credentials: true');
              ...
              header('Access-Control-Allow-Origin: *');
          - pattern: |
              header('Access-Control-Allow-Origin: ' . $_SERVER['HTTP_ORIGIN']);
              ...
              header('Access-Control-Allow-Credentials: true');
          - pattern: |
              header('Access-Control-Allow-Credentials: true');
              ...
              header('Access-Control-Allow-Origin: ' . $_SERVER['HTTP_ORIGIN']);
      - pattern-not-inside: |
          if (in_array(...)) { ... }
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.flow.socialite-stateless
    languages:
      - php
    severity: WARNING
    message: |
      A Laravel Socialite OAuth flow calls `->stateless()`, which disables the
      `state` parameter that ties the redirect to the user's session. Without it
      the callback cannot be bound to the request that started the flow, opening
      the login to CSRF / authorization-code injection (CWE-352). An attacker
      can trick a victim into completing the attacker's OAuth flow and link
      accounts. AI-generated code reaches for `stateless()` to "fix" a session
      error and silently removes the CSRF defense.

      Keep the stateful (default) flow so Socialite validates `state`:
        return Socialite::driver('google')->redirect();
        $user = Socialite::driver('google')->user();
      Only use `stateless()` for a token-based API where you validate `state`
      yourself.
    metadata:
      oauthlint-rule-id: AUTH-PHP-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-flow-socialite-stateless
      category: security
      cwe: CWE-352
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://laravel.com/docs/socialite
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - laravel-socialite
    patterns:
      - pattern: $X->stateless()
      - pattern-either:
          - pattern-inside: Socialite::driver(...)->...
          - pattern-inside: $S->driver(...)->...
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.jwt.manual-decode-no-verify
    languages:
      - php
    severity: ERROR
    message: |
      A JWT payload is read by hand (`json_decode(base64_decode($parts[1]))` on
      the second dot-segment of a token) without ever verifying the signature.
      The claims (user id, roles, scopes) are trusted straight from an attacker-
      controllable string, so anyone can forge a token with any identity and it
      will be accepted (CWE-347). This is a common AI-generated shortcut: the
      model "decodes" the token to read a claim and skips verification entirely.

      Verify the signature with the library instead, pinning the algorithm and a
      key from configuration:
        use Firebase\JWT\JWT;
        use Firebase\JWT\Key;
        $claims = JWT::decode($jwt, new Key($_ENV['JWT_SECRET'], 'HS256'));
    metadata:
      oauthlint-rule-id: AUTH-PHP-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-jwt-manual-decode-no-verify
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/firebase/php-jwt
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - php
    patterns:
      - pattern-either:
          - pattern: json_decode(base64_decode($SRC[1]))
          - pattern: json_decode(base64_decode($SRC[1]), true)
      - pattern-regex: (?i)base64_decode\s*\(\s*\$\w*(?:jwt|token|bearer|authoriz)\w*\s*\[\s*1\s*\]
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.jwt.unsecured-signer
    languages:
      - php
    severity: ERROR
    message: |
      A JWT is configured with an unsecured / `none` signer, e.g.
      `Configuration::forUnsecuredSigner()` or `new Signer\None()` (lcobucci/jwt),
      or the `'none'` algorithm passed to `JWT::encode()` / `new Key(...)`
      (firebase/php-jwt). Unsecured tokens carry no signature, so anyone can mint
      a token with any claims and it will be accepted (CWE-347). This appears in
      AI-generated "quick token" and debugging code that then ships.

      Use a real signer with a key from configuration:
        use Lcobucci\JWT\Configuration;
        use Lcobucci\JWT\Signer\Hmac\Sha256;
        use Lcobucci\JWT\Signer\Key\InMemory;
        $config = Configuration::forSymmetricSigner(
            new Sha256(), InMemory::base64Encoded(getenv('JWT_KEY'))
        );
    metadata:
      oauthlint-rule-id: AUTH-PHP-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/php-jwt-unsecured-signer
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://github.com/lcobucci/jwt
        - https://github.com/firebase/php-jwt
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - lcobucci-jwt
        - firebase-php-jwt
    patterns:
      - pattern-either:
          - pattern: Configuration::forUnsecuredSigner()
          - pattern: new Signer\None()
          - patterns:
              - pattern: new Key($K, $ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["']none["']$
          - patterns:
              - pattern: JWT::encode($P, $K, $ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["']none["']$
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.secret.hardcoded-jwt-key
    languages:
      - php
    severity: ERROR
    message: |
      A JWT signing key is a hard-coded string literal, passed to
      `JWT::encode()` / `new Key()` (firebase/php-jwt) or
      `InMemory::plainText()` / `InMemory::base64Encoded()` (lcobucci/jwt). This
      key signs and verifies every token: committed to source control it is one
      search away from compromise, letting an attacker forge a token for any
      user or role (CWE-798). AI-generated samples inline the secret to make the
      snippet "just work" and it ships unchanged.

      Read the key from the environment or a secret store instead:
        JWT::encode($payload, $_ENV['JWT_SECRET'], 'HS256');
        new Key(getenv('JWT_SECRET'), 'HS256');
    metadata:
      oauthlint-rule-id: AUTH-PHP-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-secret-hardcoded-jwt-key
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/firebase/php-jwt
        - https://github.com/lcobucci/jwt
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - firebase-php-jwt
        - lcobucci-jwt
    patterns:
      - pattern-either:
          - patterns:
              - pattern: JWT::encode($P, $K, $ALG)
              - metavariable-regex:
                  metavariable: $K
                  regex: ^["'][^"']{6,}["']$
          - patterns:
              - pattern: new Key($K, $ALG)
              - metavariable-regex:
                  metavariable: $K
                  regex: ^["'][^"']{6,}["']$
          - patterns:
              - pattern: InMemory::plainText($K)
              - metavariable-regex:
                  metavariable: $K
                  regex: ^["'][^"']{6,}["']$
          - patterns:
              - pattern: InMemory::base64Encoded($K)
              - metavariable-regex:
                  metavariable: $K
                  regex: ^["'][^"']{6,}["']$
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
        - "**/examples/**"
        - "**/samples/**"
        - "**/demo/**"
  - id: auth.php.session.insecure-ini
    languages:
      - php
    severity: WARNING
    message: |
      A PHP session hardening flag is turned off at runtime with `ini_set()`:
      `session.cookie_httponly`, `session.cookie_secure`, or
      `session.use_only_cookies` set to `0` / `'0'` / `false`. This exposes the
      session cookie to JavaScript (XSS), lets it travel over plain HTTP, or
      allows the session id in the URL to be accepted (CWE-1004). AI-generated
      code flips these off to work around a local setup and the weakened
      configuration ships.

      Enable them instead (or set them in php.ini):
        ini_set('session.cookie_httponly', 1);
        ini_set('session.cookie_secure', 1);
        ini_set('session.use_only_cookies', 1);
    metadata:
      oauthlint-rule-id: AUTH-PHP-SESSION-001
      oauthlint-doc-url: https://oauthlint.dev/rules/php-session-insecure-ini
      category: security
      cwe: CWE-1004
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://www.php.net/manual/en/session.security.ini.php
        - https://cwe.mitre.org/data/definitions/1004.html
      technology:
        - php
    patterns:
      - pattern-either:
          - pattern: ini_set('session.cookie_httponly', $V)
          - pattern: ini_set('session.cookie_secure', $V)
          - pattern: ini_set('session.use_only_cookies', $V)
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^(0|["']0["']|false)$
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.php"
        - "**/vendor/**"
  - id: auth.py.cookie.insecure-flags
    languages:
      - python
    severity: ERROR
    message: |
      A session/auth cookie is issued with a security attribute explicitly
      disabled. `secure=False` lets the cookie travel over plain HTTP (it can be
      sniffed on the wire), and `httponly=False` exposes it to JavaScript so an
      XSS payload can read and exfiltrate it. Either way the session token is
      at risk of theft (CWE-614, OWASP A05:2021). The same applies to Django's
      `SESSION_COOKIE_SECURE = False`, `CSRF_COOKIE_SECURE = False`, and
      `SESSION_COOKIE_HTTPONLY = False` settings.

      Always set Secure + HttpOnly (and ideally `SameSite`) on auth cookies,
      e.g. `response.set_cookie("session", token, secure=True, httponly=True,
      samesite="Lax")` or, in Django settings, `SESSION_COOKIE_SECURE = True`
      and `SESSION_COOKIE_HTTPONLY = True`.
    metadata:
      oauthlint-rule-id: AUTH-PY-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-cookie-insecure-flags
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://docs.djangoproject.com/en/stable/ref/settings/#session-cookie-secure
        - https://flask.palletsprojects.com/en/stable/api/#flask.Response.set_cookie
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - flask
        - django
    pattern-either:
      - pattern: $RESP.set_cookie(..., secure=False, ...)
      - pattern: $RESP.set_cookie(..., httponly=False, ...)
      - pattern: SESSION_COOKIE_SECURE = False
      - pattern: CSRF_COOKIE_SECURE = False
      - pattern: SESSION_COOKIE_HTTPONLY = False
  - id: auth.py.cors.allow-all
    languages:
      - python
    severity: ERROR
    message: |
      Flask-CORS allows any origin while credentials are enabled.
      This configuration pairs `supports_credentials=True` with a wildcard
      origin (`origins="*"`, `origins=["*"]`, or no `origins` argument at all,
      since Flask-CORS defaults to `*`). The CORS spec forbids the
      `Access-Control-Allow-Origin: *` + `Access-Control-Allow-Credentials: true`
      combination, so browsers will block it; the dangerous "fix" is to leave
      the wildcard in place while keeping credentials on, which exposes
      credentialed cross-origin access to ANY website (CWE-942). For OAuth/OIDC
      this leaks cookies, session tokens and CSRF protections cross-origin.

      Credentialed requests must use an explicit allow-list of trusted origins,
      e.g. `CORS(app, origins=["https://app.example.com"], supports_credentials=True)`.
      If you genuinely need a public, wildcard endpoint, drop credentials:
      `CORS(app, origins="*")` (the default, `supports_credentials=False`).
    metadata:
      oauthlint-rule-id: AUTH-PY-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-cors-allow-all
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://flask-cors.readthedocs.io/en/latest/configuration.html
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - flask-cors
    pattern-either:
      - pattern: CORS(..., origins="*", ..., supports_credentials=True, ...)
      - pattern: CORS(..., supports_credentials=True, ..., origins="*", ...)
      - pattern: CORS(..., origins=["*"], ..., supports_credentials=True, ...)
      - pattern: CORS(..., supports_credentials=True, ..., origins=["*"], ...)
      - pattern: '@cross_origin(..., origins="*", ..., supports_credentials=True, ...)'
      - pattern: '@cross_origin(..., supports_credentials=True, ..., origins="*", ...)'
      - pattern: '@cross_origin(..., origins=["*"], ..., supports_credentials=True, ...)'
      - pattern: '@cross_origin(..., supports_credentials=True, ..., origins=["*"], ...)'
      - patterns:
          - pattern: CORS(..., supports_credentials=True, ...)
          - pattern-not: CORS(..., origins=$ORIGINS, ...)
      - patterns:
          - pattern: "@cross_origin(..., supports_credentials=True, ...)"
          - pattern-not: "@cross_origin(..., origins=$ORIGINS, ...)"
  - id: auth.py.cors.fastapi-wildcard-credentials
    languages:
      - python
    severity: ERROR
    message: |
      FastAPI CORS allows any origin with credentials.

      Starlette's `CORSMiddleware` is configured with a wildcard origin
      (`allow_origins=["*"]` or `allow_origin_regex=".*"`) together with
      `allow_credentials=True`. The CORS spec forbids
      `Access-Control-Allow-Origin: *` alongside
      `Access-Control-Allow-Credentials: true`, so Starlette silently reflects
      the caller's `Origin` instead, turning the wildcard into "allow every
      site" for credentialed requests. Any website can then read authenticated
      responses, leaking cookies, session and OAuth tokens cross-origin
      (CWE-942).

      Credentialed CORS needs an explicit allow-list of trusted origins, e.g.
      `allow_origins=["https://app.example.com"], allow_credentials=True`. If
      the endpoint is genuinely public, drop credentials:
      `allow_origins=["*"], allow_credentials=False`.
    metadata:
      oauthlint-rule-id: AUTH-PY-CORS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-cors-fastapi-wildcard-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://www.starlette.io/middleware/#corsmiddleware
        - https://fastapi.tiangolo.com/tutorial/cors/
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - fastapi
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(CORSMiddleware, ...)
          - pattern: CORSMiddleware(...)
      - pattern: $F(..., allow_credentials=True, ...)
      - pattern-either:
          - pattern: $F(..., allow_origins=["*"], ...)
          - pattern: $F(..., allow_origin_regex=".*", ...)
  - id: auth.py.crypto.ecb-mode
    languages:
      - python
    severity: WARNING
    message: |
      A symmetric cipher is configured in ECB mode. ECB encrypts each block
      independently, so identical plaintext blocks yield identical ciphertext,
      leaking structure and enabling block-shuffling attacks (CWE-327). This
      matters for anything auth-related: encrypted tokens, cookies, credentials.

      Use an authenticated mode: AES-GCM (`AESGCM` / `modes.GCM`) or, failing
      that, CBC with a random IV plus a separate MAC.
    metadata:
      oauthlint-rule-id: AUTH-PY-CRYPTO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-crypto-ecb-mode
      category: security
      cwe: CWE-327
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
      technology:
        - pycryptodome
        - cryptography
    pattern-either:
      - pattern: AES.new($K, AES.MODE_ECB, ...)
      - pattern: AES.new($K, $LIB.MODE_ECB, ...)
      - pattern: Cipher($ALG, modes.ECB(), ...)
      - pattern: Cipher($ALG, $M.modes.ECB(), ...)
      - pattern: modes.ECB()
    paths:
      exclude:
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/conftest.py"
  - id: auth.py.crypto.passlib-weak-scheme
    languages:
      - python
    severity: ERROR
    message: |
      passlib configured with a weak or plaintext password scheme.

      A `CryptContext` lists a password hashing scheme that is broken for
      storing credentials: unsalted or fast digests (`hex_md5`, `hex_sha1`,
      `hex_sha256`, `md5_crypt`, `ldap_md5`), legacy `des_crypt`, or outright
      `plaintext` / `ldap_plaintext`. These are trivially brute-forced or
      reversed, so any leaked hash exposes the underlying password (CWE-916).

      Use a slow, salted, memory-hard scheme as the default, e.g.
      `CryptContext(schemes=["argon2"])` or
      `CryptContext(schemes=["bcrypt"])`. Keep a weak scheme only as a
      `deprecated` verifier during migration, never as an active hashing scheme.
    metadata:
      oauthlint-rule-id: AUTH-PY-CRYPTO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-crypto-passlib-weak-scheme
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://passlib.readthedocs.io/en/stable/lib/passlib.context.html
        - https://cwe.mitre.org/data/definitions/916.html
      technology:
        - passlib
    patterns:
      - pattern: CryptContext(..., schemes=[..., "$SCHEME", ...], ...)
      - metavariable-regex:
          metavariable: $SCHEME
          regex: ^(md5_crypt|des_crypt|plaintext|hex_md5|hex_sha1|hex_sha256|ldap_md5|ldap_plaintext)$
  - id: auth.py.django.cors-allow-all
    languages:
      - python
    severity: WARNING
    message: |
      django-cors-headers is configured to allow every origin, disabling
      cross-origin access control.

      `CORS_ALLOW_ALL_ORIGINS = True` (or the legacy `CORS_ORIGIN_ALLOW_ALL =
      True`) reflects any site's `Origin`, so ANY website can make cross-origin
      requests to your API; combined with credentialed sessions this leaks
      cookies, tokens and CSRF protections cross-origin (CWE-942, OWASP
      A05:2021). Set it to `False` and list trusted origins explicitly, e.g.
      `CORS_ALLOWED_ORIGINS = ["https://app.example.com"]`.
    metadata:
      oauthlint-rule-id: AUTH-PY-DJANGO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-django-cors-allow-all
      category: security
      cwe: CWE-942
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://github.com/adamchainz/django-cors-headers#cors_allow_all_origins-bool
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - django-cors-headers
    pattern-either:
      - pattern: CORS_ALLOW_ALL_ORIGINS = True
      - pattern: CORS_ORIGIN_ALLOW_ALL = True
  - id: auth.py.drf.default-authentication-empty
    languages:
      - python
    severity: ERROR
    message: |
      DRF disables authentication globally with an empty
      `DEFAULT_AUTHENTICATION_CLASSES` list.

      An empty list means no authentication scheme runs, so `request.user` is
      never populated from a credential and every view falls back to anonymous
      access (CWE-306, OWASP A01:2021). Permission checks that rely on
      `request.user` being authenticated then have nothing to enforce against.

      Populate the list with the schemes you use, for example
      `rest_framework.authentication.SessionAuthentication` and
      `rest_framework.authentication.TokenAuthentication`.
    metadata:
      oauthlint-rule-id: AUTH-PY-DRF-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-drf-default-authentication-empty
      category: security
      cwe: CWE-306
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.django-rest-framework.org/api-guide/authentication/#setting-the-authentication-scheme
        - https://cwe.mitre.org/data/definitions/306.html
      technology:
        - djangorestframework
    pattern: 'REST_FRAMEWORK = {..., "DEFAULT_AUTHENTICATION_CLASSES": [], ...}'
  - id: auth.py.drf.default-permission-allowany
    languages:
      - python
    severity: ERROR
    message: |
      DRF makes every endpoint public because `DEFAULT_PERMISSION_CLASSES` is set
      to `AllowAny`.

      With `AllowAny` as the project-wide default, every view that does not
      override `permission_classes` skips authorization entirely, so any
      unauthenticated caller can reach it (CWE-862, OWASP A01:2021). This is easy
      to ship by accident because it silently exposes future endpoints too.

      Set the global default to a real permission such as
      `rest_framework.permissions.IsAuthenticated` and opt specific views out to
      public only when you mean to.
    metadata:
      oauthlint-rule-id: AUTH-PY-DRF-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-drf-default-permission-allowany
      category: security
      cwe: CWE-862
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://www.django-rest-framework.org/api-guide/permissions/#setting-the-permission-policy
        - https://cwe.mitre.org/data/definitions/862.html
      technology:
        - djangorestframework
    pattern-either:
      - pattern: 'REST_FRAMEWORK = {..., "DEFAULT_PERMISSION_CLASSES": [..., AllowAny, ...], ...}'
      - pattern: 'REST_FRAMEWORK = {..., "DEFAULT_PERMISSION_CLASSES": [..., "rest_framework.permissions.AllowAny", ...], ...}'
  - id: auth.py.drf.view-authentication-disabled
    languages:
      - python
    severity: ERROR
    message: |
      A DRF view disables authentication with an empty `authentication_classes`
      list.

      Setting `authentication_classes = []` on a view (or the
      `@authentication_classes([])` decorator on a function view) turns off every
      authentication scheme for that endpoint, so `request.user` is always
      anonymous and any permission tied to an authenticated user cannot hold
      (CWE-306, OWASP A01:2021).

      List the schemes the view should accept, for example
      `authentication_classes = [TokenAuthentication]`, instead of emptying it.
    metadata:
      oauthlint-rule-id: AUTH-PY-DRF-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-drf-view-authentication-disabled
      category: security
      cwe: CWE-306
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.django-rest-framework.org/api-guide/views/#api_view
        - https://cwe.mitre.org/data/definitions/306.html
      technology:
        - djangorestframework
    pattern-either:
      - pattern: authentication_classes = []
      - pattern: "@authentication_classes([])"
  - id: auth.py.fastapi.hardcoded-api-key
    languages:
      - python
    severity: ERROR
    message: |
      A FastAPI security dependency (`Security(...)`, an API-key scheme such as
      `APIKeyHeader`/`APIKeyQuery`/`APIKeyCookie`, or an OAuth2 bearer scheme)
      injects a credential that is then compared against a hard-coded string
      literal. The accepted key/token is baked into the source, so anyone who
      reads the code (or a leaked repo) can authenticate, and the secret cannot
      be rotated without a redeploy (CWE-798). This is a common AI-generated
      shortcut: a single inline literal replaces a real key store.

      Compare against a secret loaded from the environment or a secret manager
      with a constant-time check instead, e.g.
      `secrets.compare_digest(api_key, os.environ["API_KEY"])`, and issue/verify
      per-client keys rather than one shared literal.
    metadata:
      oauthlint-rule-id: AUTH-PY-FASTAPI-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-fastapi-hardcoded-api-key
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: MEDIUM
      references:
        - https://fastapi.tiangolo.com/reference/security/
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fastapi
    patterns:
      - pattern-either:
          - pattern-inside: |
              def $FN(..., $K = Security(...), ...):
                  ...
          - pattern-inside: |
              async def $FN(..., $K = Security(...), ...):
                  ...
          - pattern-inside: |
              def $FN(..., $K: $T = Security(...), ...):
                  ...
          - pattern-inside: |
              async def $FN(..., $K: $T = Security(...), ...):
                  ...
          - pattern-inside: |
              def $FN(..., $K: Annotated[$T, Security(...)], ...):
                  ...
          - pattern-inside: |
              async def $FN(..., $K: Annotated[$T, Security(...)], ...):
                  ...
      - pattern-either:
          - pattern: $K == "..."
          - pattern: '"..." == $K'
          - pattern: secrets.compare_digest($K, "...")
          - pattern: secrets.compare_digest($K.encode(...), b"...")
          - pattern: hmac.compare_digest($K, "...")
          - pattern: hmac.compare_digest($K.encode(...), b"...")
  - id: auth.py.fastapi.hardcoded-http-basic
    languages:
      - python
    severity: ERROR
    message: |
      A FastAPI HTTP Basic auth dependency compares the request's username or
      password against a hard-coded string literal. The credential is baked into
      the source, so anyone who reads the code (or a leaked repo) has a working
      login, and the secret cannot be rotated without a redeploy (CWE-798). This
      is a common AI-generated mistake: FastAPI's own HTTP Basic example uses the
      literals `"stanleyjobson"` / `"swordfish"`, and assistants copy that shape
      straight into production auth.

      Compare against a secret loaded from the environment or a secret manager
      instead, e.g. `secrets.compare_digest(credentials.password.encode("utf8"),
      os.environ["ADMIN_PASSWORD"].encode("utf8"))`, and prefer a real user
      store with per-user salted password hashes for anything beyond a single
      service account.
    metadata:
      oauthlint-rule-id: AUTH-PY-FASTAPI-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-fastapi-hardcoded-http-basic
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://fastapi.tiangolo.com/advanced/security/http-basic-auth/
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fastapi
    patterns:
      - pattern-either:
          - pattern-inside: |
              def $FN(..., $CRED: HTTPBasicCredentials = ..., ...):
                  ...
          - pattern-inside: |
              async def $FN(..., $CRED: HTTPBasicCredentials = ..., ...):
                  ...
          - pattern-inside: |
              def $FN(..., $CRED: Annotated[HTTPBasicCredentials, ...], ...):
                  ...
          - pattern-inside: |
              async def $FN(..., $CRED: Annotated[HTTPBasicCredentials, ...], ...):
                  ...
      - pattern-either:
          - pattern: $C.username == "..."
          - pattern: $C.password == "..."
          - pattern: '"..." == $C.username'
          - pattern: '"..." == $C.password'
          - pattern: $C.username == b"..."
          - pattern: $C.password == b"..."
          - pattern: secrets.compare_digest($C.username, "...")
          - pattern: secrets.compare_digest($C.password, "...")
          - pattern: secrets.compare_digest($C.username, b"...")
          - pattern: secrets.compare_digest($C.password, b"...")
          - pattern: secrets.compare_digest($C.username.encode(...), b"...")
          - pattern: secrets.compare_digest($C.password.encode(...), b"...")
          - pattern: secrets.compare_digest($C.username.encode(...), "...")
          - pattern: secrets.compare_digest($C.password.encode(...), "...")
          - pattern: hmac.compare_digest($C.username, "...")
          - pattern: hmac.compare_digest($C.password, "...")
          - pattern: hmac.compare_digest($C.username.encode(...), b"...")
          - pattern: hmac.compare_digest($C.password.encode(...), b"...")
  - id: auth.py.fastapi.session-hardcoded-secret
    languages:
      - python
    severity: ERROR
    message: |
      Starlette's `SessionMiddleware` is configured with a hard-coded
      `secret_key` string literal. That key signs every session cookie: anyone
      who reads the source or a leaked repo can forge a session and impersonate
      any user, a complete authentication bypass (CWE-798). This is a common
      AI-generated shortcut, where a literal secret is inlined so the sample
      "just works" and is never externalized.

      Load the key from the environment or a secret manager instead, e.g.
      `app.add_middleware(SessionMiddleware, secret_key=os.environ["SESSION_SECRET"])`,
      and generate it with a CSPRNG such as `secrets.token_hex(32)`. Rotate the
      leaked secret out of source control.
    metadata:
      oauthlint-rule-id: AUTH-PY-FASTAPI-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-fastapi-session-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://www.starlette.io/middleware/#sessionmiddleware
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fastapi
        - starlette
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(SessionMiddleware, ..., secret_key="...", ...)
          - pattern: SessionMiddleware(..., secret_key="...", ...)
      - pattern-not-regex: secret_key\s*=\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: secret_key\s*=\s*["']<[^"']*>["']
      - pattern-not-regex: (?i)secret_key\s*=\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace|\.\.\.)
  - id: auth.py.fastapi.trusted-host-wildcard
    languages:
      - python
    severity: WARNING
    message: |
      Starlette's `TrustedHostMiddleware` is added but configured to trust every
      Host header (`allowed_hosts=["*"]`, or a list that contains `"*"`). The
      middleware exists specifically to validate the incoming `Host`/`X-Forwarded-Host`
      header against an allow-list; a wildcard disables that check, re-opening Host
      header injection: password-reset-link poisoning, cache poisoning, and
      routing of absolute URLs the app builds from the Host (CWE-346). This is a
      common AI-generated shortcut to silence a host-validation error rather than
      enumerate the real hostnames.

      List the exact hostnames the service answers on, e.g.
      `app.add_middleware(TrustedHostMiddleware, allowed_hosts=["app.example.com",
      "www.example.com"])` (a leading-dot entry like `"*.example.com"` matches
      subdomains and is fine; the problem is the bare `"*"`).
    metadata:
      oauthlint-rule-id: AUTH-PY-FASTAPI-004
      oauthlint-doc-url: https://oauthlint.dev/rules/py-fastapi-trusted-host-wildcard
      category: security
      cwe: CWE-346
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.starlette.io/middleware/#trustedhostmiddleware
        - https://cwe.mitre.org/data/definitions/346.html
      technology:
        - fastapi
        - starlette
    patterns:
      - pattern-either:
          - pattern: $APP.add_middleware(TrustedHostMiddleware, ..., allowed_hosts=$HOSTS, ...)
          - pattern: TrustedHostMiddleware(..., allowed_hosts=$HOSTS, ...)
      - metavariable-pattern:
          metavariable: $HOSTS
          patterns:
            - pattern-either:
                - pattern: '["*"]'
                - pattern: '[..., "*", ...]'
  - id: auth.py.flask.session-cookie-insecure
    languages:
      - python
    severity: ERROR
    message: |
      A Flask cookie security flag is disabled through `app.config`, weakening
      session and remember-me cookie protection.

      `SESSION_COOKIE_SECURE = False` lets the session cookie travel over plain
      HTTP where it can be sniffed on the wire, and `SESSION_COOKIE_HTTPONLY =
      False` exposes it to JavaScript so an XSS payload can read and exfiltrate
      it; the `REMEMBER_COOKIE_*` flags do the same for Flask-Login's long-lived
      remember-me token (CWE-614, OWASP A05:2021). Keep these `True` (or drive
      them from an environment check), e.g. `app.config["SESSION_COOKIE_SECURE"]
      = True` and `app.config["SESSION_COOKIE_HTTPONLY"] = True`.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLASK-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flask-session-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://flask.palletsprojects.com/en/stable/config/#SESSION_COOKIE_SECURE
        - https://flask-login.readthedocs.io/en/latest/#cookie-settings
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - flask
        - flask-login
    pattern-either:
      - pattern: $APP.config['SESSION_COOKIE_SECURE'] = False
      - pattern: $APP.config['SESSION_COOKIE_HTTPONLY'] = False
      - pattern: $APP.config['REMEMBER_COOKIE_SECURE'] = False
      - pattern: $APP.config['REMEMBER_COOKIE_HTTPONLY'] = False
      - pattern: $APP.config.update(..., SESSION_COOKIE_SECURE=False, ...)
      - pattern: $APP.config.update(..., REMEMBER_COOKIE_SECURE=False, ...)
  - id: auth.py.flow.csrf-exempt
    languages:
      - python
    severity: WARNING
    message: |
      A Django view disables CSRF protection. The `@csrf_exempt` decorator
      (from `django.views.decorators.csrf`), or `@method_decorator(csrf_exempt,
      ...)` on a class-based view, turns off Django's CSRF middleware check for
      that endpoint. An attacker can then forge cross-site requests that the
      victim's browser submits with their session cookie, a CSRF vulnerability.

      Do not exempt views from CSRF. Keep the default protection and submit the
      CSRF token from your client. For machine-to-machine endpoints such as
      webhooks, validate a signed request signature (e.g. an HMAC header)
      instead of disabling CSRF wholesale.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-005
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-csrf-exempt
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://docs.djangoproject.com/en/stable/ref/csrf/
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - django
    pattern-either:
      - patterns:
          - pattern: |
              @csrf_exempt
              def $VIEW(...): ...
      - patterns:
          - pattern: |
              @method_decorator(csrf_exempt, ...)
              class $VIEW(...): ...
  - id: auth.py.flow.debug-enabled
    languages:
      - python
    severity: WARNING
    message: |
      Debug mode is hard-coded to `True`. In production this leaks the
      `SECRET_KEY`, environment variables, and full tracebacks, and Flask's
      Werkzeug debugger additionally exposes an interactive console that
      allows remote code execution.

      Never enable debug mode in production. Drive it from an environment
      variable that defaults to off, e.g.
      `debug=os.environ.get("FLASK_DEBUG") == "1"` (Flask) or
      `DEBUG = os.environ.get("DJANGO_DEBUG") == "1"` (Django).
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-debug-enabled
      category: security
      cwe: CWE-489
      owasp: A05:2021
      llm-prevalence: HIGH
      references:
        - https://flask.palletsprojects.com/en/stable/config/#DEBUG
        - https://docs.djangoproject.com/en/stable/ref/settings/#debug
        - https://cwe.mitre.org/data/definitions/489.html
      technology:
        - flask
        - django
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: $APP.config["DEBUG"] = True
      - pattern: $APP.debug = True
      - pattern: DEBUG = True
  - id: auth.py.flow.insecure-random-token
    languages:
      - python
    severity: ERROR
    message: |
      A security-sensitive value is being generated with the `random` module.
      The value is a token, secret, password, OTP, nonce, API key, or
      reset/verification code. `random` is a pseudo-random number generator
      seeded from predictable state and is NOT cryptographically secure: its
      output can be predicted or reproduced by an attacker, defeating the
      secret entirely.

      Use the `secrets` module or `os.urandom` instead:
      `secrets.token_urlsafe(32)`, `secrets.token_hex(16)`,
      `secrets.choice(alphabet)`, or `os.urandom(32)`. These draw from the
      operating system's CSPRNG.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-004
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-insecure-random-token
      category: security
      cwe: CWE-330
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://docs.python.org/3/library/secrets.html
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - random
    patterns:
      - pattern-either:
          - pattern: $VAR = random.random()
          - pattern: $VAR = random.randint(...)
          - pattern: $VAR = random.randrange(...)
          - pattern: $VAR = random.choice(...)
          - pattern: $VAR = random.choices(...)
          - pattern: $VAR = random.sample(...)
          - pattern: $VAR = random.getrandbits(...)
          - patterns:
              - pattern: $VAR = "".join($X)
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    - pattern-either:
                        - pattern: random.choice(...)
                        - pattern: random.choices(...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|password|passwd|otp|nonce|api_?key|reset|verification).*
  - id: auth.py.flow.oauth-credential-in-log
    languages:
      - python
    severity: ERROR
    message: |
      An OAuth/OIDC credential from the request flows into a logging call.
      The tainted value is an authorization `code`, an `access_token` /
      `refresh_token` / `id_token`, a bearer `token`, a `client_secret`, or
      the raw `Authorization` header, and the sink is `print`, `logging.*`,
      or a `logger.*` call. Logs are written to files, shipped to aggregators
      (Datadog, Splunk, CloudWatch) and read by people and systems that should
      never see live credentials. A leaked authorization code or token can be
      replayed to impersonate the user or complete the OAuth exchange
      (CWE-532).

      Never log the raw credential. Redact or mask it before logging, log a
      non-sensitive identifier instead (a user id, a key id), or drop the field
      entirely.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-009
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-oauth-credential-in-log
      category: security
      cwe: CWE-532
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.3
        - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      technology:
        - flask
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get($K)
              - pattern: request.form.get($K)
              - pattern: request.values.get($K)
              - pattern: request.json.get($K)
              - pattern: request.args[$K]
              - pattern: request.form[$K]
              - pattern: request.values[$K]
              - pattern: request.json[$K]
              - pattern: flask.request.args.get($K)
              - pattern: flask.request.form.get($K)
              - pattern: flask.request.json.get($K)
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?:code|access[_-]?token|accesstoken|refresh[_-]?token|refreshtoken|id[_-]?token|idtoken|token|client[_-]?secret|clientsecret)["']$
      - patterns:
          - pattern-either:
              - pattern: request.headers.get($K)
              - pattern: request.headers[$K]
              - pattern: flask.request.headers.get($K)
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["']authorization["']$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: print(...)
              - pattern: logging.info(...)
              - pattern: logging.debug(...)
              - pattern: logging.warning(...)
              - pattern: logging.error(...)
              - pattern: logging.exception(...)
              - pattern: logging.critical(...)
              - patterns:
                  - pattern: $LOG.$LEVEL(...)
                  - metavariable-regex:
                      metavariable: $LOG
                      regex: (?i)^.*log(?:ger)?$
                  - metavariable-regex:
                      metavariable: $LEVEL
                      regex: ^(?:info|debug|warning|warn|error|exception|critical)$
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
      - pattern: mask_token(...)
  - id: auth.py.flow.open-redirect
    languages:
      - python
    severity: ERROR
    message: |
      Untrusted request data flows into a Flask `redirect(...)` without
      validation, an open redirect (CWE-601). An attacker can craft a link
      to your trusted domain that bounces the victim to an attacker-controlled
      site, enabling phishing and OAuth redirect/authorization-code abuse (the
      victim trusts your URL, then lands on the attacker's page).

      Never redirect to a raw `request.args`/`request.form`/`request.values`/
      `request.cookies`/`request.headers` value. Build the destination with
      `url_for(...)` (safe by construction), or validate the target against an
      explicit allow-list / an `is_safe_url(...)`-style same-host check before
      redirecting.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-006
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-open-redirect
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - flask
    mode: taint
    pattern-sources:
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.cookies
      - pattern: flask.request.headers
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: request.cookies
      - pattern: request.headers
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.cookies.get(...)
      - pattern: request.headers.get(...)
      - pattern: request.args[$K]
      - pattern: request.form[$K]
      - pattern: request.values[$K]
      - pattern: request.cookies[$K]
      - pattern: request.headers[$K]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: redirect($SINK)
              - pattern: redirect($SINK, ...)
              - pattern: flask.redirect($SINK)
              - pattern: flask.redirect($SINK, ...)
              - pattern: 'Response(..., headers={..., "Location": $SINK, ...}, ...)'
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: url_for(...)
      - pattern: flask.url_for(...)
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if is_safe_url($V):
                  ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if url_has_allowed_host_and_scheme($V, ...):
                  ...
  - id: auth.py.flow.requests-verify-disabled
    languages:
      - python
    severity: ERROR
    message: |
      A `requests` call disables TLS certificate verification with
      `verify=False`. This silences the validation of the server's
      certificate, so an attacker who can intercept the connection can
      present any certificate and read or tamper with the traffic, a
      classic man-in-the-middle exposure. For OAuth/OIDC this leaks
      authorization codes, access tokens and client secrets.

      Never set `verify=False`. Leave verification on (the default) so the
      system CA bundle is used. In development against a private CA, point
      `verify` at the CA bundle instead, e.g.
      `requests.get(url, verify="/path/to/ca-bundle.pem")` or set the
      `REQUESTS_CA_BUNDLE` env var (certifi).
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-requests-verify-disabled
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - requests
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=$V, ...)
          - pattern: requests.post(..., verify=$V, ...)
          - pattern: requests.put(..., verify=$V, ...)
          - pattern: requests.delete(..., verify=$V, ...)
          - pattern: requests.patch(..., verify=$V, ...)
          - pattern: requests.head(..., verify=$V, ...)
          - pattern: requests.options(..., verify=$V, ...)
          - pattern: requests.request(..., verify=$V, ...)
          - pattern: $SESSION.get(..., verify=$V, ...)
          - pattern: $SESSION.post(..., verify=$V, ...)
          - pattern: $SESSION.put(..., verify=$V, ...)
          - pattern: $SESSION.delete(..., verify=$V, ...)
          - pattern: $SESSION.patch(..., verify=$V, ...)
          - pattern: $SESSION.head(..., verify=$V, ...)
          - pattern: $SESSION.options(..., verify=$V, ...)
          - pattern: $SESSION.request(..., verify=$V, ...)
      - metavariable-regex:
          metavariable: $V
          regex: ^False$
      - focus-metavariable: $V
    fix: "True"
  - id: auth.py.flow.secret-in-response
    languages:
      - python
    severity: ERROR
    message: |
      A server-side secret read from the environment flows into an HTTP
      response sent back to the client, leaking it (CWE-200). Anything you
      return from a Flask view (via `jsonify(...)`, `make_response(...)`,
      `Response(...)`) is visible to every caller, so an env value whose name
      looks like a credential (`API_KEY`, `CLIENT_SECRET`, `*_TOKEN`,
      `*_PASSWORD`, a private key, an access key, ...) must never reach it.

      Never send a server secret to the client. Return only the data the
      caller needs; keep credentials server-side. If a value genuinely must be
      surfaced, redact or mask it first (`redact(...)` / `mask_secret(...)`),
      and prefer exposing only public configuration (names prefixed
      `PUBLIC_` / `NEXT_PUBLIC_` / `VITE_`) to clients.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-008
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-secret-in-response
      category: security
      cwe: CWE-200
      owasp: API3:2023
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
      technology:
        - flask
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: os.environ[$KEY]
              - pattern: os.environ.get($KEY)
              - pattern: os.environ.get($KEY, ...)
              - pattern: os.getenv($KEY)
              - pattern: os.getenv($KEY, ...)
              - pattern: environ[$KEY]
              - pattern: environ.get($KEY)
              - pattern: environ.get($KEY, ...)
              - pattern: getenv($KEY)
              - pattern: getenv($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^['"]?(?!(?:NEXT_PUBLIC_|VITE_|PUBLIC_))\w*(?:secret|password|passwd|token|api[_-]?key|private[_-]?key|client[_-]?secret|credential|access[_-]?key)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: jsonify(..., $X, ...)
              - pattern: jsonify(..., $K=$X, ...)
              - pattern: flask.jsonify(..., $X, ...)
              - pattern: flask.jsonify(..., $K=$X, ...)
              - pattern: make_response(..., $X, ...)
              - pattern: make_response(..., $K=$X, ...)
              - pattern: flask.make_response(..., $X, ...)
              - pattern: flask.make_response(..., $K=$X, ...)
              - pattern: Response(..., $X, ...)
              - pattern: Response(..., $K=$X, ...)
              - pattern: flask.Response(..., $X, ...)
              - pattern: flask.Response(..., $K=$X, ...)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
      - pattern: mask_secret(...)
  - id: auth.py.flow.ssrf
    languages:
      - python
    severity: ERROR
    message: |
      Untrusted request data flows into an outbound HTTP request without
      validation, a Server-Side Request Forgery (SSRF, CWE-918). An attacker
      who controls the target URL can make your server reach internal-only
      services (admin panels, databases, other microservices behind your
      firewall) or the cloud metadata endpoint (e.g. http://169.254.169.254/),
      stealing IAM/instance credentials and pivoting deeper into your network.

      Never pass a raw `request.args`/`request.form`/`request.values`/
      `request.json`/`request.cookies`/`request.headers` value to
      `requests`/`urllib`/`httpx`/`aiohttp`. Validate the destination host
      against an explicit allow-list (`is_allowed_url(...)` /
      `validate_host(...)` / `url_has_allowed_host_and_scheme(...)`) before the
      request, and reject link-local / private / metadata addresses.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-007
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - flask
        - requests
        - httpx
    mode: taint
    pattern-sources:
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.json
      - pattern: flask.request.cookies
      - pattern: flask.request.headers
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: request.json
      - pattern: request.cookies
      - pattern: request.headers
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json.get(...)
      - pattern: request.cookies.get(...)
      - pattern: request.headers.get(...)
      - pattern: request.args[$K]
      - pattern: request.form[$K]
      - pattern: request.values[$K]
      - pattern: request.json[$K]
      - pattern: request.cookies[$K]
      - pattern: request.headers[$K]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.get($URL, ...)
              - pattern: requests.post($URL, ...)
              - pattern: requests.put($URL, ...)
              - pattern: requests.delete($URL, ...)
              - pattern: requests.patch($URL, ...)
              - pattern: requests.head($URL, ...)
              - pattern: requests.request(..., $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.urlopen($URL)
              - pattern: httpx.get($URL, ...)
              - pattern: httpx.post($URL, ...)
              - pattern: httpx.put($URL, ...)
              - pattern: httpx.delete($URL, ...)
              - pattern: httpx.patch($URL, ...)
              - pattern: httpx.head($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $CLIENT.get($URL, ...)
                      - pattern: $CLIENT.post($URL, ...)
                      - pattern: $CLIENT.put($URL, ...)
                      - pattern: $CLIENT.delete($URL, ...)
                      - pattern: $CLIENT.patch($URL, ...)
                      - pattern: $CLIENT.head($URL, ...)
                      - pattern: $CLIENT.request(..., $URL, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(?!request(\.|$)).*
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if is_allowed_url($V):
                  ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if validate_host($V):
                  ...
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if url_has_allowed_host_and_scheme($V, ...):
                  ...
  - id: auth.py.flow.weak-password-hash
    languages:
      - python
    severity: ERROR
    message: |
      A password is being hashed with a fast, general-purpose digest from
      `hashlib` (MD5, SHA-1, SHA-256, SHA-512). These algorithms are designed
      to be fast, which makes offline brute-force and rainbow-table attacks
      cheap. They are NOT suitable for storing passwords.

      Use a dedicated, slow password-hashing function with a per-password salt
      and a tunable work factor: `bcrypt` (`bcrypt.hashpw`), `argon2`
      (`argon2.PasswordHasher().hash`), `scrypt`, or a wrapper such as
      `passlib`. These resist brute-force by design.
    metadata:
      oauthlint-rule-id: AUTH-PY-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-flow-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/916.html
        - https://argon2-cffi.readthedocs.io/en/stable/
        - https://passlib.readthedocs.io/en/stable/
      technology:
        - hashlib
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: hashlib.md5($PW)
              - pattern: hashlib.sha1($PW)
              - pattern: hashlib.sha256($PW)
              - pattern: hashlib.sha512($PW)
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^.*(password|passwd|pwd).*$
      - patterns:
          - pattern-either:
              - pattern: |
                  $H = hashlib.md5(...)
                  ...
                  $H.update($PW)
              - pattern: |
                  $H = hashlib.sha1(...)
                  ...
                  $H.update($PW)
              - pattern: |
                  $H = hashlib.sha256(...)
                  ...
                  $H.update($PW)
              - pattern: |
                  $H = hashlib.sha512(...)
                  ...
                  $H.update($PW)
          - metavariable-regex:
              metavariable: $PW
              regex: (?i)^.*(password|passwd|pwd).*$
  - id: auth.py.jwt.alg-none
    languages:
      - python
    severity: ERROR
    message: |
      A JWT is decoded or signed with the `none` algorithm. The `none`
      algorithm means the token is NOT cryptographically signed, so any
      attacker can forge a token with arbitrary claims and have it accepted,
      a complete authentication bypass (CVE-class JWT alg=none vulnerability).

      Never allow `none`. Pin a strong signing algorithm explicitly:
      `jwt.decode(token, key, algorithms=["RS256"])` for verification, or
      `jwt.encode(claims, key, algorithm="RS256")` (also ES256 / HS256) when
      issuing tokens. Never include `"none"` in the `algorithms` allowlist.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-alg-none
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - pyjwt
    pattern-either:
      - patterns:
          - pattern: jwt.decode(..., algorithms=$ALGS, ...)
          - metavariable-regex:
              metavariable: $ALGS
              regex: (?i).*['"]none['"].*
      - patterns:
          - pattern: jwt.encode(..., algorithm=$ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^['"]none['"]$
  - id: auth.py.jwt.algorithm-confusion
    languages:
      - python
    severity: ERROR
    message: |
      A JWT is decoded with an `algorithms` allowlist that mixes an HMAC algorithm with an asymmetric one.
      The list combines a symmetric HMAC algorithm (HS256/HS384/HS512) with an
      asymmetric one (RS*/ES*/PS*). This enables the "algorithm confusion"
      attack: an attacker who knows your RSA/EC PUBLIC key can sign a forged
      token with HMAC, using that public key string as the shared secret.
      Because HS* is also accepted, PyJWT verifies the forgery with the public
      key as the HMAC secret and treats it as valid: a complete authentication
      bypass.

      Allow only ONE algorithm family, the one you actually use. If you issue
      RS256 tokens, pin `jwt.decode(token, public_key, algorithms=["RS256"])`
      and never also accept an HS* algorithm with the same verification key.

      CWE-327: Use of a Broken or Risky Cryptographic Algorithm.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-006
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-algorithm-confusion
      category: security
      cwe: CWE-327
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
      technology:
        - PyJWT
    patterns:
      - pattern: jwt.decode(..., algorithms=$ALGS, ...)
      - metavariable-regex:
          metavariable: $ALGS
          regex: (?s)(?=.*['"]HS(256|384|512)['"])(?=.*['"](RS|ES|PS)(256|384|512)['"])
      - pattern-inside: |
          import jwt
          ...
  - id: auth.py.jwt.hardcoded-secret
    languages:
      - python
    severity: ERROR
    message: |
      A JWT signing/verification key is hardcoded as a string literal in the
      call to PyJWT. Anyone who can read the source or git history can forge or
      tamper with tokens, which is a complete authentication bypass.

      Load the secret from the environment or a secret manager instead, e.g.
      `key = os.environ["JWT_SECRET"]` and `jwt.encode(payload, key, ...)`.
      Never commit signing keys to source control.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.encode
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - pyjwt
    pattern-either:
      - patterns:
          - pattern: jwt.encode($PAYLOAD, $KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'].*["']$
      - patterns:
          - pattern: jwt.decode($TOKEN, $KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'].*["']$
  - id: auth.py.jwt.no-algorithms
    languages:
      - python
    severity: WARNING
    message: |
      A JWT is decoded with a verification key but WITHOUT an explicit
      `algorithms` allowlist. Without pinning the accepted algorithms, PyJWT
      may accept a token signed with an unexpected algorithm, enabling
      algorithm-confusion attacks (e.g. an RS256 verifier tricked into
      treating an attacker-supplied HS256 token as valid by using the public
      key as an HMAC secret).

      Always pass an explicit allowlist: `jwt.decode(token, key,
      algorithms=["RS256"])` (or the exact algorithm you expect). List only the
      algorithms your application actually uses.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-no-algorithms
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - pyjwt
    patterns:
      - pattern: jwt.decode($T, $K, ...)
      - pattern-not: jwt.decode($T, $K, ..., algorithms=$A, ...)
      - pattern-not: jwt.decode($T, ..., verify=False, ...)
      - pattern-not: jwt.decode($T, ..., options=$OPTS, ...)
      - pattern-inside: |
          import jwt
          ...
  - id: auth.py.jwt.no-expiration
    languages:
      - python
    severity: WARNING
    message: |
      A JWT is decoded with `options={"verify_exp": False}`, which turns off
      PyJWT's `exp` (expiration) check. With expiry verification disabled, an
      expired (or stolen and long-since-revoked) token is still accepted, so
      tokens effectively never expire.

      Remove the `"verify_exp": False` option; PyJWT verifies `exp` by default,
      e.g. `jwt.decode(token, key, algorithms=["RS256"])`. If a token legitimately
      carries no `exp`, prefer `options={"require": ["exp"]}` to mandate one.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-no-expiration
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - PyJWT
    patterns:
      - pattern-either:
          - pattern: jwt.decode(..., options=$OPTS, ...)
          - pattern: decode(..., options=$OPTS, ...)
      - metavariable-pattern:
          metavariable: $OPTS
          pattern: '{..., "verify_exp": False, ...}'
  - id: auth.py.jwt.no-verify
    languages:
      - python
    severity: ERROR
    message: |
      A JWT is decoded with signature verification disabled. PyJWT's
      `jwt.decode(token, verify=False)` (legacy) or
      `options={"verify_signature": False}` parses the token WITHOUT checking
      the signature, so any attacker-forged token is accepted, a complete
      authentication bypass.

      Always verify: `jwt.decode(token, key, algorithms=["RS256"])`. If you
      only need to read an unverified header (e.g. the `kid` before fetching
      the key), use `jwt.get_unverified_header(token)` and treat the claims
      as untrusted.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-no-verify
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - pyjwt
    pattern-either:
      - pattern: jwt.decode(..., verify=False, ...)
      - patterns:
          - pattern: jwt.decode(..., options=$OPTS, ...)
          - metavariable-pattern:
              metavariable: $OPTS
              pattern: '{..., "verify_signature": False, ...}'
  - id: auth.py.jwt.untrusted-verify-key
    languages:
      - python
    severity: ERROR
    message: |
      Untrusted request input flows into the verification key or the
      `algorithms` allowlist of `jwt.decode(...)` (PyJWT / python-jose). When
      the attacker controls the key, they sign their own forged token and
      supply the matching key, so every token "verifies", a complete
      authentication bypass. When the attacker controls `algorithms`, they can
      downgrade verification (e.g. to `HS256` against a public key, or to
      `none` on older libraries) and defeat the signature check (CWE-347,
      Improper Verification of Cryptographic Signature).

      The verification key and the accepted algorithms must be fixed
      server-side. Pin `algorithms` to a constant allowlist
      (`algorithms=["RS256"]`) and resolve the key from trusted configuration or
      a vetted key set keyed by a validated `kid`, never from `request.args`,
      `request.form`, `request.json`, or `request.headers`.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-007
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-untrusted-verify-key
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://datatracker.ietf.org/doc/html/rfc7518#section-3.1
        - https://owasp.org/www-project-api-security/
      technology:
        - pyjwt
        - python-jose
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args.getlist(...)
      - pattern: request.args[...]
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.values.get(...)
      - pattern: request.json.get(...)
      - pattern: request.headers.get(...)
      - pattern: request.headers[...]
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.headers.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: jwt.decode($T, $SINK)
              - pattern: jwt.decode($T, $SINK, ...)
              - pattern: jwt.decode($T, key=$SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: jwt.decode(..., algorithms=$SINK, ...)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: is_allowed_algorithm(...)
      - pattern: validate_algorithm(...)
      - pattern: is_allowed_key(...)
      - pattern: load_trusted_key(...)
  - id: auth.py.jwt.verify-claims-disabled
    languages:
      - python
    severity: WARNING
    message: |
      PyJWT decode disables audience or issuer checks.

      `jwt.decode(...)` is called with an `options` dict that turns off a claim
      check: `"verify_aud": False`, `"verify_iss": False`, or
      `"verify_nbf": False`. Skipping these lets a token minted for a different
      audience or issuer (for example one from another tenant or a lower-trust
      service) be accepted here, defeating the boundary those claims are meant
      to enforce (CWE-347).

      Remove the disabling option and validate the claim, e.g.
      `jwt.decode(token, key, algorithms=["RS256"], audience="api",
      issuer="https://issuer.example.com")`. PyJWT only checks `aud`/`iss` when
      you pass the expected value, so supply it rather than disabling the check.
    metadata:
      oauthlint-rule-id: AUTH-PY-JWT-008
      oauthlint-doc-url: https://oauthlint.dev/rules/py-jwt-verify-claims-disabled
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - pyjwt
    patterns:
      - pattern-either:
          - pattern: jwt.decode(..., options=$OPTS, ...)
          - pattern: decode(..., options=$OPTS, ...)
      - metavariable-pattern:
          metavariable: $OPTS
          pattern-either:
            - pattern: '{..., "verify_aud": False, ...}'
            - pattern: '{..., "verify_iss": False, ...}'
            - pattern: '{..., "verify_nbf": False, ...}'
  - id: auth.py.mcp.dns-rebinding-unprotected
    languages:
      - python
    severity: WARNING
    message: |
      This FastMCP server binds to `0.0.0.0` and serves a network transport
      (streamable-http / SSE) without DNS-rebinding protection (CWE-346). When
      the host is not loopback, the SDK does NOT auto-enable protection, so a
      web page the user visits can rebind a DNS name to this server and drive
      its tools cross-origin. (Binding to `127.0.0.1` auto-protects since 1.23.0.)

      Pass explicit transport security with a Host allow-list:
        from mcp.server.transport_security import TransportSecuritySettings
        mcp = FastMCP(
            "name", host="0.0.0.0",
            transport_security=TransportSecuritySettings(
                enable_dns_rebinding_protection=True,
                allowed_hosts=["mcp.example.com"],
                allowed_origins=["https://app.example.com"],
            ),
        )
    metadata:
      oauthlint-rule-id: AUTH-PY-MCP-005
      oauthlint-doc-url: https://oauthlint.dev/rules/py-mcp-dns-rebinding-unprotected
      category: security
      cwe: CWE-346
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://www.cve.org/CVERecord?id=CVE-2025-66416
        - https://cwe.mitre.org/data/definitions/346.html
      technology:
        - mcp
        - fastmcp
        - modelcontextprotocol
    patterns:
      - pattern-either:
          - pattern: $M.run(transport="streamable-http", ...)
          - pattern: $M.run(transport="sse", ...)
      - pattern-inside: |
          $M = FastMCP(..., host="0.0.0.0", ...)
          ...
      - pattern-not-inside: |
          $M = FastMCP(..., transport_security=$TS, ...)
          ...
      - pattern-not: $M.run(..., transport_security=$TS)
  - id: auth.py.mcp.missing-resource-binding
    languages:
      - python
    severity: WARNING
    message: |
      This MCP server enables auth via `AuthSettings(...)` but never sets
      `resource_server_url`. Per the MCP spec, the server is an OAuth 2.1
      resource server and MUST bind tokens to its own resource identifier
      (RFC 8707). Without `resource_server_url`, FastMCP does NOT serve the
      Protected Resource Metadata endpoint (RFC 9728), so clients cannot
      discover the authorization server, and the token audience is not
      anchored to this server (CWE-345).

      Set it to this server's canonical URL:
        auth=AuthSettings(
            issuer_url=AUTH_SERVER_URL,
            resource_server_url=THIS_SERVER_URL,   # RFC 8707 + serves RFC 9728 metadata
            required_scopes=[MCP_SCOPE],
        )
    metadata:
      oauthlint-rule-id: AUTH-PY-MCP-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-mcp-missing-resource-binding
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://datatracker.ietf.org/doc/html/rfc8707
        - https://datatracker.ietf.org/doc/html/rfc9728
      technology:
        - mcp
        - fastmcp
        - modelcontextprotocol
    patterns:
      - pattern: AuthSettings(...)
      - pattern-not: AuthSettings(..., resource_server_url=$X, ...)
  - id: auth.py.mcp.token-passthrough
    languages:
      - python
    severity: ERROR
    message: |
      An MCP server forwards the INCOMING caller token to an upstream API
      (token pass-through). The token was issued for THIS server as its
      audience (RFC 8707); replaying it against another resource server is a
      confused-deputy vulnerability (CWE-863). The MCP authorization spec is
      explicit: a resource server MUST NOT accept or transit a token that was
      not issued for it.

      Never send `get_access_token().token` / `access_token.token` / the raw
      `Authorization` header upstream. Do a token exchange (RFC 8693) or use a
      credential minted for the upstream audience, and send THAT token:
        upstream = await exchange_token(access_token.token, audience=UPSTREAM)
        await client.get(UPSTREAM, headers={"Authorization": f"Bearer {upstream}"})
    metadata:
      oauthlint-rule-id: AUTH-PY-MCP-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-mcp-token-passthrough
      category: security
      cwe: CWE-863
      owasp: API5:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://datatracker.ietf.org/doc/html/rfc8693
        - https://datatracker.ietf.org/doc/html/rfc8707
      technology:
        - modelcontextprotocol
        - mcp
        - fastmcp
    mode: taint
    pattern-sources:
      - pattern: get_access_token().token
      - pattern: access_token.token
      - pattern: auth_info.token
      - pattern: request.headers["authorization"]
      - pattern: request.headers.get("authorization")
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'httpx.$M($URL, ..., headers={..., "Authorization": $SINK, ...}, ...)'
              - pattern: 'httpx2.$M($URL, ..., headers={..., "Authorization": $SINK, ...}, ...)'
              - pattern: 'requests.$M($URL, ..., headers={..., "Authorization": $SINK, ...}, ...)'
              - pattern: '$CLIENT.$M($URL, ..., headers={..., "Authorization": $SINK, ...}, ...)'
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: exchange_token(...)
      - pattern: $P.exchange_token(...)
  - id: auth.py.mcp.tool-handler-ssrf
    languages:
      - python
    severity: ERROR
    message: |
      An argument of an MCP tool handler (`@mcp.tool()`) flows into an outbound
      HTTP request without validation, a server-side request forgery (SSRF,
      CWE-918). Tool arguments are attacker-influenced: an LLM (or a malicious
      caller) can point the URL at internal services, cloud metadata
      (169.254.169.254), or localhost. BlueRock found ~36.7% of MCP servers
      SSRF-prone.

      Validate the target before fetching: resolve and allow-list the host,
      reject private/link-local ranges, and disable redirects. Never pass a raw
      tool argument straight into `httpx`/`requests`.
    metadata:
      oauthlint-rule-id: AUTH-PY-MCP-004
      oauthlint-doc-url: https://oauthlint.dev/rules/py-mcp-tool-handler-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - mcp
        - fastmcp
        - modelcontextprotocol
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  @$DEC.tool(...)
                  def $F(..., $ARG, ...):
                      ...
              - pattern: |
                  @$DEC.tool(...)
                  async def $F(..., $ARG, ...):
                      ...
          - focus-metavariable: $ARG
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: httpx.$M($SINK, ...)
              - pattern: httpx2.$M($SINK, ...)
              - pattern: requests.$M($SINK, ...)
              - patterns:
                  - pattern: $CLIENT.$M($SINK, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: ^(client|http_client|httpx_client|http|session|_client|c)$
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|delete|patch|head|request|stream|send)$
          - focus-metavariable: $SINK
  - id: auth.py.mcp.unauthenticated-server
    languages:
      - python
    severity: ERROR
    message: |
      This MCP server is exposed over a NETWORK transport (streamable-http /
      SSE) but was constructed with no authentication: no `auth=` and no
      `token_verifier=`. Its tools are reachable by anyone who can reach the
      port (CWE-306). A Knostic scan found none of ~2,000 internet-exposed MCP
      servers required auth; unauthenticated `/mcp` endpoints are the surface
      behind CVE-2026-66012 and the Q2-2026 MCP exposure wave.

      Require auth before serving over the network:
        mcp = FastMCP("name", token_verifier=verifier,
                      auth=AuthSettings(issuer_url=..., resource_server_url=..., required_scopes=[...]))
      (A `stdio` transport is local and out of scope for this rule.)
    metadata:
      oauthlint-rule-id: AUTH-PY-MCP-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-mcp-unauthenticated-server
      category: security
      cwe: CWE-306
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - https://healthsystemcio.com/2026/07/28/mcp-server-exposure-health-isac/
      technology:
        - mcp
        - fastmcp
        - modelcontextprotocol
    patterns:
      - pattern-either:
          - pattern: $M.run(transport="streamable-http")
          - pattern: $M.run(transport="sse")
          - pattern: $M.streamable_http_app()
          - pattern: $M.sse_app()
      - pattern-either:
          - pattern-inside: |
              $M = FastMCP(...)
              ...
          - pattern-inside: |
              $M = MCPServer(...)
              ...
      - pattern-not-inside: |
          $M = $CTOR(..., auth=$A, ...)
          ...
      - pattern-not-inside: |
          $M = $CTOR(..., token_verifier=$V, ...)
          ...
  - id: auth.py.oauth.hardcoded-client-secret
    languages:
      - python
    severity: ERROR
    message: |
      An OAuth client secret is passed as a string literal to the OAuth client.
      Committed to source control it is one search away from compromise, letting
      an attacker impersonate your application at the authorization server and
      exchange codes for tokens (CWE-798). AI-generated OAuth snippets inline the
      secret to make the example run.

      Read it from the environment or a secret store instead, e.g.
      `client_secret=os.environ["OAUTH_CLIENT_SECRET"]`.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-006
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-hardcoded-client-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://docs.authlib.org/en/latest/client/oauth2.html
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - authlib
        - requests-oauthlib
    pattern-either:
      - pattern: OAuth2Session($ID, "...", ...)
      - pattern: authlib.integrations.requests_client.OAuth2Session($ID, "...", ...)
      - pattern: OAuth2Session(..., client_secret="...", ...)
      - pattern: WebApplicationClient(..., client_secret="...", ...)
      - pattern: BackendApplicationClient(..., client_secret="...", ...)
      - pattern: $OAUTH.register(..., client_secret="...", ...)
    paths:
      exclude:
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/conftest.py"
  - id: auth.py.oauth.insecure-token-endpoint
    languages:
      - python
    severity: ERROR
    message: |
      An OAuth/OIDC endpoint is being contacted over cleartext `http://`.
      Authorization codes, `client_secret`, access/refresh tokens, and the
      `code_verifier` then travel unencrypted: a network attacker can read
      or rewrite them and take over the flow.

      RFC 6749 §3.1 / §10.9 require TLS for the authorization and token
      endpoints. Use `https://` for every authorize, token, userinfo, and
      `.well-known` discovery URL. `http://localhost` and loopback addresses
      are fine for local development and are not flagged.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-insecure-token-endpoint
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.9
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauth2
        - oidc
    patterns:
      - pattern-regex: "['\"]http://[^'\"\\s]+(?:response_type=|client_id=|client_secret=|grant_type=|code_challenge=|/oauth2?/|/connect/token|/o/oauth2|/authorize|/oauth/token|/\\.well-known/)[^'\"]*['\"]"
      - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
  - id: auth.py.oauth.insecure-transport-env
    languages:
      - python
    severity: ERROR
    message: |
      `OAUTHLIB_INSECURE_TRANSPORT` is set, disabling oauthlib's HTTPS
      requirement for OAuth flows. This affects `requests-oauthlib`, Authlib's
      requests integration, and Django OAuth Toolkit. oauthlib raises
      `InsecureTransportError` to stop you exchanging codes and tokens over
      cleartext; setting this variable silences that guard, so authorization
      codes, `client_secret`, and access/refresh tokens travel over plain
      `http://` where a network attacker can read or rewrite them (CWE-319).

      Remove this assignment and serve every OAuth endpoint over `https://`.
      For local development use a loopback HTTPS listener or a tunnel rather
      than disabling transport security in code that can ship to production.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-insecure-transport-env
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://requests-oauthlib.readthedocs.io/en/latest/oauth2_workflow.html
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauthlib
        - requests-oauthlib
        - authlib
    pattern-either:
      - pattern: os.environ["OAUTHLIB_INSECURE_TRANSPORT"] = ...
      - pattern: os.environ.setdefault("OAUTHLIB_INSECURE_TRANSPORT", ...)
      - pattern: os.putenv("OAUTHLIB_INSECURE_TRANSPORT", ...)
      - pattern: environ["OAUTHLIB_INSECURE_TRANSPORT"] = ...
      - pattern: environ.setdefault("OAUTHLIB_INSECURE_TRANSPORT", ...)
  - id: auth.py.oauth.ropc-grant
    languages:
      - python
    severity: ERROR
    message: |
      OAuth token request uses the Resource Owner Password Credentials
      grant (`grant_type=password`). The app collects the user's password
      and replays it to the authorization server, exactly what OAuth was
      designed to avoid. It cannot support federation, MFA, or step-up
      auth, and any compromise of your service exposes raw user passwords.

      The OAuth 2.0 Security BCP (RFC 9700 §2.4) forbids ROPC and OAuth 2.1
      removes it entirely. Use the authorization-code flow with PKCE
      (`grant_type=authorization_code`) for user login, or
      `client_credentials` for machine-to-machine. In Python this covers a
      `requests`/`httpx`/`urllib` body, an OAuth client call, or a
      URL-encoded body string.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-ropc-grant
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
        - https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1#section-2.4
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - oauth2
        - requests
    pattern-either:
      - pattern-regex: "['\"]grant_type['\"]\\s*:\\s*['\"]password['\"]"
      - pattern-regex: "[(,]\\s*grant_type\\s*=\\s*['\"]password['\"]"
      - pattern-regex: "[?&'\"]grant_type=password(?:[&'\"\\s]|$)"
      - pattern-regex: "['\"]grant_type['\"]\\s*,\\s*['\"]password['\"]"
  - id: auth.py.oauth.static-state
    languages:
      - python
    severity: WARNING
    message: |
      OAuth authorization request sends a hardcoded, constant `state`
      value. A static `state` provides ZERO CSRF protection: the whole
      point is an unguessable, per-request value that you store and then
      compare on the callback. A literal that ships in your source is known
      to everyone and identical on every request, so an attacker can forge
      a matching callback.

      Generate `state` fresh per request from a CSPRNG
      (`secrets.token_urlsafe(32)`), persist it in the session, and verify
      it when the provider redirects back.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-static-state
      category: security
      cwe: CWE-330
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - oauth2
    pattern-either:
      - patterns:
          - pattern: '{..., "response_type": ..., ...}'
          - pattern-either:
              - pattern: '{..., "state": "$S", ...}'
      - patterns:
          - pattern-regex: "['\"]https?://[^'\"\\s]+\\?[^'\"]*response_type=[^'\"]*['\"]"
          - pattern-regex: "['\"]https?://[^'\"\\s]+\\?[^'\"]*state=[A-Za-z0-9._~%-]+[^'\"]*['\"]"
  - id: auth.py.oauth.token-request-verify-disabled
    languages:
      - python
    severity: ERROR
    message: |
      An OAuth client fetches or refreshes a token with TLS certificate
      verification disabled (`verify=False`). The token request carries the
      `client_secret`, the authorization `code`, and the issued access/refresh
      tokens; with verification off, an attacker who can intercept the
      connection presents any certificate and reads or tampers with them, a
      classic man-in-the-middle on the most sensitive call in the flow
      (CWE-295).

      Never pass `verify=False` to `fetch_token` / `refresh_token` /
      `fetch_access_token` (Authlib, requests-oauthlib). Leave verification on
      (the default) so the system CA bundle is used, or point `verify` at a CA
      bundle path for a private CA.
    metadata:
      oauthlint-rule-id: AUTH-PY-OAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/py-oauth-token-request-verify-disabled
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.authlib.org/en/latest/client/oauth2.html
        - https://requests.readthedocs.io/en/latest/user/advanced/#ssl-cert-verification
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - authlib
        - requests-oauthlib
    patterns:
      - pattern-either:
          - pattern: $C.fetch_token(..., verify=$V, ...)
          - pattern: $C.refresh_token(..., verify=$V, ...)
          - pattern: $C.fetch_access_token(..., verify=$V, ...)
      - metavariable-regex:
          metavariable: $V
          regex: ^False$
      - focus-metavariable: $V
    fix: "True"
  - id: auth.py.secret.django-hardcoded-key
    languages:
      - python
    severity: ERROR
    message: |
      The Django `SECRET_KEY` is set to a hard-coded string literal in
      settings. This is typically the auto-generated `django-insecure-...`
      value committed by mistake. `SECRET_KEY` signs sessions, CSRF tokens
      and password-reset tokens. Anyone who reads the source or a leaked
      repo can forge them and bypass authentication entirely (CWE-798).

      Load it from the environment or a secret manager instead, e.g.
      `SECRET_KEY = os.environ["SECRET_KEY"]`, `django-environ`
      (`env("SECRET_KEY")`), or `config("SECRET_KEY")`. Generate the value
      with a CSPRNG and never commit it.
    metadata:
      oauthlint-rule-id: AUTH-PY-SECRET-002
      oauthlint-doc-url: https://oauthlint.dev/rules/py-secret-django-hardcoded-key
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://docs.djangoproject.com/en/stable/ref/settings/#secret-key
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - django
    pattern: SECRET_KEY = "..."
  - id: auth.py.secret.flask-hardcoded-key
    languages:
      - python
    severity: ERROR
    message: |
      The Flask `SECRET_KEY` (used to sign session cookies and CSRF tokens) is
      set to a hard-coded string literal. Anyone who reads the source (or a
      leaked repo) can forge session cookies and impersonate any user, a
      complete authentication bypass (CWE-798).

      Load the secret from the environment or a secret manager instead, e.g.
      `app.secret_key = os.environ["SECRET_KEY"]`, and generate it with a CSPRNG
      such as `secrets.token_hex(32)` / `os.urandom(32)`. Never commit the value.
    metadata:
      oauthlint-rule-id: AUTH-PY-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/py-secret-flask-hardcoded-key
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://flask.palletsprojects.com/en/stable/config/#SECRET_KEY
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - flask
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - pattern: $APP.config.update(..., SECRET_KEY="...", ...)
  - id: auth.ruby.cookie.insecure-session-store
    languages:
      - ruby
    severity: WARNING
    message: |
      The Rails cookie session store is configured with `secure: false` or
      `httponly: false`. `secure: false` lets the session cookie ride over
      plaintext HTTP where a network attacker can capture it; `httponly: false`
      exposes it to `document.cookie`, so any XSS turns into full session theft
      (CWE-614). LLM-generated configs flip these off to make sessions work over
      local HTTP and never restore them.

      Drop these overrides. Rails already defaults `httponly` to true, and gate
      `secure` on the environment instead of disabling it, e.g.
      `session_store :cookie_store, secure: Rails.env.production?`. Never hard-
      code `secure: false` / `httponly: false` in code that reaches production.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-cookie-insecure-session-store
      category: security
      cwe: CWE-614
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://guides.rubyonrails.org/security.html#session-storage
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - rails
    pattern-either:
      - pattern: "session_store :cookie_store, ..., secure: false, ..."
      - pattern: "session_store :cookie_store, ..., httponly: false, ..."
      - pattern: "$APP.session_store :cookie_store, ..., secure: false, ..."
      - pattern: "$APP.session_store :cookie_store, ..., httponly: false, ..."
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.cors.wildcard-origin-with-credentials
    languages:
      - ruby
    severity: WARNING
    message: |
      A rack-cors `allow` block combines `origins '*'` with
      `credentials: true`. That instructs browsers to send cookies and
      Authorization headers to a resource that trusts EVERY origin, which is
      exactly the combination the CORS spec forbids and a CSRF/data-theft
      primitive (CWE-942). LLM-generated CORS setups routinely pair a wildcard
      origin with credentials to make cross-site auth "just work".

      Decide what the endpoint actually needs:
       - Public, no cookies/auth cross-site -> `origins '*'` with no
         `credentials: true` (the default).
       - Authenticated for a known frontend -> enumerate the exact origins,
         e.g. `origins 'https://app.example.com'`, and keep `credentials: true`.

      Never combine a wildcard origin with credentials enabled.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-cors-wildcard-origin-with-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/cyu/rack-cors#origin
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
      technology:
        - rack-cors
    patterns:
      - pattern: "resource ..., credentials: true, ..."
      - pattern-either:
          - pattern-inside: |
              allow do
                ...
                origins '*'
                ...
              end
          - pattern-inside: |
              allow do
                ...
                origins "*"
                ...
              end
  - id: auth.ruby.jwt.algorithm-none
    languages:
      - ruby
    severity: ERROR
    message: |
      A JWT is encoded or decoded with the `none` algorithm, which produces (and
      accepts) unsigned tokens. Anyone can craft a token with any claims and it
      will be trusted, because there is no signature to verify (CWE-347). This
      shows up in AI-generated "quick token" and debugging code that then ships.

      Sign with a real algorithm and a key from configuration:
        JWT.encode(payload, ENV.fetch('JWT_SECRET'), 'HS256')
        JWT.decode(token, key, true, { algorithm: 'HS256' })
    metadata:
      oauthlint-rule-id: AUTH-RUBY-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-jwt-algorithm-none
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://github.com/jwt/ruby-jwt
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - ruby-jwt
    patterns:
      - pattern-either:
          - patterns:
              - pattern: JWT.encode($P, $K, $ALG)
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["']?none["']?$
          - patterns:
              - pattern: "JWT.decode($T, $K, $V, algorithm: $ALG)"
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["']?none["']?$
          - patterns:
              - pattern: "JWT.decode($T, $K, $V, {algorithm: $ALG})"
              - metavariable-regex:
                  metavariable: $ALG
                  regex: (?i)^["']?none["']?$
          - pattern-regex: (?i)JWT\.decode\([^)]*algorithms:\s*\[[^\]]*["']none["']
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.jwt.decode-verify-disabled
    languages:
      - ruby
    severity: ERROR
    message: |
      `JWT.decode` is called with its third positional argument set to `false`,
      which disables signature verification entirely. The library will happily
      return the claims of any token, including one an attacker forged, so any
      authorization decision made on the decoded `sub` / `role` / `scope` is
      trivially bypassed (CWE-347). This is a common AI-generated mistake: the
      assistant "just wants the payload" and turns verification off to make the
      call succeed.

      Verify the signature and pin the algorithm instead:
        JWT.decode(token, key, true, { algorithm: 'HS256' })
      For asymmetric tokens pass the public key and an `algorithms:` allow-list.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-jwt-decode-verify-disabled
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/jwt/ruby-jwt
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - ruby-jwt
    patterns:
      - pattern-either:
          - pattern: JWT.decode($T, $K, false)
          - pattern: JWT.decode($T, $K, false, ...)
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.jwt.missing-algorithm-allowlist
    languages:
      - ruby
    severity: WARNING
    message: |
      `JWT.decode` is called with verification enabled (`true`) but no
      `algorithm:` / `algorithms:` option, so the library trusts whatever `alg`
      the token header names. An attacker can switch the algorithm, e.g. present
      an `HS256` token signed with your RSA *public* key as if it were the HMAC
      secret, and the signature check passes (algorithm-confusion, CWE-347).

      Always pin the accepted algorithm(s):
        JWT.decode(token, key, true, { algorithm: 'HS256' })
        JWT.decode(token, public_key, true, { algorithms: ['RS256'] })
      ruby-jwt's own docs mark this allow-list as mandatory for safe decoding.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-jwt-missing-algorithm-allowlist
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/jwt/ruby-jwt
        - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
      technology:
        - ruby-jwt
    patterns:
      - pattern: JWT.decode($T, $K, true)
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.oauth.doorkeeper-insecure-config
    languages:
      - ruby
    severity: WARNING
    message: |
      A Doorkeeper (OAuth provider) initializer weakens a core protection:
      `force_ssl_in_redirect_uri false` allows plaintext `http://` redirect
      URIs (authorization codes/tokens travel in cleartext and are open to
      interception/redirect tampering, CWE-601); `allow_blank_redirect_uri
      true` accepts clients with no registered redirect URI; and an
      unconditional `skip_authorization do true end` auto-approves EVERY client
      with no user consent. These are frequent LLM shortcuts to get a local
      OAuth flow working.

      Keep `force_ssl_in_redirect_uri` on (default) so redirect URIs must be
      HTTPS, require every client to register a redirect URI, and make
      `skip_authorization` conditional on a trusted first-party client rather
      than returning a bare `true`, e.g.
      `skip_authorization { |resource_owner, client| client.application.trusted? }`.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-oauth-doorkeeper-insecure-config
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://doorkeeper.gitbook.io/guides/ruby-on-rails/skip-authorization
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - doorkeeper
    pattern-either:
      - pattern: force_ssl_in_redirect_uri false
      - pattern: allow_blank_redirect_uri true
      - patterns:
          - pattern: |
              skip_authorization do
                true
              end
          - pattern-not: |
              skip_authorization do |$A, $B|
                ...
              end
  - id: auth.ruby.oauth.omniauth-allows-get
    languages:
      - ruby
    severity: WARNING
    message: |
      OmniAuth is configured to accept GET requests on the request phase
      (`allowed_request_methods` includes `:get`, or `silence_get_warning`
      is set to `true`). A GET auth-initiation URL can be triggered by any
      cross-site `<img>`/link, which lets an attacker start a login/account-
      link flow without the user's intent, a CSRF vector OmniAuth explicitly
      warns about (CWE-352). LLM-generated fixes often add `:get` (or silence
      the warning) to make a plain link work.

      Keep the request phase POST-only: `OmniAuth.config.allowed_request_methods
      = [:post]`, and initiate login with a real form/button that POSTs to
      `/auth/:provider` (or use the request-forgery-protection middleware).
      Do not silence the GET warning.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-oauth-omniauth-allows-get
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://github.com/omniauth/omniauth/wiki/Resolving-CVE-2015-9284
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - omniauth
    pattern-either:
      - pattern: OmniAuth.config.allowed_request_methods = [..., :get, ...]
      - pattern: OmniAuth.config.silence_get_warning = true
  - id: auth.ruby.oauth.omniauth-ignores-state
    languages:
      - ruby
    severity: ERROR
    message: |
      An OmniAuth provider is configured with `provider_ignores_state: true`,
      which disables verification of the OAuth `state` parameter on the
      callback. `state` is the OAuth CSRF defence: without it, an attacker can
      splice their own authorization code/response into a victim's session and
      complete a login/link they did not initiate (CWE-352). This flag exists
      only as an escape hatch and is a common LLM "fix" for state-mismatch
      errors caused by a broken session store.

      Remove `provider_ignores_state: true` and fix the real cause (usually a
      session that is not shared between the request and callback phases, e.g.
      a cookie store misconfiguration or a load balancer without sticky
      sessions). Let OmniAuth validate `state` on every callback.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-oauth-omniauth-ignores-state
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://github.com/omniauth/omniauth/wiki/Resolving-CVE-2015-9284
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
      technology:
        - omniauth
    pattern-either:
      - pattern: "provider ..., provider_ignores_state: true, ..."
      - pattern: "{ ..., provider_ignores_state: true, ... }"
      - pattern: "{ ..., 'provider_ignores_state' => true, ... }"
      - pattern: '{ ..., "provider_ignores_state" => true, ... }'
  - id: auth.ruby.secret.hardcoded-jwt-secret
    languages:
      - ruby
    severity: ERROR
    message: |
      The HMAC key passed to `JWT.encode` / `JWT.decode` is a hard-coded string
      literal. This key signs and verifies every token: committed to source
      control it is one search away from compromise, letting an attacker forge a
      token for any user or role (CWE-798). AI-generated samples inline the
      secret to make the snippet "just work" and it ships unchanged.

      Read the key from the environment or Rails credentials instead:
        JWT.encode(payload, ENV.fetch('JWT_SECRET'), 'HS256')
        JWT.decode(token, Rails.application.credentials.jwt_secret, true, { algorithm: 'HS256' })
    metadata:
      oauthlint-rule-id: AUTH-RUBY-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-secret-hardcoded-jwt-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/jwt/ruby-jwt
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - ruby-jwt
    patterns:
      - pattern-either:
          - pattern: JWT.encode($P, $K, $ALG)
          - pattern: JWT.decode($T, $K, $V)
          - pattern: JWT.decode($T, $K, $V, ...)
      - metavariable-regex:
          metavariable: $K
          regex: ^["'][^"']{5,}["']$
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.secret.hardcoded-secret-key-base
    languages:
      - ruby
    severity: ERROR
    message: |
      A Rails `secret_key_base` / `secret_key` is assigned a hard-coded string
      literal. This value keys the whole application's signed/encrypted cookies
      (including the session cookie) and message verifiers: committed to source
      control it is one search away from letting an attacker forge session
      cookies and impersonate any user (CWE-798). Inlining a literal secret to
      make an app "just run" is a classic LLM-generated mistake.

      Never assign the secret in code. Store it in `Rails.application.credentials`
      (encrypted) or read it from the environment, e.g.
      `ENV.fetch("SECRET_KEY_BASE")`, and rotate the leaked value out of source
      control and git history.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-SECRET-002
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-secret-hardcoded-secret-key-base
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: MEDIUM
      references:
        - https://guides.rubyonrails.org/security.html#custom-credentials
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - rails
    patterns:
      - pattern-either:
          - pattern: $X.secret_key_base = $V
          - pattern: $X.secret_key = $V
      - metavariable-regex:
          metavariable: $V
          regex: (?s)^["'].{8,}["']$
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.ruby.session.skip-verify-authenticity-token
    languages:
      - ruby
    severity: WARNING
    message: |
      A Rails controller disables CSRF protection with
      `skip_before_action :verify_authenticity_token`. This turns off the
      authenticity-token check for the actions it covers, so a malicious page
      can drive a logged-in user's browser into submitting state-changing
      requests (CWE-352). LLM-generated controllers reach for this line to
      "fix" a 422 InvalidAuthenticityToken error instead of sending the token.

      If the controller serves browser forms, keep CSRF on and send the token.
      If it is a genuine token-authenticated API or webhook endpoint (no cookie
      session), that is legitimate, but prove the request some other way:
      verify a signature/HMAC or a bearer token on every action, and scope this
      skip narrowly with `only:` rather than across the whole controller.
    metadata:
      oauthlint-rule-id: AUTH-RUBY-SESSION-001
      oauthlint-doc-url: https://oauthlint.dev/rules/ruby-session-skip-verify-authenticity-token
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://guides.rubyonrails.org/security.html#cross-site-request-forgery-csrf
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - rails
    pattern-either:
      - pattern: skip_before_action :verify_authenticity_token
      - pattern: skip_before_action :verify_authenticity_token, ...
    paths:
      exclude:
        - "**/spec/**"
        - "**/test/**"
        - "**/*_spec.rb"
        - "**/*_test.rb"
        - "**/features/**"
  - id: auth.rust.cookie.insecure
    languages:
      - rust
    severity: ERROR
    message: |
      A session/auth cookie is built with a security attribute explicitly
      disabled (`secure(false)` or `http_only(false)`). With `secure(false)`
      the cookie is sent over plain HTTP, so a network attacker can read the
      session token. With `http_only(false)` the cookie is readable from
      JavaScript, so any XSS can steal it. For OAuth/OIDC this exposes session
      and token cookies to theft and hijacking.

      Set `secure(true)` and `http_only(true)` on auth cookies, and add an
      appropriate `SameSite` mode (for example
      `same_site(SameSite::Lax)`).
    metadata:
      oauthlint-rule-id: AUTH-RUST-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://docs.rs/cookie/latest/cookie/struct.CookieBuilder.html
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - cookie
    patterns:
      - pattern-either:
          - pattern: $C.secure(false)
          - pattern: $C.http_only(false)
  - id: auth.rust.cors.permissive
    languages:
      - rust
    severity: ERROR
    message: |
      A wide-open CORS policy is configured. `Cors::permissive()` (actix-web),
      `CorsLayer::permissive()` / `CorsLayer::very_permissive()` (tower-http),
      and `CorsLayer::new().allow_origin(Any)` all allow requests from any
      origin. Combined with credentialed requests this lets any website read
      authenticated responses, including OAuth/OIDC tokens, session data, and
      user info exposed by your API.

      Restrict CORS to an explicit allowlist of trusted origins instead, e.g.
      `allow_origin("https://app.example.com".parse().unwrap())` or
      `allow_origin(["https://app.example.com".parse().unwrap()])`.
    metadata:
      oauthlint-rule-id: AUTH-RUST-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-cors-permissive
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/actix-cors/latest/actix_cors/struct.Cors.html#method.permissive
        - https://docs.rs/tower-http/latest/tower_http/cors/struct.CorsLayer.html
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - actix-web
        - tower-http
    patterns:
      - pattern-either:
          - pattern: Cors::permissive()
          - pattern: CorsLayer::permissive()
          - pattern: CorsLayer::very_permissive()
          - pattern: $B.allow_origin(Any)
  - id: auth.rust.crypto.bcrypt-low-cost
    languages:
      - rust
    severity: WARNING
    message: |
      `bcrypt::hash` (or `bcrypt::hash_with_result`) is called with a cost
      factor below 10. A low work factor makes each hash cheap to compute,
      which lets an attacker brute-force stolen password hashes far too
      quickly. OWASP recommends a bcrypt cost of at least 10, and ≥ 12 for new
      applications, tuned so a single hash takes roughly 250ms on your
      hardware.

      Common LLM-generated mistake: `bcrypt::hash(password, 8)` because the
      literal "looks fast enough". Use `bcrypt::DEFAULT_COST` (12) or raise the
      cost factor to 12 or higher.
    metadata:
      oauthlint-rule-id: AUTH-RUST-CRYPTO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-crypto-bcrypt-low-cost
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/bcrypt/latest/bcrypt/fn.hash.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/916.html
      technology:
        - bcrypt
    patterns:
      - pattern-either:
          - pattern: bcrypt::hash($PW, $N)
          - pattern: bcrypt::hash_with_result($PW, $N)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10
  - id: auth.rust.crypto.weak-cipher
    languages:
      - rust
    severity: ERROR
    message: |
      A broken or deprecated cipher from the RustCrypto ecosystem is used to
      protect data. DES (`Des::new`, crate `des`) and 3DES (`TdesEde3::new` /
      `TdesEde2::new`) have a 64-bit block and are considered insecure
      (Sweet32, brute-force), while RC4 (`Rc4::new`, crate `rc4`) has
      well-known keystream biases and is forbidden by RFC 7465. For OAuth/OIDC
      this means tokens, client secrets, and other sensitive material are not
      adequately protected and may be recovered by an attacker.

      Use an authenticated AEAD cipher instead: AES-GCM via the `aes-gcm`
      crate (`Aes256Gcm::new(key)`) or ChaCha20-Poly1305
      (`ChaCha20Poly1305::new(key)`), both of which provide confidentiality
      and integrity.
    metadata:
      oauthlint-rule-id: AUTH-RUST-CRYPTO-003
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-crypto-weak-cipher
      category: security
      cwe: CWE-327
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://docs.rs/aes-gcm/latest/aes_gcm/
        - https://datatracker.ietf.org/doc/html/rfc7465
      technology:
        - des
        - rc4
    patterns:
      - pattern-either:
          - pattern: Des::new(...)
          - pattern: TdesEde3::new(...)
          - pattern: TdesEde2::new(...)
          - pattern: Rc4::new(...)
  - id: auth.rust.crypto.weak-password-hash
    languages:
      - rust
    severity: ERROR
    message: |
      A password is hashed with a fast, general-purpose digest unsuitable for
      password storage. The digest is MD5 (via the `md5` crate) or
      SHA-1/SHA-256/SHA-512 (via the RustCrypto `sha1`/`sha2` crates). These
      algorithms are designed to be fast, which makes offline brute-force and
      rainbow-table attacks cheap; they are NOT suitable for storing passwords
      (CWE-916).

      Use a dedicated, slow password-hashing function with a per-password salt
      and a tunable work factor: Argon2 (`argon2` crate,
      `Argon2::default().hash_password(...)`), bcrypt (`bcrypt::hash(...)`), or
      scrypt (`scrypt` crate). These resist brute-force by design.
    metadata:
      oauthlint-rule-id: AUTH-RUST-CRYPTO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-crypto-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/916.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://docs.rs/argon2/latest/argon2/
      technology:
        - sha2
        - md5
    patterns:
      - pattern-either:
          - pattern: md5::compute($PW)
          - pattern: Md5::digest($PW)
          - pattern: Sha1::digest($PW)
          - pattern: Sha256::digest($PW)
          - pattern: Sha512::digest($PW)
          - pattern: $H.update($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd).*
  - id: auth.rust.flow.ssrf
    languages:
      - rust
    severity: ERROR
    message: |
      Untrusted request input flows into the URL of an outbound HTTP request.
      Because the destination is attacker-controlled, this is a Server-Side
      Request Forgery (CWE-918): an attacker can point the request at internal
      services behind your firewall, or at the cloud metadata endpoint
      (http://169.254.169.254/...) to steal IAM/instance credentials and pivot
      deeper into your infrastructure.

      Never pass a request-derived `String` (an axum/actix handler parameter, or
      a value taken from request input) straight into `reqwest::get(...)` or a
      `Client::get(...)` / `Client::post(...).send()`. Validate the destination
      host against an explicit allow-list (parse the URL and check the resolved
      host/scheme, rejecting private/loopback/link-local ranges) before issuing
      the request.
    metadata:
      oauthlint-rule-id: AUTH-RUST-FLOW-002
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-flow-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - reqwest
        - axum
        - actix-web
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "fn $F(..., $P: String, ...) {...}"
              - pattern: "fn $F(..., $P: Query<$T>, ...) {...}"
              - pattern: "fn $F(..., $P: Path<$T>, ...) {...}"
              - pattern: "fn $F(..., Query($P): Query<$T>, ...) {...}"
              - pattern: "fn $F(..., Path($P): Path<$T>, ...) {...}"
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: reqwest::get($URL)
              - pattern: reqwest::blocking::get($URL)
              - pattern: $C.get($URL).send()
              - pattern: $C.post($URL).send()
              - pattern: $C.put($URL).send()
              - pattern: $C.delete($URL).send()
              - pattern: $C.head($URL).send()
              - pattern: $C.request($M, $URL).send()
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if is_allowed_url(<... $V ...>) {
                  ...
              }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if validate_host(<... $V ...>) {
                  ...
              }
      - patterns:
          - pattern: $V
          - pattern-inside: |
              if $ALLOW.contains(<... $V ...>) {
                  ...
              }
  - id: auth.rust.flow.timing-unsafe-compare
    languages:
      - rust
    severity: WARNING
    message: |
      A secret-shaped value (`password`, `token`, `secret`, `apikey`,
      `hmac`, `signature`, `mac`, `digest`) is being compared with `==` /
      `!=`. Rust's `PartialEq` for slices and strings short-circuits on the
      first differing byte, so the comparison time leaks the length of the
      matching prefix, a classic timing-attack vector (CWE-208).

      Use a constant-time comparison instead: `subtle::ConstantTimeEq`
      (`a.ct_eq(b).into()`) or the `constant_time_eq` crate
      (`constant_time_eq(a, b)`). For password verification, use a verifier
      that compares in constant time for you (`argon2::Argon2::verify_password`,
      `bcrypt::verify`, `scrypt`).
    metadata:
      oauthlint-rule-id: AUTH-RUST-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-flow-timing-unsafe-compare
      category: security
      cwe: CWE-208
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/208.html
        - https://docs.rs/subtle/latest/subtle/
        - https://docs.rs/constant_time_eq/latest/constant_time_eq/
      technology:
        - std
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $A == $B
              - pattern: $A != $B
          - metavariable-regex:
              metavariable: $A
              regex: (?i)^.*(password|passwd|secret|token|apikey|api_key|hmac|signature|mac|digest)$
          - pattern-not: $X == "..."
          - pattern-not: $X != "..."
          - pattern-not: '"..." == $X'
          - pattern-not: '"..." != $X'
          - pattern-not: $X == None
          - pattern-not: $X != None
          - pattern-not: None == $X
          - pattern-not: None != $X
          - pattern-not: $X.len() == $N
          - pattern-not: $X.len() != $N
      - patterns:
          - pattern-either:
              - pattern: $A == $B
              - pattern: $A != $B
          - metavariable-regex:
              metavariable: $B
              regex: (?i)^.*(password|passwd|secret|token|apikey|api_key|hmac|signature|mac|digest)$
          - pattern-not: $X == "..."
          - pattern-not: $X != "..."
          - pattern-not: '"..." == $X'
          - pattern-not: '"..." != $X'
          - pattern-not: $X == None
          - pattern-not: $X != None
          - pattern-not: None == $X
          - pattern-not: None != $X
          - pattern-not: $X.len() == $N
          - pattern-not: $X.len() != $N
  - id: auth.rust.jwt.algorithm-confusion
    languages:
      - rust
    severity: ERROR
    message: |
      A `jsonwebtoken` `Validation` accepts both HMAC and asymmetric algorithms,
      enabling algorithm confusion. The accepted-algorithm list MIXES an HMAC
      family (`Algorithm::HS256`/`HS384`/`HS512`) with an asymmetric family
      (`Algorithm::RS*`/`ES*`/`PS*`). When both families are accepted, an
      attacker takes your RSA/EC PUBLIC key (which is not secret) and signs a
      forged token with HS*, using the public key bytes as the HMAC shared
      secret. `decode` then verifies that forged token as valid, letting the
      attacker mint arbitrary identities and claims.

      Pin `validation.algorithms` to a SINGLE family you actually use, e.g.
      `validation.algorithms = vec![Algorithm::RS256];` when your issuer signs
      with RSA, or `vec![Algorithm::HS256]` for a genuinely symmetric secret.
      Never accept an HMAC algorithm alongside an asymmetric one.

      CWE-327: use of a broken or risky cryptographic algorithm/configuration.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-006
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-algorithm-confusion
      category: security
      cwe: CWE-327
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
      technology:
        - jsonwebtoken
    patterns:
      - pattern-either:
          - pattern: $V.algorithms = $VEC;
          - pattern: $V.set_algorithms($VEC)
      - metavariable-regex:
          metavariable: $VEC
          regex: (?s).*Algorithm::HS(256|384|512)
      - metavariable-regex:
          metavariable: $VEC
          regex: (?s).*Algorithm::(RS|ES|PS)(256|384|512)
  - id: auth.rust.jwt.disable-signature-validation
    languages:
      - rust
    severity: ERROR
    message: |
      `Validation::insecure_disable_signature_validation()` turns off JWT
      signature verification. Once disabled, `decode` accepts any token
      (including ones forged or tampered with by an attacker) because the
      cryptographic signature is never checked. For OAuth/OIDC this lets an
      attacker mint arbitrary access tokens and identities.

      Never disable signature validation. Build the validator with the
      expected algorithm, e.g. `Validation::new(Algorithm::HS256)` (or the
      RS/ES algorithm your issuer uses), and verify the token through
      `decode::<Claims>(token, &key, &validation)`.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-disable-signature-validation
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.Validation.html#method.insecure_disable_signature_validation
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - jsonwebtoken
    pattern: $V.insecure_disable_signature_validation()
  - id: auth.rust.jwt.hardcoded-secret
    languages:
      - rust
    severity: ERROR
    message: |
      A JWT HMAC signing/verification key is hardcoded as a literal. It is
      passed directly to jsonwebtoken's `EncodingKey::from_secret` /
      `DecodingKey::from_secret`. Anyone who can read the source or git history
      can forge or tamper with tokens, which is a complete authentication
      bypass.

      Load the secret at runtime from the environment or a secret manager
      instead, e.g. `let key = std::env::var("JWT_SECRET")?;` followed by
      `EncodingKey::from_secret(key.as_bytes())`. Never commit signing keys to
      source control.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.EncodingKey.html#method.from_secret
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - jsonwebtoken
    pattern-either:
      - pattern: jsonwebtoken::EncodingKey::from_secret(b"...")
      - pattern: jsonwebtoken::DecodingKey::from_secret(b"...")
      - pattern: EncodingKey::from_secret(b"...")
      - pattern: DecodingKey::from_secret(b"...")
      - pattern: EncodingKey::from_secret("...".as_ref())
      - pattern: DecodingKey::from_secret("...".as_ref())
      - pattern: EncodingKey::from_secret("...".as_bytes())
      - pattern: DecodingKey::from_secret("...".as_bytes())
  - id: auth.rust.jwt.no-aud-validation
    languages:
      - rust
    severity: WARNING
    message: |
      JWT audience (`aud`) validation is disabled by setting
      `validate_aud: false` on the `jsonwebtoken` `Validation`. With the
      audience check turned off, a token minted for a different service is
      accepted by `decode`, so an attacker can replay a token issued for
      another audience against this API.

      Keep `validate_aud` at its default `true` and declare the audience you
      expect via `validation.set_audience(&["my-api"])`, so only tokens whose
      `aud` claim matches your service are accepted.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-no-aud-validation
      category: security
      cwe: CWE-287
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.Validation.html#structfield.validate_aud
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - jsonwebtoken
    pattern: $V.validate_aud = false
  - id: auth.rust.jwt.no-expiration-validation
    languages:
      - rust
    severity: ERROR
    message: |
      JWT expiration validation is turned off by setting `validate_exp: false`
      on the `jsonwebtoken` `Validation`. With `exp` checking disabled, `decode`
      accepts tokens that have already expired, so a leaked or stolen access
      token stays usable forever. For OAuth/OIDC this defeats token lifetimes
      and revocation-by-expiry, letting an attacker replay old tokens.

      Leave `validate_exp` at its default `true` so expired tokens are
      rejected. Build the validator with `Validation::new(Algorithm::HS256)`
      (or your issuer's algorithm) and do not turn off `validate_exp`.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-no-expiration-validation
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.Validation.html#structfield.validate_exp
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - jsonwebtoken
    pattern: $V.validate_exp = false
  - id: auth.rust.jwt.no-issuer-validation
    languages:
      - rust
    severity: WARNING
    message: |
      A JWT is decoded with a `jsonwebtoken` `Validation` that never sets the expected issuer.
      Because the issuer is not pinned, `decode` accepts a token minted by ANY
      issuer: the `jsonwebtoken` crate does not validate the `iss` claim unless
      you opt in, so a token signed by an attacker-controlled or otherwise
      untrusted issuer passes validation as long as the signature checks out.
      For OAuth/OIDC this lets a token from the wrong authorization server be
      replayed against this API.

      Pin the issuer before decoding, e.g.
      `validation.set_issuer(&["https://issuer.example.com"])` (or set
      `validation.iss`), so only tokens whose `iss` claim matches your trusted
      authorization server are accepted.
    metadata:
      oauthlint-rule-id: AUTH-RUST-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-jwt-no-issuer-validation
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.Validation.html#method.set_issuer
        - https://cwe.mitre.org/data/definitions/345.html
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - jsonwebtoken
    patterns:
      - pattern-either:
          - pattern: let mut $V = Validation::new(...);
          - pattern: let mut $V = Validation::default();
      - pattern-not-inside: |
          let mut $V = ...;
          ...
          $V.set_issuer(...);
          ...
      - pattern-not-inside: |
          let mut $V = ...;
          ...
          $V.iss = $X;
          ...
      - pattern-inside: |
          let mut $V = ...;
          ...
          decode($TOKEN, $KEY, &$V)
  - id: auth.rust.oauth.hardcoded-client-secret
    languages:
      - rust
    severity: ERROR
    message: |
      An OAuth `client_secret` is hardcoded as a string literal and passed to
      the `oauth2` crate's `ClientSecret::new(...)`. The client secret
      authenticates your application to the authorization server; committed to
      source control it is one `grep`/git-history search away from compromise,
      letting an attacker impersonate your client, mint tokens, and exchange
      authorization codes (CWE-798). AI-generated snippets inline the secret to
      make the sample "just work" and it ships unchanged.

      Load the secret at runtime from the environment or a secret manager:
        let secret = std::env::var("OAUTH_CLIENT_SECRET")?;
        let client = BasicClient::new(client_id)
            .set_client_secret(ClientSecret::new(secret));
      Never commit client secrets to source control.
    metadata:
      oauthlint-rule-id: AUTH-RUST-OAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-oauth-hardcoded-client-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://docs.rs/oauth2/latest/oauth2/struct.ClientSecret.html
        - https://datatracker.ietf.org/doc/html/rfc6749#section-2.3.1
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - oauth2
    pattern-either:
      - pattern: ClientSecret::new("...".to_string())
      - pattern: ClientSecret::new("...".to_owned())
      - pattern: ClientSecret::new("...".into())
      - pattern: ClientSecret::new(String::from("..."))
      - pattern: oauth2::ClientSecret::new("...".to_string())
      - pattern: oauth2::ClientSecret::new("...".to_owned())
      - pattern: oauth2::ClientSecret::new("...".into())
      - pattern: oauth2::ClientSecret::new(String::from("..."))
  - id: auth.rust.oauth.insecure-token-endpoint
    languages:
      - rust
    severity: ERROR
    message: |
      An OAuth/OIDC endpoint is being contacted over cleartext `http://`.
      Authorization codes, `client_secret`, access/refresh tokens, and the
      `code_verifier` then travel unencrypted. A network attacker can read
      or rewrite them and take over the flow.

      RFC 6749 §3.1 / §10.9 require TLS for the authorization and token
      endpoints. Use `https://` for every authorize, token, and userinfo URL
      (including the `oauth2` crate's `AuthUrl` / `TokenUrl`).
      `http://localhost` is fine for local development and is not flagged.
    metadata:
      oauthlint-rule-id: AUTH-RUST-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-oauth-insecure-token-endpoint
      category: security
      cwe: CWE-319
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-3.1
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.9
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - oauth2
        - oidc
    patterns:
      - pattern-regex: '"http://[^"\s]+(?:response_type=|client_id=|client_secret=|grant_type=|code_challenge=|/oauth2?/|/connect/token|/o/oauth2|/authorize|/oauth/token)[^"]*"'
      - pattern-not-regex: http://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
  - id: auth.rust.oauth.ropc-grant
    languages:
      - rust
    severity: ERROR
    message: |
      OAuth token request uses the Resource Owner Password Credentials
      grant (`grant_type=password`). The app collects the user's password
      and replays it to the authorization server, exactly what OAuth was
      designed to avoid. It cannot support federation, MFA, or step-up
      auth, and any compromise of your service exposes raw user passwords.

      The OAuth 2.0 Security BCP (RFC 9700 §2.4) forbids ROPC and OAuth 2.1
      removes it entirely. Use the authorization-code flow with PKCE
      (`grant_type=authorization_code`) for user login, or
      `client_credentials` for machine-to-machine. With the `oauth2` crate,
      use `authorize_url` / `exchange_code` instead of `exchange_password`.
    metadata:
      oauthlint-rule-id: AUTH-RUST-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-oauth-ropc-grant
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
        - https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1#section-2.4
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - oauth2
    pattern-either:
      - pattern: $C.exchange_password(...)
      - pattern-regex: '"grant_type"\s*,\s*"password"'
      - pattern-regex: '[?&"]grant_type=password(?:[&"\s\\]|$)'
    paths:
      exclude:
        - "**/test/**"
        - "**/tests.rs"
        - "**/*_test.*"
        - "**/*.test.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/mock*/**"
        - "**/vendor/**"
        - "**/node_modules/**"
        - "**/target/**"
  - id: auth.rust.oauth.static-state
    languages:
      - rust
    severity: WARNING
    message: |
      OAuth authorization request is built with a hardcoded, constant `state`
      value (`CsrfToken::new("literal")`). A static `state` provides ZERO CSRF
      protection: the whole point is an unguessable, per-request value that
      you store and then compare on the callback. A literal that ships in your
      source is known to everyone and identical on every request, so an
      attacker can forge a matching callback.

      Use `CsrfToken::new_random` (the `oauth2` crate's CSPRNG-backed
      generator), pass it to `authorize_url`, persist it in the session, and
      verify it when the provider redirects back.
    metadata:
      oauthlint-rule-id: AUTH-RUST-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-oauth-static-state
      category: security
      cwe: CWE-330
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.12
        - https://cwe.mitre.org/data/definitions/330.html
      technology:
        - oauth2
    patterns:
      - pattern-either:
          - pattern: CsrfToken::new("...".to_string())
          - pattern: CsrfToken::new("...".to_owned())
          - pattern: CsrfToken::new("...".into())
          - pattern: CsrfToken::new(String::from("..."))
      - pattern-not-inside: mod tests {...}
    paths:
      exclude:
        - "**/test/**"
        - "**/tests.rs"
        - "**/*_test.*"
        - "**/*.test.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/mock*/**"
        - "**/vendor/**"
        - "**/node_modules/**"
        - "**/target/**"
  - id: auth.rust.tls.accept-invalid-certs
    languages:
      - rust
    severity: ERROR
    message: |
      A reqwest client is built with `danger_accept_invalid_certs(true)`, which
      turns off TLS certificate validation. Any attacker who can intercept the
      connection can present any certificate and read or tamper with the
      traffic, a man-in-the-middle hole. For OAuth/OIDC this leaks
      authorization codes, access tokens, and client secrets in transit.

      Never accept invalid certificates. Leave validation on (the default). To
      trust a private CA in development, add it explicitly with
      `ClientBuilder::add_root_certificate(cert)` instead.
    metadata:
      oauthlint-rule-id: AUTH-RUST-TLS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-tls-accept-invalid-certs
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html#method.danger_accept_invalid_certs
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - reqwest
    pattern: $B.danger_accept_invalid_certs(true)
    fix: $B.danger_accept_invalid_certs(false)
  - id: auth.rust.tls.accept-invalid-hostnames
    languages:
      - rust
    severity: ERROR
    message: |
      A reqwest client is built with `danger_accept_invalid_hostnames(true)`,
      which turns off TLS hostname verification. The certificate chain is still
      checked, but a certificate valid for any other domain is accepted for this
      connection, so an attacker holding a valid certificate for a host they
      control can intercept the connection and read or tamper with the traffic,
      a man-in-the-middle hole. For OAuth/OIDC this leaks authorization codes,
      access tokens, and client secrets in transit.

      Never accept invalid hostnames. Leave hostname verification on (the
      default). To trust a private CA in development, add it explicitly with
      `ClientBuilder::add_root_certificate(cert)` instead.
    metadata:
      oauthlint-rule-id: AUTH-RUST-TLS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/rust-tls-accept-invalid-hostnames
      category: security
      cwe: CWE-297
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html#method.danger_accept_invalid_hostnames
        - https://cwe.mitre.org/data/definitions/297.html
      technology:
        - reqwest
    pattern: $B.danger_accept_invalid_hostnames(true)
    fix: $B.danger_accept_invalid_hostnames(false)
  - id: auth.secret.provider-key
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A hard-coded credential matching a well-known provider's key format
      was found in the source. These keys are designed to be revocable.
      Once one ships to git, the only safe action is to rotate it, even
      if the repo is private.

      Move the value to an environment variable, a secret manager (AWS
      Secrets Manager, GCP Secret Manager, Doppler, 1Password CLI),
      or a `.env` file that's `.gitignore`d.

      Detected formats:
        - Stripe live / test:  sk_live_…  / sk_test_…   / pk_live_…
        - OpenAI:              sk-…  /  sk-proj-…
        - Anthropic:           sk-ant-…
        - GitHub:              ghp_… / gho_… / ghu_… / ghs_… / ghr_… / github_pat_…
        - Google Workspace:    GOCSPX-…
        - Google API key:      AIza…
        - AWS Access Key:      AKIA[0-9A-Z]{16}
        - Slack Bot / User:    xoxb-… / xoxp-…
    metadata:
      oauthlint-rule-id: AUTH-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/secret-provider-key
      category: security
      cwe: CWE-798
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://blog.gitguardian.com/the-state-of-secrets-sprawl-2026/
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    pattern-either:
      - pattern-regex: \b(?:sk|pk|rk)_(?:live|test)_[0-9a-zA-Z]{16,}
      - pattern-regex: \bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}
      - pattern-regex: \bgh[opusr]_[A-Za-z0-9]{36,}
      - pattern-regex: \bgithub_pat_[A-Za-z0-9_]{40,}
      - pattern-regex: \bGOCSPX-[A-Za-z0-9_-]{20,}
      - pattern-regex: \bAKIA[0-9A-Z]{16}\b
      - pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b
      - pattern-regex: \bxox[bp]-[0-9]{10,}-[0-9]{10,}-[A-Za-z0-9]{20,}
  - id: auth.secret.public-env-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A secret is being read from an environment variable whose name carries a
      client-public prefix. Bundlers inline these variables into the browser
      JavaScript at build time:

        - Next.js / webpack:        NEXT_PUBLIC_*
        - Create React App:         REACT_APP_*
        - Gatsby:                   GATSBY_*
        - SvelteKit / generic:      PUBLIC_*
        - Vite:                     VITE_*  (via import.meta.env)

      Anything carried by such a variable ships to every visitor. A secret,
      token, password, or private key placed here is published, not protected.

      Keep the secret in a server-only variable (no public prefix) and read it
      only in server code (API routes, server actions, loaders). If a value is
      genuinely safe to expose (publishable key, client_id), name it so.
    metadata:
      oauthlint-rule-id: AUTH-SECRET-002
      oauthlint-doc-url: https://oauthlint.dev/rules/secret-public-env-secret
      category: security
      cwe: CWE-200
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://nextjs.org/docs/app/building-your-application/configuring/environment-variables#bundling-environment-variables-for-the-browser
        - https://vitejs.dev/guide/env-and-mode#env-variables
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
      technology:
        - next.js
        - vite
        - create-react-app
    pattern-either:
      - patterns:
          - pattern: process.env.$VAR
          - metavariable-regex:
              metavariable: $VAR
              regex: ^(NEXT_PUBLIC|REACT_APP|GATSBY|PUBLIC)_.*(SECRET|PRIVATE|PASSWORD).*$
      - patterns:
          - pattern: import.meta.env.$VAR
          - metavariable-regex:
              metavariable: $VAR
              regex: ^VITE_.*(SECRET|PRIVATE|PASSWORD).*$
  - id: auth.session.hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An `express-session` / `cookie-session` `secret` is a hard-coded string
      literal. The infamous `secret: 'keyboard cat'` is the canonical
      AI-generated example. This key signs the session cookie: anyone who
      reads it from your source or git history can forge arbitrary session
      cookies and impersonate any user.

      Load the secret from the environment (`process.env.SESSION_SECRET`) or a
      secret manager, and rotate it out of source control. Add a placeholder
      to `.env.example` so contributors know it is required.
    metadata:
      oauthlint-rule-id: AUTH-SESSION-003
      oauthlint-doc-url: https://oauthlint.dev/rules/session-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://github.com/expressjs/session#secret
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - express-session
        - cookie-session
    patterns:
      - pattern-either:
          - pattern: "session({secret: $S, ...})"
          - pattern: "cookieSession({secret: $S, ...})"
          - pattern: "expressSession({secret: $S, ...})"
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: ^['"].*['"]$
  - id: auth.session.id-in-url
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A session token / id appears in a URL query string. URLs are
      logged everywhere (web server logs, reverse proxies, browser
      history, referrer headers leaking to third-party CDNs and ad
      networks), so this leaks the credential.

      Pass session ids/tokens in the `Authorization` header or in a
      `Secure; HttpOnly` cookie. Never in the URL.

      OWASP ASVS V3.2 explicitly bans this pattern.
    metadata:
      oauthlint-rule-id: AUTH-SESSION-001
      oauthlint-doc-url: https://oauthlint.dev/rules/session-id-in-url
      category: security
      cwe: CWE-598
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://owasp.org/www-project-application-security-verification-standard/
    pattern-either:
      - pattern-regex: "[?&](?:session|sid|sess|auth_token|access_token|refresh_token|token|api[_-]?key|jwt|bearer)="
      - pattern-regex: "\\?\\s*['\"]?(?:session|sid|sess|auth_token|access_token|refresh_token|token|api[_-]?key|jwt|bearer)['\"]?\\s*:"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/bench/**"
        - "**/integration/**"
        - "**/docs/**"
        - "**/__mocks__/**"
        - "**/mocks/**"
        - "**/vendored/**"
        - "**/node_modules/**"
        - "**/*.stories.*"
  - id: auth.session.no-regeneration
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      The user is marked as logged in without first regenerating the session id.
      The identity is written onto the session (`req.session.user = ...`,
      `req.session.userId = ...`, etc.) before the session id is rotated. This
      opens the door to session-fixation attacks: an attacker who plants a
      known session id in the victim's browser before login retains access
      after authentication succeeds.

      Call `req.session.regenerate(cb)` (or your framework's equivalent)
      between authenticating the credentials and writing the user
      identity onto the session.

      OWASP ASVS V3.2.1: "The session id must be regenerated on
      authentication".
    metadata:
      oauthlint-rule-id: AUTH-SESSION-002
      oauthlint-doc-url: https://oauthlint.dev/rules/session-no-regeneration
      category: security
      cwe: CWE-384
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#renew-the-session-id-after-any-privilege-level-change
      technology:
        - express
    patterns:
      - pattern-either:
          - pattern: $REQ.session.user = $X
          - pattern: $REQ.session.userId = $X
          - pattern: $REQ.session.user_id = $X
          - pattern: $REQ.session.uid = $X
          - pattern: $REQ.session.authenticated = true
          - pattern: $REQ.session.isAuthenticated = true
      - pattern-not-inside: |
          $REQ.session.regenerate(...)
      - pattern-not-inside: |
          await new Promise(($R) => $REQ.session.regenerate(...));
          ...
      - pattern-not-inside: |
          await new Promise(($R, $J) => $REQ.session.regenerate(...));
          ...
      - pattern-not-inside: |
          await promisify($REQ.session.regenerate)(...);
          ...
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/bench/**"
        - "**/integration/**"
        - "**/docs/**"
        - "**/__mocks__/**"
        - "**/mocks/**"
        - "**/vendored/**"
        - "**/node_modules/**"
        - "**/*.stories.*"
  - id: auth.tls.reject-unauthorized
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      TLS certificate validation is disabled for this connection.
      Setting `rejectUnauthorized: false` or `NODE_TLS_REJECT_UNAUTHORIZED=0`
      makes the connection accept ANY certificate, including self-signed or
      attacker-supplied ones. This removes the protection TLS provides against
      man-in-the-middle attacks: anyone able to intercept the network path can
      present a forged certificate, then read and modify the traffic
      (credentials, tokens, data).

      Keep certificate validation enabled. If the server uses a private or
      self-signed CA, supply that CA explicitly instead of turning validation
      off, e.g. `new https.Agent({ ca: fs.readFileSync('ca.pem') })`. See
      CWE-295 and the Node.js TLS docs.
    metadata:
      oauthlint-rule-id: AUTH-TLS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/tls-reject-unauthorized
      category: security
      cwe: CWE-295
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://nodejs.org/api/tls.html#tlsconnectoptions-callback
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - node
        - https
        - axios
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
