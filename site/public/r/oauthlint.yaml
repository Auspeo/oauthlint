          - pattern-not: true !== $X
          - pattern-not: true == $X
          - pattern-not: true != $X
          - pattern-not: false === $X
          - pattern-not: false !== $X
          - pattern-not: false == $X
          - pattern-not: false != $X
          - pattern-not: $X.length === $N
          - pattern-not: $X.length !== $N
          - pattern-not: $X.length == $N
          - pattern-not: $X.length != $N
          - pattern-not: $X === null
          - pattern-not: $X !== null
          - pattern-not: $X == null
          - pattern-not: $X != null
          - pattern-not: $X === undefined
          - pattern-not: $X !== undefined
          - pattern-not: $X == undefined
          - pattern-not: $X != undefined
      - patterns:
          - pattern-either:
              - pattern: $A === $B
              - pattern: $A !== $B
              - pattern: $A == $B
              - pattern: $A != $B
          - metavariable-regex:
              metavariable: $B
              regex: (?i)^.*(?:password|secret|token|apikey|api_key|csrf|hmac|signature)$
          - metavariable-pattern:
              metavariable: $B
              patterns:
                - pattern-not: $X.name
                - pattern-not: $X.codes.$Y
          - metavariable-pattern:
              metavariable: $A
              patterns:
                - pattern-not: name
                - pattern-not: $X.name
                - pattern-not: $X.codes.$Y
          - pattern-not: typeof $X === $Y
