# OAuthLint — Semgrep rules for the OAuth / OIDC / JWT / session / CORS
# anti-patterns that AI coding tools systematically produce.
#
# Full pack — 253 rules across every supported language.
#
# Run the full pack with no install:
#   semgrep --config https://oauthlint.dev/r/oauthlint.yaml ./src
#
# Docs:    https://oauthlint.dev/docs/semgrep
# Rules:   https://oauthlint.dev/rules
# License: MIT — https://github.com/Auspeo/oauthlint
#
# Generated from the oauthlint-rules pack. Do not edit by hand.

rules:
  - id: auth.betterauth.disabled-csrf
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      better-auth's CSRF / origin protection is explicitly disabled.

      In `advanced`, `disableCSRFCheck: true` turns off ALL of better-auth's
      CSRF protection (origin-header validation and Fetch-Metadata checks), and
      `disableOriginCheck: true` drops the origin-header validation on its own.
      Either one lets a malicious site drive state-changing authentication
      requests against a logged-in user's session (CWE-352).

      Remove the flag and keep the checks on. If a specific trusted front-end
      needs to reach the auth API cross-origin, add its exact origin to
      `trustedOrigins` instead of disabling the check globally.
    metadata:
      oauthlint-rule-id: AUTH-BETTERAUTH-005
      oauthlint-doc-url: https://oauthlint.dev/rules/betterauth-disabled-csrf
      category: security
      cwe: CWE-352
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.better-auth.com/docs/reference/security
        - https://cwe.mitre.org/data/definitions/352.html
      technology:
        - better-auth
    patterns:
      - pattern-inside: betterAuth({...})
      - pattern-either:
          - pattern: "disableCSRFCheck: true"
          - pattern: "disableOriginCheck: true"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
  - id: auth.betterauth.hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      The better-auth `secret` is set to a hard-coded string literal.

      This value signs and encrypts every session cookie, CSRF token, and
      verification token better-auth issues. Committed to git it is one search
      away from compromise, letting an attacker forge sessions for any user.

      Read it from the environment instead: `secret: process.env.BETTER_AUTH_SECRET`
      (better-auth also falls back to the `BETTER_AUTH_SECRET` / `AUTH_SECRET`
      env vars automatically if you omit the option). Add the variable to
      `.env.example` with a placeholder and rotate any secret that has shipped.
    metadata:
      oauthlint-rule-id: AUTH-BETTERAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/betterauth-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://www.better-auth.com/docs/reference/options
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - better-auth
    patterns:
      - pattern: 'secret: "..."'
      - pattern-inside: betterAuth({...})
      - pattern-not-regex: (?i)secret\s*:\s*['"]\$\{?[A-Za-z_]+\}?['"]
      - pattern-not-regex: (?i)secret\s*:\s*['"]<[^'"]*>['"]
      - pattern-not-regex: (?i)secret\s*:\s*['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
  - id: auth.betterauth.insecure-cookie
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      better-auth is configured to issue insecure session cookies.

      Under `advanced`, `useSecureCookies: false` forces the session cookie to
      be sent without the `Secure` flag (so it travels over plain HTTP and can
      be sniffed), and `secure: false` / `httpOnly: false` in
      `defaultCookieAttributes` (or a per-cookie `attributes` block) strips the
      protections that keep the cookie off HTTP and out of `document.cookie`.

      Leave better-auth's secure defaults in place, or set `useSecureCookies:
      true` and keep `secure`/`httpOnly` at `true`. If you need insecure cookies
      for local HTTP dev, gate the value on `process.env.NODE_ENV !==
      'production'` rather than hard-coding `false`.
    metadata:
      oauthlint-rule-id: AUTH-BETTERAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/betterauth-insecure-cookie
      category: security
      cwe: CWE-614
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.better-auth.com/docs/concepts/cookies
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - better-auth
    patterns:
      - pattern-inside: betterAuth({...})
      - pattern-inside: "advanced: {...}"
      - pattern-either:
          - pattern: "useSecureCookies: false"
          - pattern: "secure: false"
          - pattern: "httpOnly: false"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.betterauth.trusted-origins-wildcard
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A fully-permissive wildcard appears in better-auth's `trustedOrigins`.

      `trustedOrigins` is better-auth's origin allow-list for CSRF and callback
      protection. An entry of `"*"`, `"**"`, or a protocol-only wildcard like
      `"https://*"` / `"*://*"` matches EVERY host, so any website can drive
      authenticated cross-origin requests and receive OAuth callbacks. This
      defeats the origin check entirely (CWE-942 / CWE-352).

      List the exact origins you trust instead:
      `trustedOrigins: ["https://app.example.com"]`. A scoped subdomain wildcard
      (`"https://*.example.com"`) is fine; a bare or protocol-only `*` is not.
    metadata:
      oauthlint-rule-id: AUTH-BETTERAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/betterauth-trusted-origins-wildcard
      category: security
      cwe: CWE-942
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://www.better-auth.com/docs/reference/security
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - better-auth
    patterns:
      - pattern-inside: betterAuth({...})
      - pattern: "trustedOrigins: [..., $O, ...]"
      - metavariable-regex:
          metavariable: $O
          regex: ^["'](\*{1,2}|(?:https?|\*)://\*{1,2})["']$
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
  - id: auth.cookie.long-lived
    languages:
      - javascript
      - typescript
    severity: INFO
    message: |
      An auth-looking cookie is being set with a `maxAge` greater than
      30 days. The threshold is 30 × 24 × 60 × 60 × 1000 = 2_592_000_000
      milliseconds. Long-lived session cookies expand the blast radius
      of any single token theft and bypass server-side revocation if
      the application doesn't validate freshness on every request.

      Prefer short-lived access cookies (15-60 min) paired with a
      separate refresh token rotation flow. If you really need a "remember
      me" cookie, scope it tightly (`SameSite=Strict`, dedicated path) and
      back it with a server-side allowlist you can revoke.
    metadata:
      oauthlint-rule-id: AUTH-COOKIE-004
      oauthlint-doc-url: https://oauthlint.dev/rules/cookie-long-lived
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      technology:
        - express
        - fastify
    pattern-either:
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access|remember)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern: "{..., maxAge: $MS, ...}"
                - metavariable-comparison:
                    metavariable: $MS
                    comparison: $MS > 2592000000
  - id: auth.cookie.no-httponly
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A session/auth cookie is being set WITHOUT the `HttpOnly` flag.
      Any XSS that lands on a page in the same origin will be able to
      read this cookie via `document.cookie` and exfiltrate the session.

      Set `{ httpOnly: true }` on every authentication cookie. If a
      front-end framework genuinely needs to read it from JS, that is a
      design problem. Server-side state is the right answer.
    metadata:
      oauthlint-rule-id: AUTH-COOKIE-002
      oauthlint-doc-url: https://oauthlint.dev/rules/cookie-no-httponly
      category: security
      cwe: CWE-1004
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6265#section-4.1.2.6
      technology:
        - express
        - fastify
    pattern-either:
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., httpOnly: true, ...}"
                - pattern-not: "{..., httpOnly: $X, ...}"
                - pattern: "{...}"
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              pattern: "{..., httpOnly: false, ...}"
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
  - id: auth.cookie.no-samesite
    languages:
      - javascript
      - typescript
    severity: INFO
    message: |
      A session/auth cookie is being set WITHOUT the `SameSite`
      attribute. Modern browsers default to `Lax`, but explicit is
      better, and APIs that legitimately need cross-site usage should
      consciously opt into `None` (with `Secure`), not silently inherit
      whatever the browser does today.

      For most auth flows, `SameSite=Strict` is the right answer; for
      OAuth callbacks, `SameSite=Lax` is required.
    metadata:
      oauthlint-rule-id: AUTH-COOKIE-003
      oauthlint-doc-url: https://oauthlint.dev/rules/cookie-no-samesite
      category: security
      cwe: CWE-1275
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/draft-ietf-httpbis-rfc6265bis-13#section-4.1.2.7
      technology:
        - express
        - fastify
    pattern-either:
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., sameSite: ..., ...}"
                - pattern-not: '{..., "sameSite": ..., ...}'
                - pattern: "{...}"
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-either:
                    - pattern: "{..., sameSite: 'none', ...}"
                    - pattern: '{..., sameSite: "none", ...}'
                    - pattern: "{..., sameSite: 'None', ...}"
                    - pattern: '{..., sameSite: "None", ...}'
                - pattern-not: "{..., secure: true, ...}"
  - id: auth.cookie.no-secure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A cookie that looks like a session or auth cookie is being set WITHOUT
      the `Secure` flag. The browser will happily send it over plain HTTP,
      which means a network attacker (open Wi-Fi, malicious proxy, downgrade
      attack) can capture it.

      Add `{ secure: true }` to the cookie options. If you absolutely need
      to set Secure-less cookies in dev, gate it on `NODE_ENV !== 'production'`.
    metadata:
      oauthlint-rule-id: AUTH-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/cookie-no-secure
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://datatracker.ietf.org/doc/html/rfc6265#section-4.1.2.5
      technology:
        - express
        - fastify
    pattern-either:
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: "{..., secure: true, ...}"
                - pattern-not: "{..., secure: $X, ...}"
                - pattern: "{...}"
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
          - metavariable-pattern:
              metavariable: $OPTS
              pattern: "{..., secure: false, ...}"
      - patterns:
          - pattern: $RES.cookie($NAME, $VAL)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^(['"])(?:[a-zA-Z0-9_-]*(?:session|sid|sess|auth|token|jwt|refresh|access)[a-zA-Z0-9_-]*)\1$
  - id: auth.cookie.samesite-none-insecure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A cookie is being set with `SameSite=None` but WITHOUT `Secure`.
      `SameSite=None` *requires* `Secure`: modern browsers reject a
      `SameSite=None` cookie that is not also `Secure`, so the cookie is
      silently dropped. Worse, if anything does accept it, the cookie is a
      cross-site cookie travelling over plaintext. It can be sent over plain
      HTTP and offers no CSRF protection at all.

      Fix: add `secure: true`, and only use `SameSite=None` when you genuinely
      need the cookie sent on cross-site requests; otherwise prefer
      `SameSite=Strict` or `Lax`. See CWE-1275.
    metadata:
      oauthlint-rule-id: AUTH-COOKIE-005
      oauthlint-doc-url: https://oauthlint.dev/rules/cookie-samesite-none-insecure
      category: security
      cwe: CWE-1275
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite#samesitenone_requires_secure
        - https://cwe.mitre.org/data/definitions/1275.html
      technology:
        - express
        - cookie
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "{..., sameSite: 'none', ...}"
              - pattern: '{..., sameSite: "none", ...}'
              - pattern: "{..., sameSite: 'None', ...}"
              - pattern: '{..., sameSite: "None", ...}'
          - pattern-not: "{..., secure: true, ...}"
      - pattern-regex: (?i)(["'`])(?![^"'`\n]*\bsecure\b)[^"'`\n]*\bsamesite\s*=\s*none\b[^"'`\n]*\1
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/apps/**"
        - "**/docs/**"
        - "**/__mocks__/**"
        - "**/mocks/**"
        - "**/vendored/**"
        - "**/node_modules/**"
        - "**/*.stories.*"
  - id: auth.cors.null-origin
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      CORS is configured to allow the literal origin `'null'`. Sandboxed
      iframes, documents loaded from `file://`, and certain cross-origin
      redirects send `Origin: null`. Adding the string `'null'` to your
      CORS policy therefore grants cross-origin access to ANY such context
      (including an attacker's sandboxed iframe), which defeats the
      same-origin policy. Combined with credentials this becomes a
      CSRF / data-exfiltration primitive.

      The `'null'` origin is not a safe sentinel and cannot be trusted:
      it is not bound to any host. Remove it from the allowlist entirely.

      Use an explicit allowlist of real, trusted origins instead:
       - `cors({ origin: 'https://app.example.com', credentials: true })`
       - `cors({ origin: ['https://app.example.com', 'https://admin.example.com'] })`

      Never set `Access-Control-Allow-Origin` to the string `'null'` and
      never include `'null'` in a CORS origin allowlist.
    metadata:
      oauthlint-rule-id: AUTH-CORS-003
      oauthlint-doc-url: https://oauthlint.dev/rules/cors-null-origin
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://portswigger.net/web-security/cors
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
      technology:
        - cors
        - express
    pattern-either:
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", "null")
      - pattern: $RES.header("Access-Control-Allow-Origin", "null")
      - pattern: $RES.set("Access-Control-Allow-Origin", "null")
      - pattern: 'cors({ ..., origin: "null", ... })'
      - pattern: 'cors({ ..., origin: [..., "null", ...], ... })'
      - patterns:
          - pattern: "cors({ ..., origin: $ALLOWED, ... })"
          - pattern-inside: |
              $ALLOWED = [..., "null", ...];
              ...
  - id: auth.cors.reflect-origin
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      CORS is configured to echo the request's `Origin` back as
      `Access-Control-Allow-Origin`. Reflecting the incoming origin is
      functionally identical to allowing EVERY origin: any site can make
      cross-origin requests and read the responses. Combined with
      credentials this becomes a CSRF / account-takeover primitive, because
      the browser will attach the victim's cookies to the attacker-controlled
      request.

      This is distinct from a literal `*` wildcard. Here the origin is
      reflected dynamically, which silently defeats the same-origin policy
      while looking "scoped" in code review.

      Use an explicit allowlist of trusted origins instead:
       - `cors({ origin: 'https://app.example.com', credentials: true })`
       - `cors({ origin: ['https://app.example.com', 'https://admin.example.com'] })`
       - a callback that validates against an allowlist before calling
         `cb(null, true)`.

      Never set `Access-Control-Allow-Origin` to `req.headers.origin`, never
      use `origin: true`, and never write a callback that unconditionally
      returns `cb(null, true)`.
    metadata:
      oauthlint-rule-id: AUTH-CORS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/cors-reflect-origin
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://portswigger.net/web-security/cors
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
      technology:
        - cors
        - express
    pattern-either:
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.header("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.set("Access-Control-Allow-Origin", $REQ.headers.origin)
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers["origin"])
      - pattern: $RES.header("Access-Control-Allow-Origin", $REQ.headers["origin"])
      - pattern: $RES.set("Access-Control-Allow-Origin", $REQ.headers["origin"])
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.header("origin"))
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.get("origin"))
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", $REQ.get("Origin"))
      - pattern: "cors({ ..., origin: true, ... })"
      - pattern: "cors({ ..., origin: ($O, $CB) => $CB(null, true), ... })"
      - patterns:
          - pattern: |
              cors({ ..., origin: ($O, $CB) => { ... }, ... })
          - pattern-inside: |
              cors({ ..., origin: ($O, $CB) => { ... return $CB(null, true); }, ... })
          - pattern-not: |
              cors({ ..., origin: ($O, $CB) => { ... if (<... $O ...>) { ... } ... }, ... })
      - patterns:
          - pattern: |
              cors({ ..., origin: function ($O, $CB) { ... }, ... })
          - pattern-inside: |
              cors({ ..., origin: function ($O, $CB) { ... return $CB(null, true); }, ... })
          - pattern-not: |
              cors({ ..., origin: function ($O, $CB) { ... if (<... $O ...>) { ... } ... }, ... })
  - id: auth.cors.wildcard-with-credentials
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      CORS is configured with `Access-Control-Allow-Origin: *` and
      `Access-Control-Allow-Credentials: true` at the same time. The
      spec forbids this combination (browsers will block it), but
      developers regularly try to "fix" the resulting error by switching
      to `origin: true` (which echoes the requesting origin back),
      effectively turning the policy into "allow credentials from
      ANYWHERE". That's a CSRF-on-steroids primitive.

      Decide which one you actually need:
       - Public API, no cookies/auth headers needed cross-site →
         `origin: '*'`, `credentials: false` (default).
       - Authenticated API for a known frontend → enumerate the exact
         origins, `credentials: true`.

      Never combine wildcard origins with credentials enabled.
    metadata:
      oauthlint-rule-id: AUTH-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/cors-wildcard-with-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
        - https://portswigger.net/web-security/cors
      technology:
        - express
        - cors
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: 'cors({ ..., origin: "*", ..., credentials: true, ... })'
              - pattern: 'cors({ ..., credentials: true, ..., origin: "*", ... })'
              - pattern: "cors({ ..., origin: true, ..., credentials: true, ... })"
              - pattern: "cors({ ..., credentials: true, ..., origin: true, ... })"
              - pattern: "cors({ ..., origin: $REQ.headers.origin, ..., credentials: true, ... })"
              - pattern: "cors({ ..., credentials: true, ..., origin: $REQ.headers.origin, ... })"
              - pattern: "cors({ ..., origin: ($O, $CB) => $CB(null, true), ..., credentials: true, ... })"
              - pattern: "cors({ ..., credentials: true, ..., origin: ($O, $CB) => $CB(null, true), ... })"
      - pattern-regex: Access-Control-Allow-Origin['"]\s*,\s*['"]\*['"][\s\S]{0,200}Access-Control-Allow-Credentials['"]\s*,\s*['"]true['"]
      - pattern-regex: Access-Control-Allow-Credentials['"]\s*,\s*['"]true['"][\s\S]{0,200}Access-Control-Allow-Origin['"]\s*,\s*['"]\*['"]
  - id: auth.csharp.cookie.httponly-false
    languages:
      - csharp
    severity: ERROR
    message: |
      A cookie is created with `HttpOnly = false`, making it readable from
      client-side JavaScript. If the site has any XSS, an injected script can
      read the auth/session cookie via `document.cookie` and exfiltrate the
      session (CWE-1004). This is a common AI-generated change made so JS can
      "see" the cookie, which needlessly removes a key defense.

      Set `HttpOnly = true` on authentication and session cookies so they are not
      exposed to scripts. If the browser must read a value, keep it in a separate
      non-sensitive cookie rather than weakening the session cookie.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-COOKIE-002
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-cookie-httponly-false
      category: security
      cwe: CWE-1004
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/cookie
        - https://cwe.mitre.org/data/definitions/1004.html
      technology:
        - aspnetcore
        - cookies
    pattern: HttpOnly = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.cookie.samesite-none
    languages:
      - csharp
    severity: WARNING
    message: |
      A cookie is set to `SameSite = SameSiteMode.None`, which removes the SameSite
      defense and sends the cookie on cross-site requests. For an authentication or
      session cookie this re-opens the CSRF surface that `Lax`/`Strict` closes, and
      `None` is only safe when the cookie is also marked `Secure` (browsers reject
      `SameSite=None` without it) (CWE-1275). This is a common AI-generated change
      made to get a cookie flowing in an embedded/cross-site scenario.

      Leave auth/session cookies at `SameSiteMode.Lax` (the framework default) or
      `SameSiteMode.Strict`. Only use `SameSiteMode.None` for a genuinely
      cross-site cookie, and when you do, also set `Secure = true` and rely on
      anti-forgery tokens for CSRF protection.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-COOKIE-003
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-cookie-samesite-none
      category: security
      cwe: CWE-1275
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/samesite
        - https://cwe.mitre.org/data/definitions/1275.html
      technology:
        - aspnetcore
        - cookies
    pattern-either:
      - pattern: SameSite = SameSiteMode.None
      - pattern: $X.SameSite = SameSiteMode.None
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.cookie.secure-policy-none
    languages:
      - csharp
    severity: ERROR
    message: |
      A cookie policy is set to `SecurePolicy = CookieSecurePolicy.None`, which
      lets authentication and session cookies be sent over plain HTTP. On any
      non-HTTPS hop an on-path attacker can read the cookie and hijack the
      session (CWE-614). This is a common AI-generated shortcut to get cookies
      working over `http://localhost` that then ships to production.

      Use `CookieSecurePolicy.Always` so the `Secure` attribute is set and the
      cookie is only transmitted over HTTPS. Prefer `Always` over `SameAsRequest`
      for auth cookies.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-COOKIE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-cookie-secure-policy-none
      category: security
      cwe: CWE-614
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/cookie
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - aspnetcore
        - cookies
    pattern-either:
      - pattern: SecurePolicy = CookieSecurePolicy.None
      - pattern: $X.SecurePolicy = CookieSecurePolicy.None
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.cors.reflect-any-origin-credentials
    languages:
      - csharp
    severity: ERROR
    message: |
      A CORS policy combines credentialed requests with a wildcard or reflected
      origin (`AllowCredentials()` together with `AllowAnyOrigin()` or
      `SetIsOriginAllowed(...)` that returns true for everything). This lets any
      website make cross-origin requests carrying the user's cookies and read the
      response, which is a cross-site data-theft and CSRF primitive (CWE-942).
      This is a common AI-generated mistake made to "just make CORS work".

      Never pair `AllowCredentials()` with a wildcard/reflected origin. Pin an
      explicit allow-list with `WithOrigins("https://app.example.com")` and only
      then call `AllowCredentials()`.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-cors-reflect-any-origin-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/aspnet/core/security/cors
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - aspnetcore
        - cors
    patterns:
      - pattern-either:
          - pattern: $B.SetIsOriginAllowed(...).AllowCredentials()
          - pattern: $B.AllowCredentials().SetIsOriginAllowed(...)
          - pattern: $B.AllowAnyOrigin().AllowCredentials()
          - pattern: $B.AllowCredentials().AllowAnyOrigin()
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.crypto.ecb-mode
    languages:
      - csharp
    severity: WARNING
    message: |
      A symmetric cipher is configured with `CipherMode.ECB`. ECB encrypts each
      block independently, so identical plaintext blocks produce identical
      ciphertext, leaking structure and enabling block-shuffling attacks
      (CWE-327). This matters for anything auth-related: encrypted tokens,
      cookies, or credentials.

      Use an authenticated mode instead: prefer AES-GCM
      (`AesGcm`) or, failing that, CBC with a random IV and a separate MAC.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-CRYPTO-003
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-crypto-ecb-mode
      category: security
      cwe: CWE-327
      owasp: A02:2021
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/327.html
      technology:
        - dotnet
    patterns:
      - pattern-either:
          - pattern: $X.Mode = System.Security.Cryptography.CipherMode.ECB
          - pattern: $X.Mode = CipherMode.ECB
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.cs"
        - "**/*Tests.cs"
  - id: auth.csharp.crypto.insecure-random
    languages:
      - csharp
    severity: ERROR
    message: |
      A security-sensitive value is generated with `System.Random` or
      `Guid.NewGuid()` inside a token/secret/OTP generator. `System.Random` is a
      non-cryptographic PRNG seeded from the clock: its output is predictable and
      its state is recoverable from a few samples, so an attacker can reconstruct
      the "random" secret (CWE-338). `Guid.NewGuid()` is not guaranteed to be
      cryptographically random either. AI tools paste these in because they look
      random enough.

      Use `System.Security.Cryptography.RandomNumberGenerator` instead, e.g.
      `RandomNumberGenerator.GetBytes(32)` (then Base64/hex encode) or
      `RandomNumberGenerator.GetInt32(...)`.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-CRYPTO-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-crypto-insecure-random
      category: security
      cwe: CWE-338
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/dotnet/api/system.security.cryptography.randomnumbergenerator
        - https://cwe.mitre.org/data/definitions/338.html
      technology:
        - dotnet
    patterns:
      - pattern-either:
          - pattern: new System.Random(...)
          - pattern: new Random(...)
          - pattern: Guid.NewGuid()
          - pattern: System.Guid.NewGuid()
      - pattern-inside: |
          $RET $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i).*(token|secret|otp|apikey|api_?key|reset|nonce|passcode|verificationcode|salt).*
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.cs"
        - "**/*Tests.cs"
  - id: auth.csharp.crypto.weak-password-hash
    languages:
      - csharp
    severity: ERROR
    message: |
      A password is hashed with a fast general-purpose digest (`MD5`, `SHA1`,
      `SHA256`, `SHA512`) from System.Security.Cryptography. These are designed to
      be fast, which makes offline brute-force and rainbow-table attacks cheap;
      they are NOT suitable for storing passwords (CWE-916).

      Use ASP.NET Core Identity's `PasswordHasher<TUser>`, or a slow, salted
      password KDF: PBKDF2 (`Rfc2898DeriveBytes` with a high iteration count),
      bcrypt, or Argon2.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-CRYPTO-002
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-crypto-weak-password-hash
      category: security
      cwe: CWE-916
      owasp: A02:2021
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/aspnet/core/security/data-protection/consumer-apis/password-hashing
        - https://cwe.mitre.org/data/definitions/916.html
      technology:
        - dotnet
    patterns:
      - pattern-either:
          - pattern: System.Security.Cryptography.MD5.HashData($PW)
          - pattern: MD5.HashData($PW)
          - pattern: SHA1.HashData($PW)
          - pattern: SHA256.HashData($PW)
          - pattern: SHA512.HashData($PW)
          - pattern: $H.ComputeHash($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd|passphrase).*
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.cs"
        - "**/*Tests.cs"
  - id: auth.csharp.flow.open-redirect
    languages:
      - csharp
    severity: WARNING
    message: |
      A redirect target comes straight from user input (a query-string value or a
      `returnUrl`-style parameter) and is passed to `Redirect(...)` without a
      local-URL check. An attacker can craft a link that bounces the victim to an
      external phishing site after login, and this is the classic OAuth/OIDC
      `returnUrl` open-redirect (CWE-601).

      Validate the target before redirecting: use `Url.IsLocalUrl(returnUrl)` (or
      `LocalRedirect(returnUrl)`, which throws on a non-local URL) so only
      same-application paths are allowed.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-flow-open-redirect
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/preventing-open-redirects
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - aspnetcore
    patterns:
      - pattern-either:
          - pattern: Redirect(Request.Query[$K])
          - pattern: Redirect(Request.Query[$K].ToString())
          - patterns:
              - pattern-either:
                  - pattern: Redirect($URL)
                  - pattern: RedirectPermanent($URL)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?i)^(returnurl|redirecturl|redirect_uri|returnto|next|url)$
      - pattern-not-inside: |
          if (Url.IsLocalUrl(...)) { ... }
      - pattern-not-inside: |
          if ($U.IsLocalUrl(...)) { ... }
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.cs"
        - "**/*Tests.cs"
  - id: auth.csharp.jwt.hardcoded-symmetric-key
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT signing key is built from a hard-coded string literal
      (`new SymmetricSecurityKey(Encoding.UTF8.GetBytes("..."))`). This key signs
      and verifies every token: committed to source control it is one search away
      from compromise, letting an attacker forge tokens for any user or role
      (CWE-798). This is a common AI-generated mistake: a literal secret is
      inlined to make the sample "just work" and never externalized.

      Load the key from configuration or a secret store instead (e.g.
      `Encoding.UTF8.GetBytes(builder.Configuration["Jwt:Key"])` or a value read
      from Azure Key Vault / environment) and rotate the leaked secret out of
      source control.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-005
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-hardcoded-symmetric-key
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/aspnet/core/security/app-secrets
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern-either:
          - pattern: new SymmetricSecurityKey(System.Text.Encoding.UTF8.GetBytes("..."))
          - pattern: new SymmetricSecurityKey(Encoding.UTF8.GetBytes("..."))
          - pattern: new SymmetricSecurityKey(System.Text.Encoding.ASCII.GetBytes("..."))
          - pattern: new SymmetricSecurityKey(Encoding.ASCII.GetBytes("..."))
      - pattern-not-regex: (?i)GetBytes\(\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)GetBytes\(\s*["']<[^"']*>["']
      - pattern-not-regex: (?i)GetBytes\(\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.read-without-validation
    languages:
      - csharp
    severity: WARNING
    message: |
      A JWT is decoded with a read-only API that performs NO validation
      (`new JwtSecurityToken(tokenString)`, `handler.ReadJwtToken(...)`, or
      `new JsonWebToken(tokenString)`). These constructors/methods only parse the
      token; they do not check the signature, issuer, audience, or expiry. Trusting
      the claims that come back lets an attacker forge any identity or role by
      hand-crafting an unsigned token (CWE-345). This is a common AI-generated
      shortcut for "reading the user id from the token" that silently skips
      verification.

      Validate the token before trusting its claims: call
      `handler.ValidateToken(token, tokenValidationParameters, out var validated)`
      (or `await handler.ValidateTokenAsync(...)`) and read claims from the
      validated result. Only parse a token unvalidated when you are inspecting a
      token you just issued, never one received from a client.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-006
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-read-without-validation
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/dotnet/api/system.identitymodel.tokens.jwt.jwtsecuritytokenhandler.validatetoken
        - https://cwe.mitre.org/data/definitions/345.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern-either:
          - pattern: new System.IdentityModel.Tokens.Jwt.JwtSecurityToken($T)
          - pattern: new JwtSecurityToken($T)
          - pattern: new Microsoft.IdentityModel.JsonWebTokens.JsonWebToken($T)
          - pattern: new JsonWebToken($T)
          - pattern: $H.ReadJwtToken(...)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.require-expiration-disabled
    languages:
      - csharp
    severity: WARNING
    message: |
      A JWT setup sets `RequireExpirationTime = false` on
      `TokenValidationParameters`. Tokens without an `exp` claim are then accepted,
      so a leaked or stolen token stays valid forever: it can never expire or be
      timed out (CWE-613). This is a common AI-generated shortcut to accept tokens
      that happen to omit `exp`.

      Leave `RequireExpirationTime` at its secure default (`true`) and keep
      `ValidateLifetime = true` so every token must carry an `exp` claim and is
      rejected once it lapses.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-009
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-require-expiration-disabled
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters.requireexpirationtime
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - aspnetcore
        - jwt-bearer
    pattern-either:
      - pattern: RequireExpirationTime = false
      - pattern: $X.RequireExpirationTime = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.require-signed-tokens-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT setup sets `RequireSignedTokens = false` on
      `TokenValidationParameters`. With signed tokens no longer required, an
      unsigned token (`alg: none`, empty signature segment) is returned by the
      handler as valid, so an attacker can forge tokens with arbitrary claims and
      no key at all (CWE-347). This is a common AI-generated shortcut to get past a
      "token is not signed" error during local wiring.

      Leave `RequireSignedTokens` at its secure default (`true`) so every accepted
      token must carry a signature that verifies against a trusted key
      (`IssuerSigningKey` / keys from OIDC metadata).
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-008
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-require-signed-tokens-disabled
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters.requiresignedtokens
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - aspnetcore
        - jwt-bearer
    pattern-either:
      - pattern: RequireSignedTokens = false
      - pattern: $X.RequireSignedTokens = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.signature-validator-bypass
    languages:
      - csharp
    severity: ERROR
    message: |
      A custom `SignatureValidator` on `TokenValidationParameters` returns a parsed
      token WITHOUT verifying its signature: it just constructs and returns
      `new JwtSecurityToken(token)` / `new JsonWebToken(token)`. Because the
      delegate replaces the built-in signature check, any token (including an
      unsigned or attacker-forged one) is accepted, letting an attacker impersonate
      any user or role (CWE-347). This is a well-known "make validation pass" hack
      that AI assistants reproduce from blog posts.

      Remove the custom `SignatureValidator` and let the handler verify signatures
      with `IssuerSigningKey` / `IssuerSigningKeys` (or keys resolved from OIDC
      metadata). If you truly need a custom validator, it must cryptographically
      verify the signature and throw on failure, never return a freshly parsed
      token unchecked.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-007
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-signature-validator-bypass
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters.signaturevalidator
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern-either:
          - pattern: SignatureValidator = ($TOK, $P) => new JwtSecurityToken(...)
          - pattern: SignatureValidator = ($TOK, $P) => new JsonWebToken(...)
          - pattern: |
              SignatureValidator = ($TOK, $P) => { ... return new JwtSecurityToken(...); ... }
          - pattern: |
              SignatureValidator = ($TOK, $P) => { ... return new JsonWebToken(...); ... }
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.validate-audience-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT bearer setup disables audience validation
      (`ValidateAudience = false`) on `TokenValidationParameters`. With the
      audience unchecked, a token that was minted for a different API or client
      is accepted here, turning this service into a confused deputy and enabling
      cross-service token replay (CWE-287). This is a common AI-generated
      shortcut: validation is switched off to silence an `aud` mismatch during
      wiring and never restored.

      Leave `ValidateAudience` at its secure default (`true`) and pin the
      expected audience with `ValidAudience` (or `ValidAudiences`) so only tokens
      issued for this API are honored.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-002
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-validate-audience-disabled
      category: security
      cwe: CWE-287
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/jwt-authn
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern: ValidateAudience = false
      - pattern-inside: $A.AddJwtBearer(...)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.validate-issuer-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT bearer setup disables issuer validation
      (`ValidateIssuer = false`) on `TokenValidationParameters`. With the issuer
      unchecked, a token from any issuer or identity provider is accepted, so an
      attacker who controls (or spins up) any IdP can mint tokens this service
      will trust (CWE-287). This is a common AI-generated shortcut: the check is
      disabled to get past an `iss` mismatch during setup and never restored.

      Leave `ValidateIssuer` at its secure default (`true`) and pin the expected
      issuer with `ValidIssuer` (or `ValidIssuers`) so only tokens from your own
      authority are honored.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-004
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-validate-issuer-disabled
      category: security
      cwe: CWE-287
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/jwt-authn
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern: ValidateIssuer = false
      - pattern-inside: $A.AddJwtBearer(...)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.validate-lifetime-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT bearer setup disables lifetime validation
      (`ValidateLifetime = false`) on `TokenValidationParameters`. With the
      lifetime unchecked, expired tokens are accepted forever, so a leaked or
      revoked token never stops working and cannot be timed out (CWE-613). This
      is a common AI-generated shortcut: expiry checks are turned off to stop a
      short-lived test token from failing and then left disabled.

      Leave `ValidateLifetime` at its secure default (`true`) so the `exp` (and
      `nbf`) claims are enforced. If clock drift is the real problem, set a small
      `ClockSkew` instead of disabling the check.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-003
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-validate-lifetime-disabled
      category: security
      cwe: CWE-613
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/jwt-authn
        - https://cwe.mitre.org/data/definitions/613.html
      technology:
        - aspnetcore
        - jwt-bearer
    patterns:
      - pattern: ValidateLifetime = false
      - pattern-inside: $A.AddJwtBearer(...)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.jwt.validate-signing-key-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      A JWT bearer setup disables signature validation
      (`ValidateIssuerSigningKey = false`) on `TokenValidationParameters`. With
      the signing key unchecked, a token carrying any signature (or none) is
      accepted, so an attacker can forge a token for any user or role (CWE-347).
      This is a frequent AI-generated shortcut: validation is turned off to get
      past a local key-setup error and never turned back on.

      Leave `ValidateIssuerSigningKey` at its secure default (`true`) and supply
      the real key via `IssuerSigningKey` / `IssuerSigningKeys`, loaded from the
      OIDC metadata or configuration rather than hard-coded.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-jwt-validate-signing-key-disabled
      category: security
      cwe: CWE-347
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/jwt-authn
        - https://cwe.mitre.org/data/definitions/347.html
      technology:
        - aspnetcore
        - jwt-bearer
    pattern: ValidateIssuerSigningKey = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.oauth.hardcoded-client-secret
    languages:
      - csharp
    severity: ERROR
    message: |
      An OAuth/OIDC client secret is assigned from a hard-coded string literal
      (`options.ClientSecret = "..."`). This secret authenticates the whole
      application to the identity provider: committed to source control it is one
      search away from letting an attacker impersonate the app, redeem codes, and
      obtain tokens (CWE-798). This is a common AI-generated mistake: the literal
      secret is inlined to make the sample "just work" and never externalized.

      Read it from configuration or a secret store instead (e.g.
      `options.ClientSecret = builder.Configuration["Authentication:ClientSecret"]`
      or a value from Azure Key Vault / environment) and rotate the leaked
      secret out of source control.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-OAUTH-003
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-oauth-hardcoded-client-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/aspnet/core/security/app-secrets
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - aspnetcore
        - openid-connect
    patterns:
      - pattern: $O.ClientSecret = "..."
      - pattern-not-regex: (?i)ClientSecret\s*=\s*["']\$\{?[A-Za-z_]+\}?["']
      - pattern-not-regex: (?i)ClientSecret\s*=\s*["']<[^"']*>["']
      - pattern-not-regex: (?i)ClientSecret\s*=\s*["'](?:your[-_]|example|placeholder|xxx+|todo|changeme|change[-_]?me|replace)
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.oauth.pkce-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      An OpenID Connect handler turns PKCE off (`UsePkce = false`). Without
      Proof Key for Code Exchange, an authorization code intercepted on the
      redirect (a malicious app, a leaked URL, a network hop) can be redeemed by
      the attacker, defeating the code-flow protection that PKCE provides
      (CWE-287). This is a common AI-generated change made to work around a
      provider quirk and never reverted.

      Leave PKCE enabled: it is the modern default (`UsePkce = true`) and is
      required for public clients. Fix the underlying provider configuration
      rather than disabling the proof key.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-OAUTH-002
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-oauth-pkce-disabled
      category: security
      cwe: CWE-287
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/configure-oidc-web-authentication
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - aspnetcore
        - openid-connect
    pattern-either:
      - pattern: UsePkce = false
      - pattern: $X.UsePkce = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.oauth.require-https-metadata-disabled
    languages:
      - csharp
    severity: ERROR
    message: |
      An OIDC/JWT bearer handler disables HTTPS for its metadata and token
      exchange (`RequireHttpsMetadata = false`). The discovery document, JWKS,
      and token traffic can then travel over plain HTTP, where an on-path
      attacker can swap signing keys or tokens and defeat the whole trust chain
      (CWE-319). This is a common AI-generated leftover from local development
      that ships to production.

      Leave `RequireHttpsMetadata` at its secure default (`true`). If you truly
      need cleartext for local development only, guard it behind an environment
      check such as `env.IsDevelopment()` so production stays on HTTPS.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-OAUTH-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-oauth-require-https-metadata-disabled
      category: security
      cwe: CWE-319
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/security/authentication/configure-oidc-web-authentication
        - https://cwe.mitre.org/data/definitions/319.html
      technology:
        - aspnetcore
        - openid-connect
    pattern-either:
      - pattern: RequireHttpsMetadata = false
      - pattern: $X.RequireHttpsMetadata = false
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.tls.disable-cert-validation
    languages:
      - csharp
    severity: ERROR
    message: |
      TLS server-certificate validation is turned off: the handler accepts any
      certificate via `DangerousAcceptAnyServerCertificateValidator` or a
      callback that always returns `true`. With validation bypassed, an on-path
      attacker presenting a forged or self-signed certificate is trusted, and the
      entire TLS protection (including any OAuth token in transit) is defeated
      (CWE-295). This is a common AI-generated shortcut to silence a certificate
      error during development.

      Remove the override and let the system trust store validate the
      certificate. If a private CA is involved, install/trust that CA rather than
      accepting all certificates; scope any relaxed check to a single pinned host
      in development only.
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-TLS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-tls-disable-cert-validation
      category: security
      cwe: CWE-295
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://learn.microsoft.com/dotnet/fundamentals/networking/http/httpclient
        - https://cwe.mitre.org/data/definitions/295.html
      technology:
        - aspnetcore
        - httpclient
    pattern-either:
      - pattern: $R.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator
      - pattern: $R.ServerCertificateCustomValidationCallback = (...) => true
      - pattern: ServerCertificateCustomValidationCallback = (...) => true
      - pattern: $R.ServerCertificateCustomValidationCallback = $X => true
      - pattern: ServerCertificateCustomValidationCallback = $X => true
      - pattern: $R.RemoteCertificateValidationCallback = (...) => true
      - pattern: RemoteCertificateValidationCallback = (...) => true
      - pattern: $R.RemoteCertificateValidationCallback = $X => true
      - pattern: RemoteCertificateValidationCallback = $X => true
      - pattern: $R.ServerCertificateValidationCallback = (...) => true
      - pattern: ServerCertificateValidationCallback = (...) => true
      - pattern: $R.ServerCertificateValidationCallback = $X => true
      - pattern: ServerCertificateValidationCallback = $X => true
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.csharp.web.authentication-after-authorization
    languages:
      - csharp
    severity: ERROR
    message: |
      The middleware pipeline calls `UseAuthorization()` BEFORE
      `UseAuthentication()`. ASP.NET Core requires authentication to run first so
      that `HttpContext.User` is populated before authorization evaluates policies;
      in the reverse order authorization sees an unauthenticated, anonymous user,
      which either blocks legitimate users or, with a permissive fallback policy,
      lets requests through unauthenticated (CWE-696). This is a common
      AI-generated ordering mistake when wiring up `Program.cs`.

      Register the middleware in the correct order: call
      `app.UseAuthentication();` immediately before `app.UseAuthorization();` (both
      after `UseRouting()` and before the endpoint mapping).
    metadata:
      oauthlint-rule-id: AUTH-CSHARP-WEB-001
      oauthlint-doc-url: https://oauthlint.dev/rules/csharp-web-authentication-after-authorization
      category: security
      cwe: CWE-696
      owasp: API1:2023
      llm-prevalence: MEDIUM
      references:
        - https://learn.microsoft.com/aspnet/core/fundamentals/middleware
        - https://cwe.mitre.org/data/definitions/696.html
      technology:
        - aspnetcore
    patterns:
      - pattern: |
          $APP.UseAuthorization();
          ...
          $APP.UseAuthentication();
    paths:
      exclude:
        - "**/test/**"
        - "**/*.Tests/**"
        - "**/*.Test/**"
        - "**/samples/**"
        - "**/sandbox/**"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
  - id: auth.express.auth-middleware-noop
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An authentication/authorization middleware does nothing but call `next()`.
      A guard whose entire body is `next()` (or `return next()`) authorises every
      request, so any route it protects is effectively public. This is the classic
      "stubbed out for now" middleware that ships to production and silently
      removes access control.

      Implement the check: verify the session/token, and either call `next()` on
      success or short-circuit with `res.status(401).end()` /
      `res.status(403).end()` (or `next(err)`) when it fails. If a route is meant
      to be public, remove the guard entirely rather than leaving a no-op that
      reads as protected.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-005
      oauthlint-doc-url: https://oauthlint.dev/rules/express-auth-middleware-noop
      category: security
      cwe: CWE-287
      owasp: A01:2021
      llm-prevalence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/287.html
      technology:
        - express
    patterns:
      - pattern-either:
          - pattern: function $F($REQ, $RES, $NEXT) { $NEXT(); }
          - pattern: function $F($REQ, $RES, $NEXT) { return $NEXT(); }
          - pattern: const $F = ($REQ, $RES, $NEXT) => $NEXT();
          - pattern: const $F = ($REQ, $RES, $NEXT) => { $NEXT(); }
          - pattern: const $F = ($REQ, $RES, $NEXT) => { return $NEXT(); }
          - pattern: const $F = function ($REQ, $RES, $NEXT) { $NEXT(); }
          - pattern: const $F = function ($REQ, $RES, $NEXT) { return $NEXT(); }
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(auth|login|logged|protect|guard|permission|verifytoken|verifyjwt|isadmin|requireadmin|restrict)
  - id: auth.express.cookie-insecure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      An Express session cookie is explicitly configured as insecure. Setting
      `secure: false` lets the browser send the session cookie over plain HTTP,
      and `httpOnly: false` exposes it to `document.cookie` (any XSS reads it).

      Either drop the flag (the framework default may still need hardening) or
      set `secure: true` and `httpOnly: true` for production. If you need
      insecure cookies in dev, gate the value on `NODE_ENV !== 'production'`
      rather than hard-coding `false`.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/express-cookie-insecure
      category: security
      cwe: CWE-614
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://github.com/expressjs/session#cookiesecure
        - https://github.com/expressjs/cookie-session#options
        - https://cwe.mitre.org/data/definitions/614.html
      technology:
        - express-session
        - cookie-session
    pattern-either:
      - pattern: "session({..., cookie: {..., secure: false, ...}, ...})"
      - pattern: "session({..., cookie: {..., httpOnly: false, ...}, ...})"
      - pattern: "expressSession({..., cookie: {..., secure: false, ...}, ...})"
      - pattern: "expressSession({..., cookie: {..., httpOnly: false, ...}, ...})"
      - pattern: "cookieSession({..., secure: false, ...})"
      - pattern: "cookieSession({..., httpOnly: false, ...})"
  - id: auth.express.cookie-parser-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      `cookie-parser` is initialised with a hard-coded string secret
      (`cookieParser('some-secret')`). That secret signs every signed cookie
      (`res.cookie(name, val, { signed: true })`, read back from
      `req.signedCookies`). Anyone who reads it from your source or git history
      can forge signed cookies and tamper with values your app trusts.

      Load the secret from the environment (`cookieParser(process.env.COOKIE_SECRET)`)
      or a secret manager, and rotate the leaked value out of source control.
      Add a placeholder to `.env.example` so contributors know it is required.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-004
      oauthlint-doc-url: https://oauthlint.dev/rules/express-cookie-parser-secret
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: MEDIUM
      references:
        - https://github.com/expressjs/cookie-parser#cookieparsersecret-options
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - express
        - cookie-parser
    patterns:
      - pattern-either:
          - pattern: cookieParser($S)
          - pattern: cookieParser($S, $OPTS)
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: ^['"].*['"]$
  - id: auth.express.helmet-disabled-protection
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A Helmet security header is explicitly turned off. Passing
      `contentSecurityPolicy: false`, `hsts: false`, `frameguard: false`, or
      `noSniff: false` to `helmet()` disables a protection Helmet enables by
      default: CSP (XSS/data-injection defense), HSTS (forces HTTPS),
      X-Frame-Options (clickjacking defense), or X-Content-Type-Options (MIME
      sniffing defense) respectively.

      Remove the `false` override so the default protection stays on, or replace
      it with a real configuration object (for example
      `contentSecurityPolicy: { directives: { ... } }` or
      `hsts: { maxAge: 31536000 }`). If a header genuinely must be managed
      elsewhere, set it there rather than shipping the response with the
      protection silently missing.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-003
      oauthlint-doc-url: https://oauthlint.dev/rules/express-helmet-disabled-protection
      category: security
      cwe: CWE-693
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://helmetjs.github.io/
        - https://cwe.mitre.org/data/definitions/693.html
      technology:
        - express
        - helmet
    pattern-either:
      - pattern: "helmet({..., contentSecurityPolicy: false, ...})"
      - pattern: "helmet({..., hsts: false, ...})"
      - pattern: "helmet({..., frameguard: false, ...})"
      - pattern: "helmet({..., noSniff: false, ...})"
  - id: auth.express.static-dotfiles-allow
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A static file handler is configured with `dotfiles: 'allow'`, which serves
      dotfiles from the mounted directory. If that directory (or anything under
      it) contains `.env`, `.git/`, `.npmrc`, `.aws/`, or similar, an attacker
      can fetch them directly (for example `GET /.env`) and harvest OAuth client
      secrets, API keys, and database credentials.

      Remove the option to keep the safe default (`dotfiles: 'ignore'`), or set
      `dotfiles: 'deny'` to return 403. Never serve dotfiles from a public web
      root; keep secrets out of any statically served directory.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-006
      oauthlint-doc-url: https://oauthlint.dev/rules/express-static-dotfiles-allow
      category: security
      cwe: CWE-538
      owasp: A05:2021
      llm-prevalence: LOW
      references:
        - https://expressjs.com/en/4x/api.html#express.static
        - https://cwe.mitre.org/data/definitions/538.html
      technology:
        - express
        - serve-static
    pattern-either:
      - pattern: 'express.static($DIR, {..., dotfiles: "allow", ...})'
      - pattern: 'serveStatic($DIR, {..., dotfiles: "allow", ...})'
  - id: auth.express.trust-proxy-true
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      Express is configured to trust EVERY proxy (`app.set('trust proxy', true)`
      or the equivalent `app.enable('trust proxy')`). With unbounded trust,
      Express believes the `X-Forwarded-For` and `X-Forwarded-Proto` headers on
      any incoming request. A client can then spoof its source IP (defeating
      IP allowlists, rate limiters, and audit logs) and spoof `https`, which can
      trick `secure` session cookies into being sent over plain HTTP.

      Set `trust proxy` to the number of proxies actually in front of the app
      (e.g. `app.set('trust proxy', 1)`), or to a specific address / subnet /
      preset (`'loopback'`, `'uniquelocal'`, a CIDR, or an allowlist array), so
      only your real infrastructure is trusted. Never trust all proxies.
    metadata:
      oauthlint-rule-id: AUTH-EXPRESS-002
      oauthlint-doc-url: https://oauthlint.dev/rules/express-trust-proxy-true
      category: security
      cwe: CWE-348
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://expressjs.com/en/guide/behind-proxies.html
        - https://cwe.mitre.org/data/definitions/348.html
      technology:
        - express
    pattern-either:
      - pattern: $APP.set("trust proxy", true)
      - pattern: $APP.enable("trust proxy")
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
  - id: auth.fastify.cookie-session-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      `@fastify/cookie`, `@fastify/session`, or `@fastify/secure-session` is
      registered with a hard-coded `secret` string literal. This key signs the
      session/cookie: anyone who reads it from your source or git history can
      forge signed cookies and impersonate any user.

      Load it from the environment
      (`fastify.register(fastifySession, { secret: process.env.SESSION_SECRET })`)
      or a secret manager, and add a placeholder to `.env.example`. The secret
      must be at least 32 characters. Rotate the leaked value out of source
      control.
    metadata:
      oauthlint-rule-id: AUTH-FASTIFY-002
      oauthlint-doc-url: https://oauthlint.dev/rules/fastify-cookie-session-secret
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      references:
        - https://github.com/fastify/session#options
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fastify
        - "@fastify/cookie"
        - "@fastify/session"
    patterns:
      - pattern: "$F.register($PLUGIN, { ..., secret: $S, ... })"
      - metavariable-regex:
          metavariable: $PLUGIN
          regex: (?i).*(cookie|session)
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: ^['"].*['"]$
            - pattern-not-regex: (?i)^['"]\$\{?[A-Za-z_]+\}?['"]$
            - pattern-not-regex: (?i)^['"]<[^'"]*>['"]$
            - pattern-not-regex: (?i)^['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.fastify.cors-wildcard-credentials
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      `@fastify/cors` is registered with a wildcard/reflected origin
      (`origin: '*'` or `origin: true`) together with `credentials: true`. The
      CORS spec forbids `Access-Control-Allow-Origin: *` with credentials, so
      `origin: true` reflects the caller's origin back instead, effectively
      allowing credentialed cross-site requests from ANYWHERE. That is a
      CSRF / account-takeover primitive.

      Enumerate the exact trusted origins instead:
      `fastify.register(cors, { origin: ['https://app.example.com'], credentials: true })`,
      or pass a function that validates the origin against an allowlist. If the
      API is public and needs no cookies or auth headers, keep `credentials` at
      its default `false`.
    metadata:
      oauthlint-rule-id: AUTH-FASTIFY-003
      oauthlint-doc-url: https://oauthlint.dev/rules/fastify-cors-wildcard-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://github.com/fastify/fastify-cors#options
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
      technology:
        - fastify
        - "@fastify/cors"
    patterns:
      - pattern-either:
          - pattern: '$F.register($PLUGIN, { ..., origin: "*", ..., credentials: true, ... })'
          - pattern: '$F.register($PLUGIN, { ..., credentials: true, ..., origin: "*", ... })'
          - pattern: "$F.register($PLUGIN, { ..., origin: true, ..., credentials: true, ... })"
          - pattern: "$F.register($PLUGIN, { ..., credentials: true, ..., origin: true, ... })"
      - metavariable-regex:
          metavariable: $PLUGIN
          regex: (?i).*cors
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.fastify.jwt-hardcoded-secret
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      `@fastify/jwt` is registered with a hard-coded `secret` string literal.
      This key signs and verifies every token: committed to git it is one search
      away from compromise, letting an attacker forge tokens for any user.

      Load it from the environment instead
      (`fastify.register(fastifyJwt, { secret: process.env.JWT_SECRET })`) and add
      the variable to `.env.example` with a placeholder. Rotate the leaked value
      out of source control. For asymmetric signing pass a key pair
      (`{ private, public }`) read from files or a secret manager, not inline.
    metadata:
      oauthlint-rule-id: AUTH-FASTIFY-001
      oauthlint-doc-url: https://oauthlint.dev/rules/fastify-jwt-hardcoded-secret
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://github.com/fastify/fastify-jwt#usage
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - fastify
        - "@fastify/jwt"
    patterns:
      - pattern: "$F.register($PLUGIN, { ..., secret: $S, ... })"
      - metavariable-regex:
          metavariable: $PLUGIN
          regex: (?i).*jwt
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-regex: ^['"].*['"]$
            - pattern-not-regex: (?i)^['"]\$\{?[A-Za-z_]+\}?['"]$
            - pattern-not-regex: (?i)^['"]<[^'"]*>['"]$
            - pattern-not-regex: (?i)^['"](?:your[-_]|my[-_]|example|placeholder|xxx+|todo|fixme|test|dummy|fake|sample|changeme|change[-_]?me|redacted|replace)
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.fastify.trust-proxy-true
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      Fastify is created with `trustProxy: true`, which trusts EVERY proxy. With
      unbounded trust Fastify believes the `X-Forwarded-For` and
      `X-Forwarded-Proto` headers on any incoming request, so a client can spoof
      its source IP (defeating IP allowlists, rate limiters, and audit logs) and
      spoof `https`, which can trick `secure` session cookies into being sent
      over plain HTTP.

      Set `trustProxy` to the number of proxies actually in front of the app
      (`Fastify({ trustProxy: 1 })`), or to a specific address / subnet / preset
      (`'loopback'`, a CIDR, or an allowlist array), so only your real
      infrastructure is trusted. Never trust all proxies.
    metadata:
      oauthlint-rule-id: AUTH-FASTIFY-004
      oauthlint-doc-url: https://oauthlint.dev/rules/fastify-trust-proxy-true
      category: security
      cwe: CWE-348
      owasp: A05:2021
      llm-prevalence: MEDIUM
      references:
        - https://fastify.dev/docs/latest/Reference/Server/#trustproxy
        - https://cwe.mitre.org/data/definitions/348.html
      technology:
        - fastify
    pattern-either:
      - pattern: "Fastify({ ..., trustProxy: true, ... })"
      - pattern: "fastify({ ..., trustProxy: true, ... })"
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/dev/**"
        - "**/benchmark/**"
        - "**/benchmarks/**"
        - "**/integration/**"
        - "**/*.tst.*"
  - id: auth.flow.basic-auth-in-log
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      HTTP Basic credentials flow into a logging call (`console.*` or
      `logger.*`). The `basic-auth` package returns the decoded `{ name, pass }`
      for the request, and the `Proxy-Authorization` header carries
      base64-encoded `user:password` just like `Authorization` does. Logs are
      written to files, shipped to aggregators (Datadog, Splunk, CloudWatch) and
      read by people and systems that should never see live credentials. The
      base64 is trivially reversible, so a logged Basic header or a logged
      `creds.pass` is a plaintext password leak (CWE-532).

      Never log the raw credential. Redact or mask it before logging, log a
      non-sensitive identifier instead (the username alone, a user id), or drop
      the field entirely.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-014
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-basic-auth-in-log
      category: security
      cwe: CWE-532
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://www.npmjs.com/package/basic-auth
        - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      technology:
        - express
        - basic-auth
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: auth($REQ)
              - pattern: basicAuth($REQ)
              - pattern: auth($REQ).pass
              - pattern: auth($REQ).name
              - pattern: basicAuth($REQ).pass
              - pattern: basicAuth($REQ).name
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|context|c|r)$
      - pattern: $REQ.headers['proxy-authorization']
      - pattern: $REQ.headers["proxy-authorization"]
      - pattern: $REQ.get('proxy-authorization')
      - pattern: $REQ.get('Proxy-Authorization')
      - pattern: $REQ.header('proxy-authorization')
      - pattern: $REQ.header('Proxy-Authorization')
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: console.log(...)
              - pattern: console.info(...)
              - pattern: console.debug(...)
              - pattern: console.warn(...)
              - pattern: console.error(...)
      - patterns:
          - pattern: $LOG.$LEVEL(...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^.*log(?:ger)?$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(?:log|info|debug|warn|warning|error|trace|fatal|verbose|silly)$
    pattern-sanitizers:
      - pattern: $C.name
      - pattern: $C.username
      - pattern: redact(...)
      - pattern: mask(...)
      - pattern: maskToken(...)
      - pattern: $S.slice(...)
      - pattern: $S.substring(...)
      - pattern: $S.substr(...)
  - id: auth.flow.credentials-in-url
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A secret credential is placed in a URL query string. URLs leak into
      server access logs, reverse-proxy logs, browser history, and the
      `Referer` header (sent to every third-party CDN, analytics, and ad
      script on the destination page), so any of `password`, `client_secret`,
      `api_key`, `apikey`, or `secret` in the query is a leaked credential.

      Send credentials in the POST request body or in the `Authorization`
      header. Never in the URL.

      OWASP ASVS V3.2 / CWE-598 explicitly forbid credentials in URL
      parameters.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-009
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-credentials-in-url
      category: security
      cwe: CWE-598
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://owasp.org/www-project-application-security-verification-standard/
    pattern-either:
      - pattern-regex: "[?&](?:password|client_secret|api_key|apikey|secret)="
      - pattern-regex: \.(?:set|append)\s*\(\s*['"`](?:password|client_secret|api_key|apikey|secret)['"`]
  - id: auth.flow.insecure-random
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      `Math.random()` produces a value whose name marks it as
      security-sensitive. The value is assigned to (or computed for) a token,
      a CSRF value, an OAuth `state`, a session id, a nonce, or a
      verification code. `Math.random()` is NOT cryptographically secure and
      is predictable enough for an attacker with enough samples to recover
      the seed.

      Use `crypto.randomBytes(N)` (Node) or `crypto.getRandomValues()`
      (browser) and base64url-encode the result.

      OWASP ASVS V2.5: all security-sensitive random values must come
      from a CSPRNG.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-003
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-insecure-random
      category: security
      cwe: CWE-338
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/338.html
    pattern-either:
      - patterns:
          - pattern: const $NAME = <... Math.random() ...>
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(?:[a-z][a-z0-9_]*)?(?:token|secret|csrf|nonce|sessionid|otp|verificationcode|verifycode|resetcode|apikey|password|salt)[a-z0-9_]*$
      - patterns:
          - pattern: let $NAME = <... Math.random() ...>
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(?:[a-z][a-z0-9_]*)?(?:token|secret|csrf|nonce|sessionid|otp|verificationcode|verifycode|resetcode|apikey|password|salt)[a-z0-9_]*$
      - patterns:
          - pattern: var $NAME = <... Math.random() ...>
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(?:[a-z][a-z0-9_]*)?(?:token|secret|csrf|nonce|sessionid|otp|verificationcode|verifycode|resetcode|apikey|password|salt)[a-z0-9_]*$
      - patterns:
          - pattern: $OBJ.$NAME = <... Math.random() ...>
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(?:[a-z][a-z0-9_]*)?(?:token|secret|csrf|nonce|sessionid|otp|verificationcode|verifycode|resetcode|apikey|password|salt)[a-z0-9_]*$
  - id: auth.flow.no-rate-limit
    languages:
      - javascript
      - typescript
    severity: INFO
    message: |
      A `/login`, `/signin`, `/auth`, or `/reset-password` POST handler is
      registered without any rate-limit middleware in scope. Without a
      rate limit, credential-stuffing and brute-force attacks are
      essentially free for the attacker.

      Add `express-rate-limit`, `@fastify/rate-limit`, or a gateway-level
      WAF rule. Per-IP + per-account is the typical pairing.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-002
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-no-rate-limit
      category: security
      cwe: CWE-307
      owasp: API4:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
      technology:
        - express
        - fastify
    patterns:
      - pattern: $APP.post($PATH, $HANDLER)
      - metavariable-regex:
          metavariable: $PATH
          regex: ^['"][^'"]*\/(?:login|signin|sign-in|signup|sign-up|authenticate|auth|reset-password|forgot-password)(?![a-z-])[^'"]*['"]$
  - id: auth.flow.oauth-credential-in-log
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      An OAuth/OIDC credential from the request flows into a logging call.
      The tainted value is an authorization `code`, an `access_token` /
      `refresh_token` / `id_token`, a bearer `token`, a `client_secret`, or
      the raw `Authorization` header, and the sink is a `console.*` or
      `logger.*` call. Logs are written to files, shipped to aggregators
      (Datadog, Splunk, CloudWatch) and read by people and systems that should
      never see live credentials. A leaked authorization code or token can be
      replayed to impersonate the user or complete the OAuth exchange
      (CWE-532).

      Never log the raw credential. Redact or mask it before logging
      (`token.slice(0, 4) + '…'`), log a non-sensitive identifier instead
      (a user id, a key id), or drop the field entirely.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-013
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-oauth-credential-in-log
      category: security
      cwe: CWE-532
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://datatracker.ietf.org/doc/html/rfc6749#section-10.3
        - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      technology:
        - express
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query.$K
              - pattern: $REQ.body.$K
              - pattern: $REQ.params.$K
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?:code|access[_-]?token|accesstoken|refresh[_-]?token|refreshtoken|id[_-]?token|idtoken|token|client[_-]?secret|clientsecret)$
      - patterns:
          - pattern-either:
              - pattern: $REQ.query[$K]
              - pattern: $REQ.body[$K]
              - pattern: $REQ.params[$K]
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["'](?:code|access[_-]?token|accesstoken|refresh[_-]?token|refreshtoken|id[_-]?token|idtoken|token|client[_-]?secret|clientsecret)["']$
      - pattern: $REQ.headers.authorization
      - pattern: $REQ.headers['authorization']
      - pattern: $REQ.headers["authorization"]
      - pattern: $REQ.get('authorization')
      - pattern: $REQ.get('Authorization')
      - pattern: $REQ.header('authorization')
      - pattern: $REQ.header('Authorization')
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: console.log(...)
              - pattern: console.info(...)
              - pattern: console.debug(...)
              - pattern: console.warn(...)
              - pattern: console.error(...)
      - patterns:
          - pattern: $LOG.$LEVEL(...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^.*log(?:ger)?$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(?:log|info|debug|warn|warning|error|trace|fatal|verbose|silly)$
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
      - pattern: maskToken(...)
      - pattern: $S.slice(...)
      - pattern: $S.substring(...)
      - pattern: $S.substr(...)
  - id: auth.flow.open-redirect
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      Untrusted request input flows into a redirect destination. Because the
      target URL is attacker-controlled, this is an open redirect (CWE-601):
      an attacker can craft a link to your trusted host that bounces the victim
      to an arbitrary external site. That fuels phishing, and in OAuth flows it
      can be chained to steal authorization codes or access tokens by sending
      the victim (and their callback) to a server you do not control.

      Never redirect to a raw `req.query` / `req.body` / `req.params` /
      `req.cookies` / `req.headers` value. Validate the destination against an
      explicit allow-list of hosts or route names, or only allow relative paths
      you control (reject anything containing a scheme or `//`).
    metadata:
      oauthlint-rule-id: AUTH-FLOW-010
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-open-redirect
      category: security
      cwe: CWE-601
      owasp: A01:2021
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/601.html
      technology:
        - express
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              - pattern: $REQ.query.$X
              - pattern: $REQ.params.$X
              - pattern: $REQ.body.$X
              - pattern: $REQ.cookies.$X
              - pattern: $REQ.headers.$X
              - pattern: $REQ.query[$K]
              - pattern: $REQ.params[$K]
              - pattern: $REQ.body[$K]
              - pattern: $REQ.cookies[$K]
              - pattern: $REQ.headers[$K]
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|context|c|event|r)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($SINK)
              - pattern: $RES.redirect($CODE, $SINK)
              - pattern: $RES.location($SINK)
              - pattern: $RES.set('Location', $SINK)
              - pattern: $RES.set("Location", $SINK)
              - pattern: $RES.setHeader('Location', $SINK)
              - pattern: $RES.setHeader("Location", $SINK)
              - pattern: "$RES.writeHead($S, {..., Location: $SINK, ...})"
          - pattern-not: redirect($SINK)
          - pattern-not: redirect($CODE, $SINK)
          - pattern-not: location($SINK)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - pattern: isAllowedUrl(...)
      - pattern: validateRedirect(...)
      - pattern: sanitizeRedirect(...)
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $ALLOW.has($X) ...>) { ... }
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $ALLOW.includes($X) ...>) { ... }
      - patterns:
          - pattern: $X
          - pattern-inside: |
              if (<... $ALLOW.indexOf($X) ...>) { ... }
  - id: auth.flow.password-min-length
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A password validation schema is enforcing a minimum length of less
      than 8 characters. NIST SP 800-63B recommends ≥ 8 characters for
      user-chosen passwords (with NO mandatory complexity rules: length
      is the dominant strength factor). OWASP ASVS V2.1.1 requires ≥ 12
      for high-assurance applications.

      Common LLM-generated mistake: `password: z.string().min(6)` because
      "6 looks reasonable". It isn't. Bump the floor to 8 minimum, 12
      preferred.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-005
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-password-min-length
      category: security
      cwe: CWE-521
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://pages.nist.gov/800-63-3/sp800-63b.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
      technology:
        - zod
        - joi
        - yup
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $Z.string().min($N)
              - pattern: $Z.string().min($N, ...)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N < 8
          - pattern-inside: |
              { ..., password: ..., ... }
      - patterns:
          - pattern-regex: \b(?:password|pwd)\s*\.\s*length\s*[<≤]=?\s*[1-7]\b
  - id: auth.flow.password-plaintext
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A user-supplied password is being persisted WITHOUT being hashed first.
      Storing plaintext passwords means any database read (backup, SQL injection,
      misconfigured backup, contractor with read-only access) leaks every
      credential in one shot.

      Hash with argon2id (recommended), bcrypt, or scrypt before persisting.
      Never use plain SHA-256, MD5, or any unsalted hash for passwords.

      OWASP ASVS V2.4 mandates an adaptive, salted hash. Every modern stack
      ships one. There is no reason to roll your own.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/password-plaintext
      category: security
      cwe: CWE-256
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/256.html
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "$DB.$MODEL.create({..., password: $PWD, ...})"
              - pattern: "$DB.$MODEL.insert({..., password: $PWD, ...})"
              - pattern: "$DB.$MODEL.insertOne({..., password: $PWD, ...})"
              - pattern: "$DB.$MODEL.save({..., password: $PWD, ...})"
              - pattern: "$MODEL.create({..., password: $PWD, ...})"
              - pattern: "$MODEL.insert({..., password: $PWD, ...})"
              - pattern: "$MODEL.save({..., password: $PWD, ...})"
              - pattern: "new $MODEL({..., password: $PWD, ...})"
          - metavariable-regex:
              metavariable: $MODEL
              regex: (?i)user
          - metavariable-pattern:
              metavariable: $PWD
              patterns:
                - pattern-not: $X.hash(...)
                - pattern-not: hash($X, ...)
                - pattern-not: bcrypt.$Y(...)
                - pattern-not: argon2.$Y(...)
                - pattern-not: scrypt.$Y(...)
                - pattern-not: crypto.scrypt(...)
                - pattern-not: await $X.hash(...)
                - pattern-not: await hash($X, ...)
          - metavariable-regex:
              metavariable: $PWD
              regex: (?i)^(?!.*hash).*$
      - patterns:
          - pattern-either:
              - pattern: "$DB.$MODEL.create({..., data: {..., password: $PWD, ...}, ...})"
              - pattern: "$DB.$MODEL.update({..., data: {..., password: $PWD, ...}, ...})"
          - metavariable-regex:
              metavariable: $MODEL
              regex: (?i)user
          - metavariable-pattern:
              metavariable: $PWD
              patterns:
                - pattern-not: $X.hash(...)
                - pattern-not: hash($X, ...)
                - pattern-not: bcrypt.$Y(...)
                - pattern-not: argon2.$Y(...)
                - pattern-not: scrypt.$Y(...)
                - pattern-not: crypto.scrypt(...)
                - pattern-not: await $X.hash(...)
                - pattern-not: await hash($X, ...)
          - metavariable-regex:
              metavariable: $PWD
              regex: (?i)^(?!.*hash).*$
