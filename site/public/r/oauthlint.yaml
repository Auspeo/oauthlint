          - pattern-not: $X != "..."
          - pattern-not: '"..." === $X'
          - pattern-not: '"..." !== $X'
          - pattern-not: '"..." == $X'
          - pattern-not: '"..." != $X'
          - pattern-not: $X === true
          - pattern-not: $X !== true
          - pattern-not: $X == true
          - pattern-not: $X != true
