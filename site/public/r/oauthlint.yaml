  - id: auth.flow.secret-in-log
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A secret-shaped value is passed to a logging call. The logged
      identifier is named like a credential (`password`, `token`, `secret`,
      `apiKey`, `accessToken`, `refreshToken`, `privateKey`, `clientSecret`,
      …) and the sink is a `console.*` or `logger.*` call. Logs are routinely
      written to files, shipped to aggregators (Datadog, Splunk, CloudWatch)
      and read by people who should never see the raw secret. This is a
      textbook credential leak.

      Never log secrets. Redact or mask them before logging
      (`token.slice(0, 4) + '…'`), log a non-sensitive identifier instead
      (a user id, a key id), or drop the field entirely.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-008
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-secret-in-log
      category: security
      cwe: CWE-532
      owasp: API8:2023
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: console.log($...A, $SECRET, $...B)
              - pattern: console.info($...A, $SECRET, $...B)
              - pattern: console.debug($...A, $SECRET, $...B)
              - pattern: console.warn($...A, $SECRET, $...B)
              - pattern: console.error($...A, $SECRET, $...B)
          - metavariable-pattern:
              metavariable: $SECRET
              pattern-regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^(?:password|passwd|pwd|secret|token|apikey|api_key|accesstoken|refreshtoken|privatekey|clientsecret)$
      - patterns:
          - pattern: $LOG.$LEVEL($...A, $SECRET, $...B)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^.*log(?:ger)?$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(?:log|info|debug|warn|warning|error|trace|fatal|verbose|silly)$
          - metavariable-pattern:
              metavariable: $SECRET
              pattern-regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^(?:password|passwd|pwd|secret|token|apikey|api_key|accesstoken|refreshtoken|privatekey|clientsecret)$
      - patterns:
          - pattern-either:
              - pattern: console.log(`...${$SECRET}...`)
              - pattern: console.info(`...${$SECRET}...`)
              - pattern: console.debug(`...${$SECRET}...`)
              - pattern: console.warn(`...${$SECRET}...`)
              - pattern: console.error(`...${$SECRET}...`)
          - metavariable-pattern:
              metavariable: $SECRET
              pattern-regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^(?:password|passwd|pwd|secret|token|apikey|api_key|accesstoken|refreshtoken|privatekey|clientsecret)$
      - patterns:
          - pattern: $LOG.$LEVEL(`...${$SECRET}...`)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^.*log(?:ger)?$
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(?:log|info|debug|warn|warning|error|trace|fatal|verbose|silly)$
          - metavariable-pattern:
              metavariable: $SECRET
              pattern-regex: ^[A-Za-z_$][A-Za-z0-9_$]*$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^(?:password|passwd|pwd|secret|token|apikey|api_key|accesstoken|refreshtoken|privatekey|clientsecret)$
  - id: auth.flow.secret-in-response
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      A server-side secret read from `process.env` flows into an HTTP
      response body. Whatever you put in `res.send` / `res.json` / `res.end`
      ships straight to the client, so returning a credential here publishes
      it to every caller. It ends up in the browser, in proxies, and in any
      logged response (CWE-200, Sensitive Information Exposure).

      Never send a server secret to the client. Return only the data the
      caller needs; if the response must reference a credential, send a
      non-sensitive identifier (a key id, the last four characters) or a
      redacted/masked value instead. Keep API keys, passwords, tokens, and
      private keys server-side only.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-012
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-secret-in-response
      category: security
      cwe: CWE-200
      owasp: API3:2023
      llm-prevalence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
      technology:
        - express
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: process.env.$KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(?!(?:NEXT_PUBLIC|EXPO_PUBLIC|REACT_APP|PUBLIC|VITE)_).*(?:secret|password|passwd|token|api[_-]?key|private[_-]?key|client[_-]?secret|credential|access[_-]?key).*$
      - patterns:
          - pattern: process.env[$K]
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^(?!(?:NEXT_PUBLIC|EXPO_PUBLIC|REACT_APP|PUBLIC|VITE)_).*(?:secret|password|passwd|token|api[_-]?key|private[_-]?key|client[_-]?secret|credential|access[_-]?key).*$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.json($X)
              - pattern: $RES.jsonp($X)
              - pattern: $RES.end($X)
              - pattern: $RES.write($X)
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: mask(...)
  - id: auth.flow.ssrf
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: |
      Untrusted request input flows into the URL of an outbound HTTP request.
      Because the destination is attacker-controlled, this is a Server-Side
      Request Forgery (CWE-918): an attacker can point the request at internal
      services behind your firewall, or at the cloud metadata endpoint
      (http://169.254.169.254/...) to steal IAM/instance credentials and pivot
      deeper into your infrastructure.

      Never build a request URL straight from a raw `req.query` / `req.body` /
      `req.params` / `req.cookies` / `req.headers` value. Validate the
      destination against an explicit allow-list of hosts (resolve the URL and
      check its host against the allow-list, rejecting private/loopback ranges)
      before issuing the request.
    metadata:
      oauthlint-rule-id: AUTH-FLOW-011
      oauthlint-doc-url: https://oauthlint.dev/rules/flow-ssrf
      category: security
      cwe: CWE-918
      owasp: API7:2023
      llm-prevalence: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/918.html
      technology:
        - express
        - axios
        - fetch
    paths:
      exclude:
        - "**/test/**"
        - "**/__tests__/**"
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/example/**"
        - "**/examples/**"
        - "**/demo/**"
        - "**/docs/**"
        - "**/__mocks__/**"
        - "**/mocks/**"
        - "**/vendored/**"
        - "**/node_modules/**"
        - "**/*.stories.*"
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              - pattern: $REQ.query.$X
              - pattern: $REQ.params.$X
              - pattern: $REQ.body.$X
              - pattern: $REQ.cookies.$X
              - pattern: $REQ.headers.$X
              - pattern: $REQ.query[$K]
              - pattern: $REQ.params[$K]
              - pattern: $REQ.body[$K]
              - pattern: $REQ.cookies[$K]
              - pattern: $REQ.headers[$K]
