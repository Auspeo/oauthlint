# OAuthLint — Semgrep rules for the OAuth / OIDC / JWT / session / CORS
# anti-patterns that AI coding tools systematically produce.
#
# swift subset — 8 rules.
#
# Run the full pack with no install:
#   semgrep --config https://oauthlint.dev/r/oauthlint.yaml ./src
#
# Docs:    https://oauthlint.dev/docs/semgrep
# Rules:   https://oauthlint.dev/rules
# License: MIT — https://github.com/Auspeo/oauthlint
#
# Generated from the oauthlint-rules pack. Do not edit by hand.

rules:
  - id: auth.swift.cors.wildcard-with-credentials
    languages:
      - swift
    severity: WARNING
    message: |
      A Vapor `CORSMiddleware.Configuration` combines `allowedOrigin: .all` (the
      `*` wildcard) with `allowCredentials: true`. This tells browsers to send
      cookies and Authorization headers to a resource that accepts every origin,
      which lets any site read authenticated responses on the user's behalf, the
      classic wildcard-plus-credentials CORS misconfiguration (CWE-942). The
      browser will actually refuse `*` with credentials, so AI-generated fixes
      that "reflect the origin" recreate the same hole against every caller.

      Restrict the origin to a known allow-list, e.g.
      `allowedOrigin: .custom("https://app.example.com")` (or `.any([...])`), or
      set `allowCredentials: false` if no cookies/credentials are needed.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-CORS-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-cors-wildcard-with-credentials
      category: security
      cwe: CWE-942
      owasp: API8:2023
      llm-prevalence: MEDIUM
      references:
        - https://docs.vapor.codes/advanced/middleware/
        - https://cwe.mitre.org/data/definitions/942.html
      technology:
        - vapor
    patterns:
      - pattern: CORSMiddleware.Configuration(...)
      - pattern: "CORSMiddleware.Configuration(..., allowedOrigin: .all, ...)"
      - pattern: "CORSMiddleware.Configuration(..., allowCredentials: true, ...)"
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.flow.non-ephemeral-webauth
    languages:
      - swift
    severity: WARNING
    message: |
      An `ASWebAuthenticationSession` explicitly sets
      `prefersEphemeralWebBrowserSession = false`. With a non-ephemeral session
      the OAuth login reuses the shared Safari cookie jar, so a previously
      signed-in account is silently re-selected and the user cannot easily
      switch or fully sign out, a session-confusion / lingering-credential risk
      (CWE-522). AI-generated auth flows toggle this off to "remember" the user
      without considering the shared-cookie consequences.

      Set `prefersEphemeralWebBrowserSession = true` so each authorization runs
      in a private, cookie-isolated session and no credentials persist across
      logins.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-FLOW-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-flow-non-ephemeral-webauth
      category: security
      cwe: CWE-522
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://developer.apple.com/documentation/authenticationservices/aswebauthenticationsession/prefersephemeralwebbrowsersession
        - https://cwe.mitre.org/data/definitions/522.html
      technology:
        - ios
    pattern: $S.prefersEphemeralWebBrowserSession = false
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.flow.oauth-in-wkwebview
    languages:
      - swift
    severity: WARNING
    message: |
      An OAuth / OpenID authorization URL is loaded inside a `WKWebView`. Running
      the login in an embedded web view lets the host app read the page (cookies,
      form fields, redirect with the authorization code) and hides the real
      origin from the user, defeating the isolation an external browser provides;
      it is disallowed by Google and other providers (CWE-1204 / RFC 8252).
      AI-generated flows load the provider's authorize endpoint straight into a
      WKWebView because it is the most direct way to show a login screen.

      Use `ASWebAuthenticationSession` (or `SFSafariViewController`), which runs
      the authorization in the system browser with a shared, isolated session and
      returns via your registered callback URL scheme.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-FLOW-002
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-flow-oauth-in-wkwebview
      category: security
      cwe: CWE-1204
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://datatracker.ietf.org/doc/html/rfc8252
        - https://cwe.mitre.org/data/definitions/1204.html
      technology:
        - ios
    patterns:
      - pattern: $WV.load($REQ)
      - metavariable-regex:
          metavariable: $REQ
          regex: (?i).*(oauth|/authorize|response_type=|client_id=|accounts\.google|login\.microsoftonline|appleid\.apple\.com|/o/oauth2)
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.jwt.hardcoded-hmac-key
    languages:
      - swift
    severity: ERROR
    message: |
      A JWTKit HMAC signing key is registered from a hard-coded string literal
      (`add(hmac: "...", ...)`). `HMACKey` is `ExpressibleByStringLiteral`, so the
      literal becomes the key that signs and verifies every token: committed to
      source control it is one search away from compromise, letting an attacker
      forge a token for any user or role (CWE-798). AI-generated Vapor/JWTKit
      samples inline the secret to make the snippet "just work".

      Read the key from the environment or a secret store instead, e.g.
      `add(hmac: HMACKey(from: Environment.get("JWT_KEY")!), digestAlgorithm: .sha256)`,
      and rotate the leaked secret out of source control.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-JWT-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-jwt-hardcoded-hmac-key
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://github.com/vapor/jwt-kit
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - vapor
        - jwt-kit
    patterns:
      - pattern: '$X.add(hmac: "...", ...)'
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.keychain.insecure-accessible
    languages:
      - swift
    severity: WARNING
    message: |
      A Keychain item is created with `kSecAttrAccessibleAlways` (or
      `kSecAttrAccessibleAlwaysThisDeviceOnly`). "Always" accessibility means the
      item is readable even while the device is locked, widening the window in
      which a lost or seized device can leak the stored credential; both
      constants are deprecated by Apple for exactly this reason (CWE-311).
      AI-generated Keychain snippets often pick "Always" as the most permissive
      option so the sample never fails to read.

      Use the most restrictive class that still works for your access pattern,
      e.g. `kSecAttrAccessibleWhenUnlockedThisDeviceOnly`, so the item is
      available only while the device is unlocked and never syncs off-device.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-KEYCHAIN-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-keychain-insecure-accessible
      category: security
      cwe: CWE-311
      owasp: API2:2023
      llm-prevalence: MEDIUM
      references:
        - https://developer.apple.com/documentation/security/ksecattraccessiblewhenunlockedthisdeviceonly
        - https://cwe.mitre.org/data/definitions/311.html
      technology:
        - ios
    pattern-either:
      - pattern: kSecAttrAccessibleAlways
      - pattern: kSecAttrAccessibleAlwaysThisDeviceOnly
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.secret.hardcoded-credential
    languages:
      - swift
    severity: ERROR
    message: |
      A secret, API key, token, or password is assigned from a hard-coded string
      literal. Committed to source control it is one search away from compromise,
      letting an attacker reuse it against the backing service (CWE-798).
      AI-generated code inlines the value to make the snippet "just work" and it
      ships unchanged.

      Read the value from the environment, an xcconfig / Info.plist build
      setting, or a secret store instead, e.g.
      `ProcessInfo.processInfo.environment["API_KEY"]`, and rotate the leaked
      secret out of source control.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-SECRET-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-secret-hardcoded-credential
      category: security
      cwe: CWE-798
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://developer.apple.com/documentation/security/keychain_services
        - https://cwe.mitre.org/data/definitions/798.html
      technology:
        - ios
    patterns:
      - pattern-either:
          - pattern: let $NAME = "$VAL"
          - pattern: var $NAME = "$VAL"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|apikey|api_key|client_secret|token|password|private_key|access_key)
      - metavariable-regex:
          metavariable: $VAL
          regex: (?i)^(?!.*(?:your[-_]|xxx|placeholder|example|<|\{)).{16,}$
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.storage.token-in-appstorage
    languages:
      - swift
    severity: WARNING
    message: |
      A token, secret, or credential is bound to `@AppStorage`. `@AppStorage` is
      a thin SwiftUI wrapper over `UserDefaults`, so the value lands in an
      unencrypted on-disk plist that is readable from a device backup, a
      jailbroken device, or the simulator container (CWE-312). AI-generated
      SwiftUI code reaches for `@AppStorage` for persistence and unknowingly
      stores authentication material in the clear.

      Keep `@AppStorage` for non-sensitive UI preferences. Store secrets in the
      Keychain (Security framework or a wrapper) and read them into memory when
      needed instead of persisting them through `@AppStorage`.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-STORAGE-002
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-storage-token-in-appstorage
      category: security
      cwe: CWE-312
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://developer.apple.com/documentation/swiftui/appstorage
        - https://cwe.mitre.org/data/definitions/312.html
      technology:
        - swiftui
    patterns:
      - pattern: "@AppStorage($K) var $N = $D"
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
  - id: auth.swift.storage.token-in-userdefaults
    languages:
      - swift
    severity: ERROR
    message: |
      A token, secret, or credential is written to `UserDefaults`. UserDefaults
      is an unencrypted plist on disk (readable from an unlocked device backup,
      a jailbroken device, or the simulator container) and is never an
      appropriate place for authentication material (CWE-312). AI-generated iOS
      code frequently reaches for `UserDefaults.standard.set(...)` because it is
      the simplest key/value store, silently persisting access/refresh tokens in
      the clear. App-group suites (`UserDefaults(suiteName:)`) are just as
      exposed.

      Store secrets in the Keychain instead (via Security framework or a wrapper
      such as KeychainAccess), e.g. `keychain.set(token, key: "authToken")`, and
      keep UserDefaults for non-sensitive preferences only.
    metadata:
      oauthlint-rule-id: AUTH-SWIFT-STORAGE-001
      oauthlint-doc-url: https://oauthlint.dev/rules/swift-storage-token-in-userdefaults
      category: security
      cwe: CWE-312
      owasp: API2:2023
      llm-prevalence: HIGH
      references:
        - https://developer.apple.com/documentation/security/keychain_services
        - https://cwe.mitre.org/data/definitions/312.html
      technology:
        - ios
    pattern-either:
      - patterns:
          - pattern: "UserDefaults.$UD.set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
      - patterns:
          - pattern: "UserDefaults.$UD.set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
      - patterns:
          - pattern: "UserDefaults(...).set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
      - patterns:
          - pattern: "UserDefaults(...).set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
      - patterns:
          - pattern: "UserDefaults(...)!.set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $K
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
      - patterns:
          - pattern: "UserDefaults(...)!.set($V, forKey: $K)"
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^["']?.*(token|secret|auth|jwt|password|credential|refresh|access|apikey|api_key|bearer|client_secret)
    paths:
      exclude:
        - "**/test/**"
        - "**/Tests/**"
        - "**/*Tests.swift"
        - "**/*Test.swift"
        - "**/example/**"
        - "**/examples/**"
