# Plugin coordinates and versions consumed by build.gradle.kts.
pluginGroup=dev.oauthlint
pluginName=OAuthLint
pluginVersion=0.4.1

# Version of the bundled OAuthLint rule pack (mirrors rules/package.json).
# Used as the cache-dir key when the pack is extracted from the plugin jar.
rulesVersion=0.11.0

# Lower bound of supported IntelliJ Platform builds. 242 == 2024.2.
# The UPPER bound is intentionally left OPEN (no until-build) in build.gradle.kts
# so the plugin keeps loading in current and future IDEs (2025.x, 2026.x, ...).
# A capped until-build (the old 243.*) hid the plugin from every 2025.x IDE in
# Marketplace search. Compatibility across the range is proven by the Plugin
# Verifier (build.gradle.kts pluginVerification.ides: 2024.2 -> 2025.2, the
# newest Community release resolvable from the build repository).
pluginSinceBuild=242

# Target IDE the plugin is compiled and test-run against.
platformType=IC
platformVersion=2024.2

# Gradle / JVM ergonomics.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
