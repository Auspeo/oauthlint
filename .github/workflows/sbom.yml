# Software Bill of Materials (CycloneDX). Generates an SBOM for the workspace and
# attaches it to every published GitHub release, so consumers can audit exactly
# what oauthlint is built from. Runs on release publish, and on demand via the
# Actions tab (workflow_dispatch) to verify or refresh it. This does NOT touch the
# npm publish flow; it reacts to a release that already exists.
name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      # Only to attach the SBOM asset to the release that triggered the run.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cdxgen@12.8.4 -t pnpm -o oauthlint-sbom.cdx.json --no-recurse
        env:
          # cdxgen is offline here; do not call external enrichment services.
          FETCH_LICENSE: "false"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: oauthlint-sbom.cdx.json
          retention-days: 30

      - name: Attach SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" oauthlint-sbom.cdx.json --clobber
