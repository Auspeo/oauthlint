name: Deploy
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          TOKEN_URL: "https://auth.example.com/oauth/token"
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          OKTA_CLIENT_SECRET: ${{ secrets.OKTA_CLIENT_SECRET }}
        run: ./deploy.sh
