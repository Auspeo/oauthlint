rules:
  - id: auth.jwt.jose-no-audience
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: |
      A JWT is verified with jose `jwtVerify(...)` but no `audience` option is
      passed, so the `aud` claim is never checked. A token minted for another
      service that trusts the same issuer or signing key can then be replayed
      here: a confused deputy (CWE-345). For an MCP or OAuth 2.1 resource
      server this is exactly the RFC 9068 / RFC 8707 audience binding the spec
      requires.

      Pass the audience you expect (your resource identifier):
        await jwtVerify(token, JWKS, { audience: 'https://mcp.example.com/mcp' });
    # Scoped to jose's `jwtVerify` (its canonical export name), the verifier MCP
    # TypeScript servers use for RFC 9068 tokens. jsonwebtoken's `jwt.verify` is
    # handled by auth.jwt.no-audience; jose `decodeJwt` (no verification) is out
    # of scope. Both the bare import call and the `jose.jwtVerify(...)` member
    # form are covered.
    pattern-either:
      - pattern: jwtVerify($T, $K)
      - pattern: $J.jwtVerify($T, $K)
      - patterns:
          - pattern: jwtVerify($T, $K, $OPTS)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: '{..., audience: ..., ...}'
                - pattern: '{...}'
      - patterns:
          - pattern: $J.jwtVerify($T, $K, $OPTS)
          - metavariable-pattern:
              metavariable: $OPTS
              patterns:
                - pattern-not: '{..., audience: ..., ...}'
                - pattern: '{...}'
    metadata:
      oauthlint-rule-id: AUTH-JWT-013
      oauthlint-doc-url: https://oauthlint.dev/rules/jwt-jose-no-audience
      category: security
      cwe: CWE-345
      owasp: API2:2023
      llm-prevalence: MEDIUM
      technology:
        - jose
      references:
        - https://datatracker.ietf.org/doc/html/rfc9068
        - https://datatracker.ietf.org/doc/html/rfc8707
        - https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
