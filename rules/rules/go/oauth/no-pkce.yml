rules:
  - id: auth.go.oauth.no-pkce
    languages:
      - go
    severity: WARNING
    message: |
      An OAuth authorization URL is built with `golang.org/x/oauth2`
      `Config.AuthCodeURL` WITHOUT a PKCE challenge. Without PKCE an attacker who
      intercepts the authorization code (via a malicious app, a leaky redirect,
      or a compromised network hop) can redeem it for tokens (CWE-345). The
      OAuth 2.1 / Security BCP now require PKCE for every authorization-code
      flow, public or confidential.

      Generate a verifier and pass its challenge to `AuthCodeURL`, then the
      verifier to `Exchange`:
        verifier := oauth2.GenerateVerifier()
        url := conf.AuthCodeURL(state, oauth2.S256ChallengeOption(verifier))
        tok, err := conf.Exchange(ctx, code, oauth2.VerifierOption(verifier))
    # Absence detection, scoped tightly to keep FPs down: fires on an
    # `AuthCodeURL(...)` call that carries no S256 challenge option and no
    # manual `code_challenge` param. A hardcoded/literal state is left to
    # auth.go.oauth.static-state (excluded here) so the two rules do not
    # double-report the same line. `AuthCodeURL` is oauth2-specific, so the
    # method name alone is a strong anchor.
    patterns:
      - pattern: $C.AuthCodeURL(...)
      - pattern-not: $C.AuthCodeURL(..., oauth2.S256ChallengeOption(...), ...)
      - pattern-not: $C.AuthCodeURL(..., oauth2.VerifierOption(...), ...)
      - pattern-not: $C.AuthCodeURL("...", ...)
      - pattern-not-regex: 'code_challenge'
    metadata:
      oauthlint-rule-id: AUTH-GO-OAUTH-004
      oauthlint-doc-url: https://oauthlint.dev/rules/go-oauth-no-pkce
      category: security
      cwe: CWE-345
      owasp: API1:2023
      llm-prevalence: MEDIUM
      technology:
        - oauth2
      references:
        - https://datatracker.ietf.org/doc/html/rfc7636
        - https://datatracker.ietf.org/doc/html/rfc9700#section-2.1.1
        - https://cwe.mitre.org/data/definitions/345.html
