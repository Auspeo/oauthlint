rules:
  - id: auth.iac.gha-oidc-missing-sub
    languages: [json]
    severity: ERROR
    message: >
      This AWS IAM trust policy federates GitHub Actions OIDC
      (token.actions.githubusercontent.com) with an `aud` condition but sets no
      `sub` condition at all, so ANY GitHub repository, owned by anyone, can
      assume this role. The audience check alone is shared by every GitHub
      Actions token and does not identify your repo.

      Add a StringEquals (or StringLike, still pinned) condition on
      token.actions.githubusercontent.com:sub bound to your repository and ref,
      for example repo:ORG/REPO:ref:refs/heads/main. Without it the role is
      effectively public to all of GitHub.
    patterns:
      - pattern: '{"token.actions.githubusercontent.com:aud": "$AUD", ...}'
      - pattern-not-inside: |
          {..., $OP: {..., "token.actions.githubusercontent.com:sub": "$S2", ...}, ...}
    metadata:
      oauthlint-rule-id: AUTH-IAC-002
      oauthlint-doc-url: https://oauthlint.dev/rules/iac-gha-oidc-missing-sub
      category: security
      cwe: CWE-284
      owasp: A01:2021
      llm-prevalence: MEDIUM
      technology:
        - github-actions
        - aws-iam
        - oidc
      references:
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
