rules:
  - id: auth.iac.tf-hardcoded-oauth-secret
    languages: [terraform]
    severity: WARNING
    message: >
      A secret-like attribute (client_secret, token, password, api_key,
      private_key, ...) is assigned a hard-coded string literal in Terraform.
      The value ships in the repository and, because Terraform records
      arguments in state, it also lands in the state file, so it must be
      treated as leaked and rotated.

      Read it from a variable (var.*), a secret-manager data source (AWS
      Secrets Manager, Vault, GCP Secret Manager), or an environment-backed
      input instead, and keep the value out of both the code and the state
      where possible.
    patterns:
      - pattern: $KEY = "$VAL"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(.*_)?(secret|token|password|client_secret|api_?key|private_key)$
      - metavariable-regex:
          metavariable: $VAL
          regex: .{8,}
    metadata:
      oauthlint-rule-id: AUTH-IAC-006
      oauthlint-doc-url: https://oauthlint.dev/rules/iac-tf-hardcoded-oauth-secret
      category: security
      cwe: CWE-798
      owasp: A07:2021
      llm-prevalence: HIGH
      technology:
        - terraform
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://developer.hashicorp.com/terraform/language/state/sensitive-data
