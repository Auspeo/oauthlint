rules:
  - id: auth.iac.gha-oidc-wildcard-sub
    languages: [json]
    severity: ERROR
    message: >
      This AWS IAM trust policy federates GitHub Actions OIDC
      (token.actions.githubusercontent.com) but pins the `sub` claim to a
      wildcard pattern, so any repository, branch, or pull request matching the
      glob can assume this role. A leaked or malicious workflow in a matching
      repo gets your cloud credentials.

      Pin `sub` to an exact ref, for example
      repo:ORG/REPO:ref:refs/heads/main or repo:ORG/REPO:environment:prod, and
      keep the `aud` condition on sts.amazonaws.com. Scope one role per
      repository/environment rather than one wildcard role for many.
    patterns:
      - pattern: '{"token.actions.githubusercontent.com:sub": "$SUB"}'
      - metavariable-regex:
          metavariable: $SUB
          regex: .*\*
    metadata:
      oauthlint-rule-id: AUTH-IAC-001
      oauthlint-doc-url: https://oauthlint.dev/rules/iac-gha-oidc-wildcard-sub
      category: security
      cwe: CWE-284
      owasp: A01:2021
      llm-prevalence: HIGH
      technology:
        - github-actions
        - aws-iam
        - oidc
      references:
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
